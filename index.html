 and crème fraîche"},{"a":"","u":"","n":"onions, thinly sliced"},{"a":"","u":"","n":"diced bacon"},{"a":"","u":"","n":"salt, pepper"}],"st":["Knead all the dough ingredients well in a stand mixer for 5–10 minutes and let rise for about 1 hour.","Heat a baking stone at 300 °C fan (or the highest setting) for about 30 minutes.","Divide the dough into 3 portions and roll out wafer-thin.","Spread with Schmand and crème fraîche, top with onions and bacon and season with salt and pepper.","Slide the tarte onto the hot stone and bake for 5–10 minutes. Check regularly so nothing burns; every oven and stone is a little different."],"hb":["Dough in the fridge: 1–2 days","Bake as soon as it's topped","Freezer: dough up to 3 months"]}},{"id":"bohnen-flammkuchenteig","s":"Pizza, Focaccia, Flammkuchen & Fladenbrot","c":"Frankreich","min":45,"wait":false,"vegan":true,"veg":true,"gf":false,"hp":true,"ges":true,"meal":["a"],"y":[3,"b"],"img":"bohnen-flammkuchenteig.jpg","nut":{"p":24,"kh":97,"z":3,"f":22,"kcal":690},"de":{"t":"Bohnen-Flammkuchenteig","time":"45 Min","per":"pro Flammkuchen (nur Teig)","i":[{"a":"480 g","n":"weisse Bohnen, abgetropft (2 Dosen)"},{"a":"70 ml","n":"Wasser"},{"a":"60 ml","n":"Olivenöl"},{"a":"10 ml (2 TL)","n":"Essig"},{"a":"330 g","n":"Dinkelmehl (halb Vollkorn)"},{"a":"10 g (2½ TL)","n":"Backpulver"},{"a":"9 g (1½ TL)","n":"Salz"},{"a":"","n":"Belag nach Wahl (z. B. Crème fraîche, Zwiebeln, Speck)"}],"st":["Den Backofen auf 200 °C Umluft vorheizen.","Bohnen mit Wasser, Olivenöl und Essig sehr fein pürieren.","Mehl, Backpulver und Salz einarbeiten und zu einem Teig verkneten.","Den Teig in 3 gleich grosse Portionen à ca. 320–340 g teilen und auf Backpapier sehr dünn (2–3 mm) auswallen.","Ca. 12 Minuten vorbacken, bis die Oberfläche leicht trocken und stabil ist.","Belegen und bei 200–220 °C Umluft ca. 10 Minuten fertig backen."],"hb":["Teig im Kühlschrank: 1 Tag","Tiefkühler: vorgebackener Boden bis 2 Monate"]},"en":{"t":"White Bean Tarte Flambée Dough","time":"45 min","per":"per tarte (dough only)","i":[{"a":"480 g","u":"2 cans (15 oz each)","n":"white beans, drained"},{"a":"70 ml","u":"¼ cup + 1 tbsp","n":"water"},{"a":"60 ml","u":"¼ cup","n":"olive oil"},{"a":"10 ml (2 tsp)","u":"2 tsp","n":"vinegar"},{"a":"330 g","u":"2¾ cups","n":"spelt flour (half wholegrain)"},{"a":"10 g (2½ tsp)","u":"2½ tsp","n":"baking powder"},{"a":"9 g (1½ tsp)","u":"1½ tsp","n":"salt"},{"a":"","u":"","n":"topping of your choice (e.g. crème fraîche, onions, bacon)"}],"st":["Preheat the oven to 200 °C fan.","Purée the beans with the water, olive oil and vinegar until very smooth.","Work in the flour, baking powder and salt and knead to a dough.","Divide the dough into 3 equal portions of about 320–340 g and roll out very thinly (2–3 mm) on baking paper.","Pre-bake for about 12 minutes until the surface is slightly dry and firm.","Add the topping and finish baking at 200–220 °C fan for about 10 minutes."],"hb":["Dough in the fridge: 1 day","Freezer: pre-baked base up to 2 months"]}},{"id":"pizzateig-einfach","s":"Pizza, Focaccia, Flammkuchen & Fladenbrot","c":"Italien & Mittelmeer","min":30,"wait":true,"vegan":true,"veg":true,"gf":false,"hp":false,"ges":false,"meal":["a"],"y":[3,"pz"],"img":"pizzateig-einfach.jpg","nut":{"p":19,"kh":117,"z":2,"f":3,"kcal":560},"de":{"t":"Pizzateig einfach","time":"30 Min + 1 Nacht","per":"pro Pizza (nur Teig)","i":[{"a":"500 g","n":"Weissmehl"},{"a":"300 g (300 ml)","n":"lauwarmes Wasser"},{"a":"1–2 g (¼–½ TL)","n":"Trockenhefe"},{"a":"15 g (2½ TL)","n":"Salz"},{"a":"etwas","n":"Olivenöl"}],"st":["Mehl, Wasser und Hefe kurz vermischen und 15 Minuten ruhen lassen.","Das Salz dazugeben und ca. 10 Minuten auf niedriger Stufe kneten. Zum Schluss das Olivenöl einkneten.","Zugedeckt über Nacht gehen lassen.","Den Teig in 3 Portionen teilen und nicht auswallen, sondern durch Ziehen und Dehnen in Form bringen.","Belegen und im möglichst heissen Ofen mit Unterhitze backen."],"hb":["Teig im Kühlschrank: 1–2 Tage","Tiefkühler: Teigkugeln bis 3 Monate, über Nacht im Kühlschrank auftauen"]},"en":{"t":"Easy Pizza Dough","time":"30 min + overnight","per":"per pizza (dough only)","i":[{"a":"500 g","u":"4 cups","n":"white flour (bread or all-purpose)"},{"a":"300 g (300 ml)","u":"1¼ cups","n":"lukewarm water"},{"a":"1–2 g (¼–½ tsp)","u":"¼–½ tsp","n":"dry yeast"},{"a":"15 g (2½ tsp)","u":"2½ tsp","n":"salt"},{"a":"some","u":"some","n":"olive oil"}],"st":["Briefly mix the flour, water and yeast and let rest for 15 minutes.","Add the salt and knead on low speed for about 10 minutes. Finally knead in the olive oil.","Cover and let rise overnight.","Divide the dough into 3 portions and shape them by pulling and stretching rather than rolling.","Add your toppings and bake in the hottest possible oven with bottom heat."],"hb":["Dough in the fridge: 1–2 days","Freezer: dough balls up to 3 months; thaw overnight in the fridge"]}},{"id":"pizzateig","s":"Pizza, Focaccia, Flammkuchen & Fladenbrot","c":"Italien & Mittelmeer","min":120,"wait":true,"vegan":true,"veg":true,"gf":false,"hp":false,"ges":false,"meal":["a"],"y":[4,"pz"],"img":"pizzateig.jpg","nut":{"p":19,"kh":117,"z":2,"f":6,"kcal":590},"de":{"t":"Pizzateig","time":"2 h + 3 Tage gehen","per":"pro Pizza (nur Teig)","i":[{"a":"400 g","n":"Weizenmehl hell (Typ 550)"},{"a":"130 g","n":"Hartweizengriess"},{"a":"100 g","n":"Urdinkelmehl hell"},{"a":"35 g","n":"Dinkelvollkornmehl"},{"a":"5 g (1 TL)","n":"helles Gerstenmalzmehl"},{"a":"500 ml","n":"Wasser"},{"a":"21 g (3½ TL)","n":"Salz"},{"a":"1 g (¼ TL)","n":"Trockenhefe"},{"a":"1 EL (15 ml)","n":"Olivenöl"},{"a":"","n":"Hartweizengriess (Semola) zum Formen"}],"st":["Mehl, Griess und Wasser ohne Salz und Hefe ca. 1 Minute vermischen, bis alles gut vermengt ist.","30–40 Minuten ruhen lassen.","Salz und Trockenhefe dazugeben und ca. 10 Minuten auf niedriger Stufe sanft kneten. Gegen Ende das Olivenöl dazugeben und 2–3 Minuten mitkneten.","1 Stunde ruhen lassen und dabei alle 20 Minuten den Teig ca. 4-mal leicht dehnen und falten (Stretch & Fold).","4 Portionen à 250–270 g abstechen und zu Kugeln formen. Leicht mit Olivenöl einreiben und in 4 Dosen geben; der Teig geht mehr als doppelt auf.","20–30 Minuten bei Raumtemperatur ruhen lassen (bei kühler Raumtemperatur um 20 °C bis zu 1 Stunde).","72 Stunden (3 Tage) im Kühlschrank (3–6 °C) gehen lassen.","Formen und backen:","Den Teig 2 Stunden vor dem Backen aus dem Kühlschrank nehmen.","Den Backofen mit Unterhitze und Umluft auf 270 °C vorheizen.","Den Teig ohne Falten und Kneten aus der Dose stürzen oder mit einem Spachtel herausnehmen. Arbeitsfläche und Teig mit Semola bestreuen und sanft in Form dehnen, nicht auswallen. Lässt er sich schlecht dehnen, kurz ruhen lassen und dann weiterziehen.","Belegen und ca. 8 Minuten auf der untersten Schiene backen."],"hb":["Teig nach der Gehzeit: noch 1 Tag im Kühlschrank","Tiefkühler: Teigkugeln bis 3 Monate, über Nacht im Kühlschrank auftauen"]},"en":{"t":"Pizza Dough (Long Fermentation)","time":"2 h + 3 days rising","per":"per pizza (dough only)","i":[{"a":"400 g","u":"3¼ cups","n":"white bread flour"},{"a":"130 g","u":"¾ cup","n":"durum semolina"},{"a":"100 g","u":"¾ cup + 1 tbsp","n":"white spelt flour"},{"a":"35 g","u":"¼ cup","n":"whole spelt flour"},{"a":"5 g (1 tsp)","u":"1 tsp","n":"light barley malt flour"},{"a":"500 ml","u":"2 cups + 2 tbsp","n":"water"},{"a":"21 g (3½ tsp)","u":"3½ tsp","n":"salt"},{"a":"1 g (¼ tsp)","u":"¼ tsp","n":"dry yeast"},{"a":"1 tbsp (15 ml)","u":"1 tbsp","n":"olive oil"},{"a":"","u":"","n":"semolina for shaping"}],"st":["Mix the flours, semolina and water (without salt and yeast) for about 1 minute until well combined.","Let rest for 30–40 minutes.","Add the salt and yeast and knead gently on low speed for about 10 minutes. Towards the end add the olive oil and knead for another 2–3 minutes.","Let rest for 1 hour, gently stretching and folding the dough about 4 times every 20 minutes.","Divide into 4 portions of 250–270 g and shape into balls. Rub lightly with olive oil and place in 4 containers; the dough more than doubles in size.","Let rest at room temperature for 20–30 minutes (up to 1 hour if the room is cool, around 20 °C).","Let rise in the fridge (3–6 °C) for 72 hours (3 days).","Shaping and baking:","Take the dough out of the fridge 2 hours before baking.","Preheat the oven to 270 °C with bottom heat and fan.","Turn the dough out of its container without folding or kneading, or lift it out with a scraper. Dust the work surface and dough with semolina and stretch gently into shape; don't roll. If it resists, let it rest briefly, then stretch again.","Add your toppings and bake on the lowest rack for about 8 minutes."],"hb":["Dough after rising: 1 more day in the fridge","Freezer: dough balls up to 3 months; thaw overnight in the fridge"]},"var":{"de":"Gehzeit","en":"Rising time","opts":[{"de":{"l":"72 h","time":"2 h + 3 Tage gehen"},"en":{"l":"72 h","time":"2 h + 3 days rising"}},{"de":{"l":"48 h","time":"2 h + 2 Tage gehen","ix":{"7":{"a":"1,5 g (½ TL)","n":"Trockenhefe"}},"sx":{"6":"48 Stunden (2 Tage) im Kühlschrank (3–6 °C) gehen lassen."}},"en":{"l":"48 h","time":"2 h + 2 days rising","ix":{"7":{"a":"1.5 g (½ tsp)","u":"½ tsp","n":"dry yeast"}},"sx":{"6":"Let rise in the fridge (3–6 °C) for 48 hours (2 days)."}}},{"de":{"l":"24 h","time":"2 h + 1 Tag gehen","ix":{"7":{"a":"2,5 g (¾ TL)","n":"Trockenhefe"}},"sx":{"6":"24 Stunden (1 Tag) im Kühlschrank (3–6 °C) gehen lassen."}},"en":{"l":"24 h","time":"2 h + 1 day rising","ix":{"7":{"a":"2.5 g (¾ tsp)","u":"¾ tsp","n":"dry yeast"}},"sx":{"6":"Let rise in the fridge (3–6 °C) for 24 hours (1 day)."}}}]}},{"id":"bohnen-pizzateig","s":"Pizza, Focaccia, Flammkuchen & Fladenbrot","c":"Italien & Mittelmeer","min":45,"wait":false,"vegan":true,"veg":true,"gf":false,"hp":true,"ges":true,"meal":["a"],"y":[3,"pz"],"img":"bohnen-pizzateig.jpg","nut":{"p":24,"kh":97,"z":3,"f":22,"kcal":690},"de":{"t":"Bohnen-Pizzateig","time":"45 Min","per":"   const ing = r.i.map((x,k) => x.h ? `<div class="sub">${esc(x.h)}</div>` : `<div class="it" role="checkbox" tabindex="0" data-k="${k}" aria-checked="${done.has(k)}"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span><span class="a">${amtHTML(x, f, k)}</span><span class="n">${hl(scaleName(x.n, f), qt)}</span></div>`).join('');
  const steps = r.st.map(s => /:$/.test(s) && s.length < 48 ? `<li class="subh">${esc(s.replace(/:$/,''))}</li>` : `<li>${esc(usText(s))}</li>`).join('');
  const uSw = LANG === 'en' ? `<div class="seg useg" role="group" aria-label="${T.unitsL}"><button type="button" data-units="metric" aria-pressed="${!US}">${T.metric}</button><button type="button" data-units="us" aria-pressed="${US}">${T.us}</button></div>` : '';
  $('#sbody').innerHTML = `<section><div class="ingbar"><h4>${T.ing}</h4>${uSw}<span class="prog" id="prog"></span></div><div class="ing" id="ing">${ing}</div></section>` + (steps ? `<section><h4>${T.prep}</h4><ol class="steps">${steps}</ol></section>` : '')
    + (r.hb && r.hb.length ? `<section><h4>${T.keep}</h4><ul class="hb">${r.hb.map(x => { x = usText(x); const k = x.indexOf(': '); return k > 0 && k < 48 ? `<li><b>${esc(x.slice(0,k))}:</b> ${esc(x.slice(k+2))}</li>` : `<li>${esc(x)}</li>`; }).join('')}</ul></section>` : '')
    + (r.nut ? `<section><div class="nutbar"><h4>${T.nut}</h4><span class="per">${esc(r.per || '')}</span></div><div class="nut">${T.nutL.map(([k,l]) => `<div><b>${r.nut[k]}<small>g</small></b><span>${l}</span></div>`).join('')}</div><p class="nutk">${T.nutNote(r.nut.kcal)}</p></section>` : '')
    + ((r.gf && (r.gfn || /hafer|oat/i.test(r.ingText))) ? `<p class="note"><b>${T.gfL}</b> ${r.gfn ? esc(r.gfn) + ' ' : ''}${/hafer|oat/i.test(r.ingText) ? T.oats : ''}</p>` : '')
    + `<p class="note">${T.base(fmt(r.y[0]) + ' ' + unitLabel(r, r.y[0]))}</p>`;
  updateProg();
  $('#yu').textContent = unitLabel(r, curN);
  const changed = Math.abs(f - 1) > 1e-9;
  $('#yreset').hidden = !changed; $('#yreset').textContent = `${T.orig} ${fmt(r.y[0])} ${unitLabel(r, r.y[0])}`;
  $('#wa').href = 'https://wa.me/?text=' + encodeURIComponent(shareText());
}
function setN(v, fromInput, exact){ if(!cur || !(v > 0)) return; curN = Math.min(exact ? v : Math.round(v * 100) / 100, 999); if(!fromInput) $('#yn').value = fmt(curN); renderBody(); }
$('#yn').oninput = e => { const v = pnum(e.target.value); if(v > 0) setN(v, true); };
$('#yn').onblur = () => { $('#yn').value = fmt(curN); };
$('#yup').onclick = () => setN(curN < 1 ? Math.min(1, curN + .25) : Math.floor(curN) + 1);
$('#ydown').onclick = () => setN(curN <= 1 ? Math.max(.25, curN - .25) : Math.ceil(curN) - 1);
$('#yreset').onclick = () => setN(cur.y[0]);
$('#vseg').onclick = e => { const b = e.target.closest('[data-v]'); if(!b) return; curV = +b.dataset.v; renderBody(); };
// checklist
const checked = {};
const ckey = () => cur.id + ':' + curV;
function totalIng(){ return eff().i.filter(x => !x.h).length; }
function updateProg(){ const n = checked[ckey()].size, tot = totalIng(), T = t();
  $('#prog').innerHTML = n ? `${T.progDone(n, tot)}<button type="button" id="uncheck">${T.progReset}</button>` : T.progHint; }
function toggleIng(el){ const k = +el.dataset.k, set = checked[ckey()];
  set.has(k) ? set.delete(k) : set.add(k); el.setAttribute('aria-checked', set.has(k)); updateProg();
  if(set.size === totalIng()){ toast(t().allReady); const id = ckey();
    setTimeout(() => { checked[id] = new Set(); if(cur && ckey() === id) document.querySelectorAll('#ing .it').forEach(e => e.setAttribute('aria-checked','false')), updateProg(); }, 900); } }
$('#sbody').addEventListener('click', e => { const q = e.target.closest('.q'); if(q) return editAmt(q); if(e.target.closest('input.qi')) return; const it = e.target.closest('.it'); if(it) return toggleIng(it);
  if(e.target.id === 'uncheck'){ checked[ckey()] = new Set(); document.querySelectorAll('#ing .it').forEach(x => x.setAttribute('aria-checked','false')); updateProg(); } });
$('#sbody').addEventListener('keydown', e => { const q = e.target.closest('.q'); if(q && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); return editAmt(q); } const it = e.target.closest('.it'); if(it && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); toggleIng(it); } });
// sharing
function shareText(){ const r = eff(), f = factor(), T = t(), TT = T.tagsTxt;
  const tg = [r.vegan ? TT.vegan : r.veg ? TT.veg : '', r.gf ? TT.gf : '', r.hp ? TT.hp : '', r.ges ? TT.ges : ''].filter(Boolean).join(', ');
  let s = `${r.t}\n${T.shFor} ${fmt(curN)} ${unitLabel(r, curN)}${r.vl ? ' · ' + r.vl : ''} · ${T.approx} ${r.time}${tg ? ' · ' + tg : ''}\n\n${T.ing}\n`;
  r.i.forEach(x => { s += x.h ? `\n${x.h}\n` : `- ${[scaleAmt(amtOf(x), f, US), scaleName(x.n, f)].filter(Boolean).join(' ')}\n`; });
  if(r.st.length){ s += `\n${T.prep}\n`; let k = 0; r.st.forEach(y => { s += (/:$/.test(y) && y.length < 48) ? `\n${y}\n` : `${++k}. ${usText(y)}\n`; }); }
  if(r.hb && r.hb.length) s += `\n${T.keep}\n` + r.hb.map(x => `- ${usText(x)}`).join('\n') + '\n';
  if(r.nut) s += `\n${T.shNut({...r.nut, per: r.per})}\n`;
  return s + `\n${T.shFrom}`; }
const shareLink = () => APP_URL + (LANG === 'en' ? '?lang=en' + (US ? '&units=us' : '') : '') + '#' + cur.id;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 1800); }
async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ const ta = document.createElement('textarea'); ta.className = 'copyfallback'; ta.value = text; ta.readOnly = true;
    $('#sbody').prepend(ta); ta.focus(); ta.select(); toast(t().marked); }
}
function menu(open){ $('#menu').hidden = !open; $('#sharebtn').setAttribute('aria-expanded', open); }
$('#sharebtn').onclick = e => { e.stopPropagation(); menu($('#menu').hidden); };
$('#menu').onclick = e => { const b = e.target.closest('[data-share]'); if(b){ const k = b.dataset.share;
    if(k === 'text') copy(shareText(), t().copied); else copy(`${L(cur).t}: ${shareLink()}`, t().linkCopied); }
  menu(false); };
document.addEventListener('click', e => { if(!e.target.closest('.share')) menu(false); });
// keep the screen on while a recipe is open
let wakeLock = null;
async function keepAwake(on){
  try {
    if(on && 'wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && $('#sheet').classList.contains('on')) keepAwake(true); });
// recipe sheet
let lastHash = '';
function openRecipe(id, keep){
  const r = R.find(x => x.id === id); if(!r) return false;
  if(!keep){ cur = r; curN = r.y[0]; curV = 0; } $('#yn').value = fmt(curN); menu(false);
  const vs = $('#vseg'); vs.hidden = !r.var;
  vs.innerHTML = r.var ? `<span class="vl">${esc(r.var[LANG])}</span>` + r.var.opts.map((o,k) => `<button type="button" data-v="${k}">${esc(o[LANG].l)}</button>`).join('') : '';
  const head = $('#shead'); head.style.background = TILE[r.s]; head.className = 'head' + dk(r.s);
  const sheet = $('#sheet'); sheet.style.setProperty('--sc', TILE[r.s]); sheet.style.setProperty('--sl', LIGHT[r.s] || TILE[r.s]);
  $('#ssec').innerHTML = `<span>${esc(secName(r.s))}</span>${r.c ? '<span>·</span><span>' + esc(cuiName(r.c)) + '</span>' : ''}`;
  $('#st').textContent = L(r).t;
  const hero = $('#shero'); hero.hidden = !r.img; if(r.img){ hero.src = imgSrc(r); hero.alt = L(r).t; }
  renderBody();
  if(keep) return true;
  sheet.scrollTop = 0; sheet.classList.add('on'); $('#scrim').classList.add('on'); keepAwake(true); $('#sclose').focus();
  return true;
}
function closeSheet(){ keepAwake(false); $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); $('#filters').classList.remove('on'); }
function closeRecipe(){ const wasOpen = $('#sheet').classList.contains('on'); closeSheet();
  if(wasOpen){ if(lastHash) location.hash = lastHash; else history.replaceState(null,'',location.pathname+location.search); } }
$('#grid').onclick = e => { const c = e.target.closest('.card'); if(!c) return; lastHash = location.hash.slice(1); location.hash = c.dataset.id; };
$('#sclose').onclick = closeRecipe; $('#scrim').onclick = () => { if($('#sheet').classList.contains('on')) closeRecipe(); else closeSheet(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeRecipe(); });
function route(){ let h = location.hash.slice(1);
  if(ALIAS[h]){ h = ALIAS[h]; history.replaceState(null, '', location.pathname + location.search + '#' + h); }
  if(!h){ closeSheet(); st.view='home'; st.chap=null; render(); return; }
  if(h === 'alle'){ closeSheet(); st.view='list'; st.chap=null; render(); return; }
  if(CSLUG[h]){ closeSheet(); st.view='list'; st.chap=CSLUG[h]; render(); return; }
  if(R.some(r => r.id === h)){ if(st.view==='home'){ const r = R.find(x=>x.id===h); st.view='list'; st.chap=r.s; lastHash='k-'+slugify(r.s); render(); } openRecipe(h); } }
window.addEventListener('hashchange', route);
route();
</script>
