<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1b201d"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2"><link rel="manifest" href="manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-title" content="Kochbuch"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Kochbuch Micky &amp; Nils</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: deliberately dark single theme. Home = chapter tiles in book colours; chapter view = filter rail + pastel recipe cards; recipe = paper sheet with coloured head */
:root{
  --bg:#1b201d; --bg2:#232a26; --line:#333b36; --ink:#eef1ec; --muted:#a3ada6;
  --paper:#fbfbf8; --paper-ink:#1f2421; --paper-muted:#6b736d; --paper-line:#e4e7e1;
  --card-ink:#1f2421; --card-muted:#4a524c;
  --accent:#9fd8b8; --hl:#ffe680;
  --vegan:#2f6b1f; --veg:#55701c; --gf:#8a5a10;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.search{flex:1 1 320px;position:relative;min-width:0}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);padding:0 44px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line);width:30px;height:30px;border-radius:50%;cursor:pointer}
.filterbtn{display:none;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);padding:0 18px;cursor:pointer;font-weight:600}
.filterbtn .n{background:var(--accent);color:var(--bg);border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px}

/* home */
.home{padding-block:28px 64px}
.home h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);margin:0 0 4px;letter-spacing:-.01em}
.home p.lead{color:var(--muted);margin:0 0 22px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#quickflt{margin-bottom:24px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.chap{position:relative;border:0;border-radius:18px;padding:0;min-height:128px;cursor:pointer;text-align:left;color:var(--card-ink);display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:transform .12s, box-shadow .12s;overflow:hidden}
.chap:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.chap .cph{aspect-ratio:16/10;width:100%;overflow:hidden;background:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 14px,rgba(0,0,0,0) 14px 28px)}
.chap .cph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.chap:hover .cph img{transform:scale(1.05)}
.chap .cbody{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:14px 16px 14px;flex:1}
.chap.all .cph{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 14px,rgba(255,255,255,0) 14px 28px)}
.chap .nm{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;text-wrap:balance;position:relative}
.chap .sub{font-size:13px;color:var(--card-muted);position:relative;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}
.chap .cnt{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--card-ink);opacity:.85;font-variant-numeric:tabular-nums}
.chap .ex{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chap.dark{color:#fff}.chap.dark .sub,.chap.dark .cnt{color:rgba(255,255,255,.85)}
.chap.all{background:var(--bg2);color:var(--ink);border:1px dashed var(--line)}
.chap.all .sub,.chap.all .cnt{color:var(--muted)}

/* list view */
.list .wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-block:20px 64px}
aside.filters{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:22px;max-height:calc(100vh - 120px);overflow:auto;padding-right:4px}
.fgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;cursor:pointer;font-size:14px}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px);background:var(--bg)}
.textin{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);padding:0 12px}
.textin::placeholder{color:var(--muted)}
.reset{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-align:left}
.lhead{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.back{align-self:flex-start;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.ltitle{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ltitle .sw{width:16px;height:16px;border-radius:5px;flex:none}
.ltitle h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,32px);margin:0;line-height:1.1}
.ltitle .count{color:var(--muted);font-size:14px}
.chapnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chapnav button{flex:none;border:0;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--card-ink);opacity:.55;font-weight:600}
.chapnav button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.chapnav button.dark{color:#fff}
.active{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:0;border-radius:16px;padding:16px 16px 14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .12s, box-shadow .12s;min-width:0;color:var(--card-ink)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card.hasimg{padding-top:0;overflow:hidden}
.card .ph{margin:0 -16px 2px;aspect-ratio:4/3;background:rgba(0,0,0,.08);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .ph img{transform:scale(1.04)}
.sheet .hero:not([hidden])+.head{padding-top:18px}
.sheet .hero{aspect-ratio:16/10;max-height:34vh;width:100%;object-fit:cover;display:block;flex:none}
.card .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--card-muted);font-weight:600}
.card h2{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;margin:0;text-wrap:balance}
.card .match{font-size:12.5px;color:var(--card-muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card mark{background:var(--hl);color:#1f2421;border-radius:3px;padding:0 2px}
.card.dark{color:#fff}.card.dark .sec,.card.dark .match{color:rgba(255,255,255,.82)}
.card.dark .time svg{color:rgba(255,255,255,.8)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.time{font-size:13px;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.time svg{width:14px;height:14px;opacity:.7}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;line-height:1.1;background:rgba(255,255,255,.65)}
.meals{font-size:12.5px;opacity:.75;width:100%}
.quick .chip.meal{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.tag.hp{color:#2d5a8a} .tag.ges{color:#1f7a6a}
.tag.vegan{color:var(--vegan)} .tag.veg{color:var(--veg)} .tag.gf{color:var(--gf)}
.card.dark .tag{background:rgba(255,255,255,.9)}
.empty{padding:48px 0;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,6,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--paper);color:var(--paper-ink);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:-10px 0 40px rgba(0,0,0,.4)}
.sheet.on{transform:none}
.sheet .head{padding:calc(22px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 20px 24px;position:relative;color:var(--card-ink)}
.sheet .head.dark{color:#fff}
.sheet>.head{flex:none}
.sheet .close{z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.2);position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.6);cursor:pointer;font-size:18px;color:#1f2421}
.sheet .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75;display:flex;gap:8px}
.sheet h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;margin:6px 48px 12px 0;text-wrap:balance}
.sheet .body{flex:none;padding:22px max(24px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 24px;display:grid;gap:28px}
.sheet h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.sheet h4::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sc)}
.ing{display:grid;grid-template-columns:24px auto minmax(0,1fr);column-gap:12px;row-gap:2px}
.it{display:contents;cursor:pointer}
.it>span{padding:5px 0;cursor:pointer;transition:color .15s,opacity .15s}
.it .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--paper-line);align-self:center;padding:0;display:grid;place-items:center;transition:background .15s,border-color .15s}
.it .ck svg{width:13px;height:13px;opacity:0;color:#fff}
.it[aria-checked="true"] .ck{background:var(--paper-ink);border-color:var(--paper-ink)}
.it[aria-checked="true"] .ck svg{opacity:1}
.it[aria-checked="true"] .a,.it[aria-checked="true"] .n{opacity:.4;text-decoration:line-through}
.it:focus-visible .ck{outline:2px solid var(--paper-ink);outline-offset:2px}
.ing .a{font-variant-numeric:tabular-nums;color:var(--paper-muted);white-space:nowrap;text-align:right;min-width:4.5em}
.ing .a .q{color:var(--paper-ink);font-weight:600;border-bottom:1.5px dashed var(--sc);padding:0 1px;border-radius:2px;cursor:text}
.ing .a .q:hover{background:color-mix(in srgb,var(--sc) 30%,transparent)}
.ing .a input.qi{width:3.6em;font:inherit;font-weight:600;color:var(--paper-ink);text-align:right;background:#fff;border:1.5px solid var(--sc);border-radius:6px;padding:1px 4px;margin:-2px 0;outline:none}
.it.edit{cursor:default}
.ingbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.ingbar h4{margin:0!important}
.ingbar .prog{font-size:12.5px;color:var(--paper-muted);font-variant-numeric:tabular-nums}
.ingbar button{border:0;background:none;color:var(--paper-muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.ing .sub{grid-column:1/-1;font-family:var(--display);font-weight:700;margin-top:10px;font-size:14px;padding:3px 10px;border-radius:7px;background:var(--sl);justify-self:start}
.ing .sub:first-child{margin-top:0}
.ing mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;max-width:62ch}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--sl);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px;font-variant-numeric:tabular-nums}
.steps li.subh{grid-template-columns:1fr;font-family:var(--display);font-weight:700;margin-top:6px}
.steps li.subh::before{content:none;counter-increment:none}
.note{font-size:12.5px;color:var(--paper-muted);margin:0}
.hb{display:grid;gap:6px;margin:0;padding:0;list-style:none;max-width:62ch}
.hb li{position:relative;padding-left:16px}
.hb li::before{content:'';position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--sl);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.nutbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.nutbar h4{margin:0!important}
.nutbar .per{font-size:12.5px;color:var(--paper-muted)}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nut div{background:var(--sl);border-radius:12px;padding:10px 6px 9px;text-align:center;min-width:0}
.nut b{display:block;font-family:var(--display);font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.nut b small{font-size:12px;font-weight:700;margin-left:1px}
.nut span{display:block;font-size:11.5px;margin-top:3px;color:var(--paper-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nutk{font-size:12.5px;color:var(--paper-muted);margin:8px 0 0}
.done{display:none;height:44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.yield{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.7);border-radius:999px;padding:3px;color:#1f2421}
.yield button{width:32px;height:32px;border-radius:50%;border:0;background:#fff;cursor:pointer;font-size:18px;line-height:1;color:#1f2421;display:grid;place-items:center}
.yield input{width:54px;height:32px;border:0;background:transparent;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:#1f2421}
.yield .u{padding:0 10px 0 2px;font-size:14px;font-weight:600}
.yreset{border:0;background:none;cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0;color:inherit;opacity:.8}
.seg{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.7);border-radius:999px;padding:3px;color:#1f2421}
.seg .vl{font-size:13px;font-weight:600;padding:0 8px 0 10px}
.seg button{height:32px;border:0;border-radius:999px;background:transparent;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;color:#1f2421}
.seg button[aria-pressed="true"]{background:#1f2421;color:#fff}
.share{position:relative}
.sharebtn{height:38px;border-radius:999px;border:0;background:#1f2421;color:#fff;padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.sharebtn svg{width:16px;height:16px}
.menu{position:absolute;top:44px;left:0;background:#fff;color:#1f2421;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;min-width:230px;z-index:5;display:grid}
.menu button,.menu a{border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:inherit;text-decoration:none;display:block}
.menu button:hover,.menu a:hover{background:#f0f2ee}
.menu small{display:block;color:#6b736d;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1f2421;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.copyfallback{width:100%;min-height:120px;font-size:13px;border:1px solid var(--paper-line);border-radius:10px;padding:10px;background:#fff;color:#1f2421}
@media (max-width:860px){
  .list .wrap{grid-template-columns:minmax(0,1fr)}
  body.inlist .filterbtn{display:inline-flex;align-items:center}
  aside.filters{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;background:var(--bg2);z-index:45;border-radius:18px 18px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
  aside.filters.on{transform:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .chapters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chap{min-height:112px}
  .chap .cbody{padding:11px 12px 12px}
  .chap .cph{aspect-ratio:16/10;width:100%;overflow:hidden;background:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 14px,rgba(0,0,0,0) 14px 28px)}
.chap .cph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.chap:hover .cph img{transform:scale(1.05)}
.chap .cbody{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:14px 16px 14px;flex:1}
.chap.all .cph{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 14px,rgba(255,255,255,0) 14px 28px)}
.chap .nm{font-size:17px}
  .chap .cnt{font-size:24px}
  .chap .ex{display:none}
  .sheet h1{font-size:24px}
  .done{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* language & unit switch */
.prefs{display:flex;gap:8px;align-items:center;order:3}
.pill{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--bg2)}
.pill button{height:38px;min-width:42px;padding:0 12px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.pill button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{order:2}.filterbtn{order:4}
.ingbar .useg{margin-left:auto}
.ingbar .useg button{height:28px;font-size:12.5px;padding:0 10px;text-decoration:none;color:#1f2421;border-radius:999px}
.ingbar .useg button[aria-pressed="true"]{background:#1f2421;color:#fff}

Die Suppe mit der Sahne aufkochen. Salz, Pfeffer und Butter dazugeben und mit dem Stabmixer schaumig schlagen. Zum Schluss den Gin dazugeben.","In Tellern anrichten und mit 2–3 Tropfen Basilikumöl und einem Basilikumblatt servieren."],"hb":["Kühlschrank: 2–3 Tage","Tiefkühler: bis 3 Monate, am besten ohne Sahne einfrieren und diese beim Aufwärmen zugeben"]},"en":{"t":"White Tomato Soup","time":"50 min","per":"per serving","i":[{"a":"2","u":"2","n":"onions"},{"a":"2","u":"2","n":"garlic cloves"},{"a":"1 tbsp (15 ml)","u":"1 tbsp","n":"oil"},{"a":"1 kg","u":"2¼ lb","n":"tomatoes"},{"a":"600 ml","u":"2½ cups + 1 tbsp","n":"vegetable stock"},{"a":"1 pinch","u":"1 pinch","n":"sugar"},{"a":"200 ml","u":"¾ cup + 2 tbsp","n":"heavy cream"},{"a":"1 pinch","u":"1 pinch","n":"salt"},{"a":"1 pinch","u":"1 pinch","n":"white pepper"},{"a":"2 tbsp (30 g)","u":"2 tbsp","n":"butter"},{"a":"1 splash","u":"1 splash","n":"gin"},{"a":"","u":"","n":"basil oil and basil leaves to serve"}],"st":["Peel and roughly chop the onions and garlic and sauté them in the oil.","Dice the tomatoes and add them. Add the stock and sugar, bring to the boil and let it infuse for 15–30 minutes.","Strain everything through a kitchen towel and squeeze well. Strain the clear soup again until it is completely clear.","Bring the soup to the boil with the cream. Add salt, pepper and butter and froth with a stick blender. Finally add the gin.","Serve in bowls with 2–3 drops of basil oil and a basil leaf."],"hb":["Fridge: 2–3 days","Freezer: up to 3 months; best frozen without the cream, add it when reheating"]}},{"id":"fischsuppe","s":"Suppen","c":"Frankreich","min":60,"wait":false,"vegan":false,"veg":false,"gf":true,"hp":true,"ges":true,"meal":["a"],"y":[8,"p"],"img":"fischsuppe.jpg","nut":{"p":20,"kh":13,"z":9,"f":14,"kcal":260},"de":{"t":"Fischsuppe","time":"1 h","per":"pro Person","i":[{"a":"2","n":"Zwiebeln"},{"a":"2","n":"Knoblauchzehen"},{"a":"1 EL (15 ml)","n":"Öl"},{"a":"150 g","n":"Tomatenmark"},{"a":"200 ml","n":"Weisswein"},{"a":"4–6 l","n":"Wasser (je nach gewünschter Menge)"},{"a":"3–5","n":"Lorbeerblätter"},{"a":"2–4 EL (30–60 g)","n":"Salz (je nach Wassermenge)"},{"a":"1","n":"Lauchstange"},{"a":"1 (ca. 100 g)","n":"Karotte"},{"a":"1","n":"Fenchelknolle"},{"a":"1","n":"Sellerieknolle"},{"a":"1","n":"Rande (Rote Bete)"},{"a":"1","n":"Topinambur"},{"a":"1","n":"rote Paprika"},{"a":"1","n":"gelbe Paprika"},{"a":"150 ml","n":"Sahne"},{"a":"400 g","n":"Lachs"},{"a":"300 g","n":"festes weisses Fischfilet (z. B. Wolfsbarsch)"}],"st":["Das Gemüse in kleine Stücke schneiden.","Zwiebeln und Knoblauch im Öl kräftig anbraten. Das Tomatenmark kurz mitrösten und mit dem Weisswein ablöschen.","Wasser, Lorbeer, Salz und das restliche Gemüse dazugeben und je nach Grösse der Gemüsestücke 30–50 Minuten köcheln lassen.","Die Sahne dazugeben, abschmecken und nochmals kurz aufkochen.","Den Fisch in Würfel schneiden, in die Suppe geben und darin gar ziehen lassen.","Variante:","Asiatisch abschmecken, ähnlich wie Tom Kha Gai: mit Galgant, Ingwer, Kurkuma und Zitronengras würzen und Kokosmilch statt Sahne verwenden."],"hb":["Kühlschrank: 1–2 Tage","Tiefkühler: Suppe ohne Fisch bis 3 Monate; den Fisch erst beim Aufwärmen frisch zugeben"]},"en":{"t":"Fish Soup","time":"1 h","per":"per serving","i":[{"a":"2","u":"2","n":"onions"},{"a":"2","u":"2","n":"garlic cloves"},{"a":"1 tbsp (15 ml)","u":"1 tbsp","n":"oil"},{"a":"150 g","u":"⅔ cup","n":"tomato paste"},{"a":"200 ml","u":"¾ cup + 2 tbsp","n":"white wine"},{"a":"4–6 l","u":"4–6 quarts","n":"water (depending on how much soup you want)"},{"a":"3–5","u":"3–5","n":"bay leaves"},{"a":"2–4 tbsp (30–60 g)","u":"2–4 tbsp","n":"salt (depending on the amount of water)"},{"a":"1","u":"1","n":"leek"},{"a":"1 (approx. 100 g)","u":"1 (approx. 3½ oz)","n":"carrot"},{"a":"1","u":"1","n":"fennel bulb"},{"a":"1","u":"1","n":"celery root (celeriac)"},{"a":"1","u":"1","n":"beet"},{"a":"1","u":"1","n":"Jerusalem artichoke"},{"a":"1","u":"1","n":"red bell pepper"},{"a":"1","u":"1","n":"yellow bell pepper"},{"a":"150 ml","u":"½ cup + 2 tbsp","n":"heavy cream"},{"a":"400 g","u":"14 oz","n":"salmon"},{"a":"300 g","u":"11 oz","n":"firm white fish fillet (e.g. sea bass)"}],"st":["Cut the vegetables into small pieces.","Fry the onions and garlic in the oil until golden. Briefly toast the tomato paste with them and deglaze with the white wine.","Add the water, bay leaves, salt and the remaining vegetables and simmer for 30–50 minutes, depending on the size of the pieces.","Add the cream, season to taste and bring back to the boil briefly.","Cut the fish into cubes, add to the soup and let it cook through gently.","Variation:","Season it the Asian way, similar to Tom Kha Gai: use galangal, ginger, turmeric and lemongrass, and coconut milk instead of cream."],"hb":["Fridge: 1–2 days","Freezer: soup without fish up to 3 months; add fresh fish when reheating"]}},{"id":"tom-kha-gai","s":"Suppen","c":"Asien","min":35,"wait":false,"vegan":false,"veg":false,"gf":true,"hp":true,"ges":false,"meal":["m","a"],"y":[4,"p"],"img":"tom-kha-gai.jpg","nut":{"p":27,"kh":11,"z":8,"f":39,"kcal":510},"de":{"t":"Tom Kha Gai","time":"35 Min","per":"pro Person","i":[{"a":"5 Stängel","n":"Zitronengras"},{"a":"250 ml","n":"Hühnerbrühe"},{"a":"2 Dosen (à 400 ml)","n":"Kokosmilch"},{"a":"7 cm","n":"Galgant oder Ingwer, geschält, in Scheiben"},{"a":"8","n":"Kaffirlimettenblätter"},{"a":"3","n":"rote Chilischoten, ganz"},{"a":"3 EL (45 ml)","n":"Fischsauce oder etwas Kelppulver"},{"a":"150 g","n":"Champignons, geviertelt"},{"a":"400 g","n":"Hühnerbrust, in kleinen Würfeln oder Streifen"},{"a":"1–2","n":"Limetten (Saft)"},{"a":"1 TL (4 g)","n":"Zucker oder Agavensirup (evtl. mehr)"},{"a":"","n":"frischer Koriander"}],"st":["Das Zitronengras in 4 cm lange Stücke schneiden und mit dem Messerrücken leicht anklopfen.","Brühe und die Hälfte der Kokosmilch aufkochen. Zitronengras, Galgant, Kaffirlimettenblätter und Chilis hineingeben, mit Fischsauce würzen und 10 Minuten köcheln lassen.","Die Pilze dazugeben und weitere 5 Minuten kochen.","Das Hühnerfleisch unterrühren und bei kleiner Hitze wenige Minuten garen, damit es zart bleibt.","Die restliche Kokosmilch dazugeben und mit Limettensaft, Zucker und Fischsauce abschmecken. Mit frischem Koriander servieren.","Variante:","Statt Huhn 500 g Fischfilet, Pilze oder Tofu verwenden."],"hb":["Kühlschrank: 2–3 Tage","Tiefkühler: bis 2 Monate; Kokosmilch trennt sich beim Auftauen etwas, kräftig umrühren"]},"en":{"t":"Tom Kha Gai","time":"35 min","per":"per serving","i":[{"a":"5 stalks","u":"5 stalks","n":"lemongrass"},{"a":"250 ml","u":"1 cup + 1 tbsp","n":"chicken stock"},{"a":"2 cans (400 ml each)","u":"2 cans (13.5 oz each)","n":"coconut milk"},{"a":"7 cm","u":"2¾ in","n":"galangal or ginger, peeled and sliced"},{"a":"8","u":"8","n":"makrut lime leaves"},{"a":"3","u":"3","n":"whole red chilies"},{"a":"3 tbsp (45 ml)","u":"3 tbsp","n":"fish sauce, or a little kelp powder"},{"a":"150 g","u":"5½ oz","n":"button mushrooms, quartered"},{"a":"400 g","u":"14 oz","n":"chicken breast, in small cubes or strips"},{"a":"1–2","u":"1–2","n":"limes (juice)"},{"a":"1 tsp (4 g)","u":"1 tsp","n":"sugar or agave syrup (maybe more)"},{"a":"","u":"","n":"fresh cilantro"}],"st":["Cut the lemongrass into 4 cm pieces and lightly bruise them with the back of a knife.","Bring the stock and half of the coconut milk to the boil. Add the lemongrass, galangal, lime leaves and chilies, season with fish sauce and simmer for 10 minutes.","Add the mushrooms and cook for another 5 minutes.","Stir in the chicken and cook gently over low heat for a few minutes so it stays tender.","Add the remaining coconut milk and season with lime juice, sugar and fish sauce. Serve with fresh cilantro.","Variation:","Use 500 g fish fillet, mushrooms or tofu instead of chicken."],"hb":["Fridge: 2–3 days","Freezer: up to 2 months; the coconut milk separates slightly when thawed, stir well"]}},{"id":"frikadellen","s":"Hauptgerichte","c":"Schweiz & Deutschland","min":40,"wait":false,"vegan":false,"veg":false,"gf":false,"hp":true,"ges":false,"meal":["m","a"],"y":[4,"p"],"img":"frikadellen.jpg","nut":{"p":19,"kh":14,"z":2,"f":17,"kcal":280},"de":{"t":"Frikadellen","time":"40 Min","per":"pro Person","i":[{"a":"250 g","n":"Kartoffeln, gekocht und lauwarm"},{"a":"1","n":"kleine Zwiebel, fein gehackt"},{"a":"2","n":"Knoblauchzehen, fein gehackt"},{"a":"300 g","n":"gemischtes Hackfleisch"},{"a":"2","n":"Eier"},{"a":"1 TL (6 g)","n":"Salz"},{"a":"½ TL (1 g)","n":"Pfeffer"},{"a":"1 EL (15 g)","n":"Senf"},{"a":"1 TL (3 g)","n":"Paniermehl"},{"a":"1 TL (2 g)","n":"Paprikapulver edelsüss"},{"a":"1 Prise","n":"Muskatnuss"},{"a":"1 TL (1 g)","n":"Liebstöckel, getrocknet"},{"a":"3–4 TL (3–4 g)","n":"frische Petersilie, fein gehackt"},{"a":"","n":"Öl zum Braten"}],"st":["Die lauwarmen Kartoffeln durch die Kartoffelpresse drücken.","Alle Zutaten gut vermischen.","Zuerst eine kleine Probe-Frikadelle braten und abschmecken, dann die Masse nachwürzen.","Flache Frikadellen formen und im heissen Öl auf beiden Seiten goldbraun und durch braten."],"hb":["Gebraten im Kühlschrank: 2–3 Tage","Tiefkühler: gebraten bis 3 Monate","Rohe Masse noch am selben Tag verarbeiten"]},"en":{"t":"German Meat Patties (Frikadellen)","time":"40 min","per":"per serving","i":[{"a":"250 g","u":"9 oz","n":"potatoes, boiled and still lukewarm"},{"a":"1","u":"1","n":"small onion, finely chopped"},{"a":"2","u":"2","n":"garlic cloves, finely chopped"},{"a":"300 g","u":"11 oz","n":"mixed ground beef and pork"},{"a":"2","u":"2","n":"eggs"},{"a":"1 tsp (6 g)","u":"1 tsp","n":"salt"},{"a":"½ tsp (1 g)","u":"½ tsp","n":"pepper"},{"a":"1 tbsp (15 g)","u":"1 tbsp","n":"mustard"},{"a":"1 tsp (3 g)","u":"1 tsp","n":"breadcrumbs"},{"a":"1 tsp (2 g)","u":"1 tsp","n":"sweet paprika"},{"a":"1 pinch","u":"1 pinch","n":"nutmeg"},{"a":"1 tsp (1 g)","u":"1 tsp","n":"dried lovage"},{"a":"3–4 tsp (3–4 g)","u":"3–4 tsp","n":"fresh parsley, finely chopped"},{"a":"","u":"","n":"oil for frying"}],"st":["Press the lukewarm potatoes through a potato ricer.","Mix all the ingredients well.","Fry a small test patty first, taste and adjust the seasoning of the mixture.","Shape flat patties and fry them in hot oil on both sides until golden and cooked through."],"hb":["Cooked, in the fridge: 2–3 days","Freezer: cooked, up to 3 months","Use the raw mixture on the same day"]}},{"id":"tomaten-kaese-fondue","s":"Hauptgerichte","c":"Schweiz & Deutschland","min":20,"wait":false,"vegan":false,"veg":true,"gf":true,"hp":true,"ges":false,"meal":["a"],"y":[2,"p"],"img":"tomaten-kaese-fondue.jpg","nut":{"p":36,"kh":12,"z":7,"f":34,"kcal":520},"de":{"t":"Tomaten-Käse-Fondue","time":"20 Min","per":"pro Person","i":[{"a":"1","n":"kleine Knoblauchzehe"},{"a":"300 g","n":"Tomatenpassata"},{"a":"½ TL (0,5 g)","n":"Oregano, getrocknet"},{"a":"110 g","n":"Mozzarella, gerieben"},{"a":"190 g","n":"Edamer, gerieben"},{"a":"¾ EL (6 g)","n":"Speisestärke"},{"a":"1 Prise","n":"Salz"}],"st":["Die Knoblauchzehe schälen, halbieren und den Fonduetopf damit ausreiben. Den Knoblauch danach fein hacken oder pressen.","Passata, Knoblauch und Oregano in den Fonduetopf geben und bei mittlerer Hitze erwärmen.","Mozzarella und Edamer mit der Speisestärke vermischen.","Die Käsemischung portionsweise unter ständigem Rühren dazugeben und bei niedriger bis mittlerer Hitze langsam schmelzen lassen, bis die Masse cremig und gleichmässig ist. Nicht sprudelnd kochen lassen.","Mit Salz abschmecken. Ist das Fondue zu dick, nach und nach etwas warme Passata unterrühren.","Sofort servieren und auf dem Rechaud bei niedriger Temperatur warm halten."],"hb":["Reste im Kühlschrank: 2 Tage","Langsam unter Rühren wieder erwärmen"]},"en":{"t":"Tomato Cheese Fondue","time":"20 min","per":"per serving","i":[{"a":"1","u":"1","n":"small garlic clove"},{"a":"300 g","u":"1¼ cups","n":"tomato passata (strained tomatoes)"},{"a":"½ tsp (0.5 g)","u":"½ tsp","n":"dried oregano"},{"a":"110 g","u":"1 cup","n":"mozzarella, grated"},{"a":"190 g","u":"1¾ cups","n":"Edam, grated"},{"a":"¾ tbsp (6 g)","u":"2¼ tsp","n":"cornstarch"},{"a":"1 pinch","u":"1 pinch","n":"salt"}],"st":["Peel the garlic clove, halve it and rub the inside of the fondue pot with it. Then finely chop or press the garlic.","Put the passata, garlic and oregano in the fondue pot and warm over medium heat.","Toss the mozzarella and Edam with the cornstarch.","Add the cheese mixture in portions, stirring constantly, and let it melt slowly over low to medium heat until creamy and smooth. Do not let it boil.","Season with salt. If the fondue is too thick, stir in a little more warm passata.","Serve immediately and keep warm over a low burner."],"hb":["Leftovers in the fridge: 2 days","Reheat slowly while stirring"]}},{"id":"farce","s":"Hauptgerichte","c":"Frankreich","min":180,"wait":true,"vegan":false,"veg":false,"gf":true,"hp":true,"ges":false,"meal":[],"y":[12,"p"],"img":"farce.jpg","nut":{"p":25,"kh":4,"z":2,"f":15,"kcal":250},"de":{"t":"Farce","time":"3 h + 1 Nacht kühlen","per":"pro Person","i":[{"h":"Fleischmasse"},{"a":"100 g","n":"Schweinegulasch"},{"a":"300 g","n":"Kalbsgulasch"},{"a":"100–200 g","n":"Hühnerleber"},{"a":"300 g","n":"Speckschwarte"},{"a":"2","n":"Zwiebeln"},{"a":"100–200 g","n":"braune Champignons"},{"a":"","n":"Salz, Pfeffer, Paprikapulver, Petersilie (nach Geschmack)"},{"a":"1 Flasche (750 ml)","n":"Rotwein (Bordeaux)"},{"a":"100–200 ml","n":"Cognac"},{"a":"2","n":"Eier"},{"h":"Terrine"},{"a":"300 g","n":"Schweinehals, in grossen dünnen Scheiben (zum Auslegen)"},{"a":"1","n":"Schweinefilet"},{"a":"2–3","n":"Lorbeerblätter"},{"a":"2–3 Zweige","n":"Thymian"}],"st":["Fleischmasse:","Zwiebeln und Champignons grob schneiden.","Das Fleisch portionsweise mit Zwiebeln, Champignons und Gewürzen anbraten, dann mit Rotwein und Cognac ablöschen.","Alles Angebratene zusammen mit der Speckschwarte halbfein durch den Fleischwolf drehen.","Die Masse nochmals abschmecken, dann die Eier unterrühren.","Das Schweinefilet rundum kurz anbraten.","Terrine füllen:","Die Terrinenform mit Schweinehals auslegen und bis zur Hälfte mit Fleischmasse füllen.","Das Schweinefilet in die Mitte legen und mit der restlichen Masse bedecken. Mit dem restlichen Schweinehals ganz zudecken und Thymian und Lorbeer darauflegen.","Garen:","Die Form in ein Wasserbad stellen (mit Zeitungspapier unterlegt) und bei 150 °C Umluft 80 Minuten garen.","Ein Holzbrett auf die Terrine legen, mit 1–2 kg beschweren und über Nacht in den Kühlschrank stellen."],"hb":["Kühlschrank: 5–7 Tage, gut abgedeckt und unangeschnitten eher länger","Tiefkühler: bis 3 Monate, am Stück oder in dicken Scheiben"]},"en":{"t":"Country Terrine (Farce)","time":"3 h + overnight chilling","per":"per serving","i":[{"h":"Meat mixture"},{"a":"100 g","u":"3½ oz","n":"pork stew meat, diced"},{"a":"300 g","u":"11 oz","n":"veal stew meat, diced"},{"a":"100–200 g","u":"3½–7 oz","n":"chicken livers"},{"a":"300 g","u":"11 oz","n":"pork fatback with rind"},{"a":"2","u":"2","n":"onions"},{"a":"100–200 g","u":"3½–7 oz","n":"cremini mushrooms"},{"a":"","u":"","n":"salt, pepper, paprika, parsley (to taste)"},{"a":"1 bottle (750 ml)","u":"1 bottle (3 cups)","n":"red wine (Bordeaux)"},{"a":"100–200 ml","u":"½–¾ cup","n":"cognac"},{"a":"2","u":"2","n":"eggs"},{"h":"Terrine"},{"a":"300 g","u":"11 oz","n":"pork neck, in large thin slices (for lining)"},{"a":"1","u":"1","n":"pork tenderloin"},{"a":"2–3","u":"2–3","n":"bay leaves"},{"a":"2–3 sprigs","u":"2–3 sprigs","n":"thyme"}],"st":["Meat mixture:","Roughly chop the onions and mushrooms.","Brown the meat in batches together with the onions, mushrooms and seasonings, then deglaze with the red wine and cognac.","Put everything, together with the fatback, through a meat grinder (medium plate).","Season the mixture again to taste, then stir in the eggs.","Quickly sear the pork tenderloin on all sides.","Filling the terrine:","Line the terrine mould with the pork neck slices and fill it halfway with the meat mixture.","Lay the tenderloin in the middle and cover it with the rest of the mixture. Cover completely with the remaining pork neck and top with thyme and bay leaves.","Cooking:","Set the mould in a water bath (lined with newspaper) and cook at 150 °C fan for 80 minutes.","Place a wooden board on the terrine, weigh it down with 1–2 kg and refrigerate overnight."],"hb":["Fridge: 5–7 days, well covered; longer if not yet cut","Freezer: up to 3 months, whole or in thick slices"]}},{"id":"meatballs-mit-tomatensauce","s":"Hauptgerichte","c":"Italien & Mittelmeer","min":75,"wait":false,"vegan":false,"veg":false,"gf":false,"hp":true,"ges":false,"meal":["a"],"y":[4,"p"],"img":"meatballs-mit-tomatensauce.jpg","nut":{"p":36,"kh":22,"z":10,"f":37,"kcal":560},"de":{"t":"Meatballs mit Tomatensauce","time":"1 h 15 Min","per":"pro Person","i":[{"h":"Fleischbällchen"},{"a":"500 g","n":"Hackfleisch (Rind oder gemischt)"},{"a":"100 g","n":"Parmaschinken, fein gehackt"},{"a":"50 g","n":"Parmesan, gerieben"},{"a":"1","n":"kleines Brötchen, gewürfelt (oder 1 Scheibe Brot)"},{"a":"½ Bund","n":"Petersilie, gehackt"},{"a":"1 EL (15 g)","n":"Sauerrahm"},{"a":"","n":"Salz, Pfeffer, Muskat"},{"h":"Sauce"},{"a":"1 EL (15 ml)","n":"Öl"},{"a":"1","n":"grosse Zwiebel"},{"a":"4","n":"Knoblauchzehen"},{"a":"1 Stange","n":"Staudensellerie"},{"a":"1 (ca. 100 g)","n":"Karotte"},{"a":"100 ml","n":"Rotwein"},{"a":"1 grosse Dose (800 g)","n":"gehackte Tomaten"},{"a":"1 TL (4 g)","n":"Zucker"},{"a":"½ Bund","n":"Petersilie, gehackt"}],"st":["Fleischbällchen:","Alle Zutaten für die Bällchen gut vermengen und Kugeln in der Grösse eines Tischtennisballs formen.","Sauce:","Zwiebel, Knoblauch, Sellerie und Karotte fein hacken und im Öl anschwitzen.","Mit Rotwein ablöschen und einkochen lassen. Tomaten und Zucker dazugeben und ca. 40–50 Minuten leise köcheln lassen.","Die Sauce abschmecken, die Fleischbällchen hineinlegen und zugedeckt ca. 15 Minuten gar ziehen lassen. Mit Petersilie bestr l. etwas vorgeschnitten) mit dem restlichen Wasser fein mixen und dazugeben. Gehackter Spinat kann auch direkt in die Sauce.","Kurz aufkochen und mit Salz abschmecken. Nach Belieben mit etwas Sahne verfeinern.","Zum Schluss Basilikum, Pinienkerne und Parmesan unterheben."],"hb":["Kühlschrank: 2–3 Tage","Tiefkühler: bis 3 Monate, am besten ohne Parmesan und Pinienkerne einfrieren"]},"en":{"t":"Healthy Green Pesto Sauce","time":"25 min","per":"per serving","i":[{"a":"30 g","u":"3 tbsp","n":"cashews"},{"a":"500 ml","u":"2 cups + 2 tbsp","n":"hot water"},{"a":"1 tbsp (15 ml)","u":"1 tbsp","n":"olive oil"},{"a":"1","u":"1","n":"onion, finely chopped"},{"a":"1 piece","u":"1 piece","n":"leek, finely chopped"},{"a":"2","u":"2","n":"garlic cloves, finely chopped"},{"a":"150 g","u":"5 oz","n":"leaf spinach (frozen or fresh)"},{"a":"optional","u":"optional","n":"other herbs (parsley, chives, wild garlic …)"},{"a":"","u":"","n":"salt"},{"a":"1 bunch","u":"1 bunch","n":"basil, finely chopped"},{"a":"2 tbsp (15 g)","u":"2 tbsp","n":"pine nuts, toasted"},{"a":"2 tbsp (10 g)","u":"2 tbsp","n":"Parmesan, finely grated"},{"a":"optional","u":"optional","n":"heavy cream"}],"st":["Soak the cashews in 250 ml of the hot water for about 10 minutes.","Fry the onion, leek and garlic in the olive oil until lightly browned.","Blend the cashews with their soaking water on the highest setting until smooth, add to the pan and bring to the boil.","Blend the spinach and herbs (roughly chopped first if needed) with the remaining water and add them. Chopped spinach can also go straight into the sauce.","Bring briefly to the boil and season with salt. Add a splash of cream if you like.","Finally fold in the basil, pine nuts and Parmesan."],"hb":["Fridge: 2–3 days","Freezer: up to 3 months; best frozen without the Parmesan and pine nuts"]}},{"id":"adana-kebap","s":"Hauptgerichte","c":"Orient","min":30,"wait":false,"vegan":false,"veg":false,"gf":true,"hp":true,"ges":false,"meal":["m","a"],"y":[4,"p"],"i rk kurz mitrösten.","Kokosmilch und Kichererbsen dazugeben und mit Wasser aufgiessen, bis die gewünschte Konsistenz erreicht ist. Kurz köcheln lassen und mit Salz abschmecken.","Tipp:","Lässt sich mit anderem Gemüse ergänzen, z. B. Lauch, Pilze oder Erbsen."],"hb":["Kühlschrank: 3–4 Tage","Tiefkühler: bis 3 Monate"]},"en":{"t":"Quick Chickpea Curry","time":"25 min","per":"per serving","i":[{"a":"3 tbsp (45 ml)","u":"3 tbsp","n":"oil"},{"a":"2","u":"2","n":"onions, roughly chopped"},{"a":"2","u":"2","n":"garlic cloves, finely chopped"},{"a":"2 (approx. 200 g)","u":"2 (approx. 7 oz)","n":"carrots, finely chopped"},{"a":"1 tsp (2 g)","u":"1 tsp","n":"ground cumin"},{"a":"1 tsp (2 g)","u":"1 tsp","n":"curry powder"},{"a":"1 tsp (2 g)","u":"1 tsp","n":"paprika"},{"a":"1 tsp (2 g)","u":"1 tsp","n":"garam masala"},{"a":"3–4 tbsp (45–60 g)","u":"3–4 tbsp","n":"tomato paste"},{"a":"400 ml","u":"1 can (13.5 oz)","n":"coconut milk"},{"a":"1 can (400 g)","u":"1 can (15 oz)","n":"chickpeas, drained"},{"a":"","u":"","n":"water"},{"a":"","u":"","n":"salt"}],"st":["Sweat the onions, garlic and carrots in the oil. Add the spices and fry for another 5 minutes.","Briefly toast the tomato paste with them.","Add the coconut milk and chickpeas and top up with water to the consistency you like. Simmer briefly and season with salt.","Tip:","You can add other vegetables, e.g. leek, mushrooms or peas."],"hb":["Fridge: 3–4 days","Freezer: up to 3 months"]}},{"id":"indisches-korma","s":"Hauptgerichte","c":"Indien","min":60,"wait":true,"vegan":false,"veg":true,"gf":true,"hp":true,"ges":false,"meal":["a"],"y":[4,"p"],"img":"indisches-korma.jpg","nut":{"p":14,"kh":30,"z":7,"f":26,"kcal":410},"de":{"t":"Indisches Korma","time":"1 h + Marinieren","per":"pro Person","i":[{"h":"Marinade"},{"a":"2 Dosen (à 400 g) Kichererbsen oder 500 g","n":"Fleisch (z. B. Huhn)"},{"a":"3 EL (45 g)","n":"Joghurt"},{"a":"¼ TL (1 g)","n":"Kurkuma"},{"a":"1 TL (2 g)","n":"Garam Masala"},{"a":"1 EL (10 g)","n":"Ingwer und Knoblauch, gerieben"},{"a":"½ TL (3 g)","n":"Salz"},{"a":"","n":"Chili nach Belieben"},{"h":"Saucenbasis"},{"a":"1 EL (15 ml)","n":"Öl"},{"a":"4","n":"Kardamomkapseln"},{"a":"2","n":"grosse Zwiebeln, grob gewürfelt"},{"a":"1 Handvoll (ca. 30 g)","n":"Cashewkerne"},{"a":"10","n":"Mandeln"},{"a":"1 Dose (400 ml)","n":"Kokosmilch"},{"h":"Sauce"},{"a":"1 EL (15 ml)","n":"Öl"},{"a":"1","n":"Lorbeerblatt"},{"a":"¼ TL (0,5 g)","n":"Nelken, gemahlen"},{"a":"½ TL (1 g)","n":"Kardamom, gemahlen"},{"a":"½ TL (1 g)","n":"Garam Masala"},{"a":"½ TL (1 g)","n":"Zimt"},{"a":"¼ TL (0,5 g)","n":"Chilipulver"},{"a":"1½ TL (3 g)","n":"Koriander, gemahlen"},{"a":"200 ml","n":"Wasser"},{"a":"","n":"Salz"},{"a":"3 EL (6 g)","n":"frischer Koriander, geschnitten"}],"st":["Marinieren:","Kichererbsen oder Fleisch mit allen Zutaten der Marinade mischen und mindestens 1–2 Stunden, idealerweise über Nacht, durchziehen lassen.","Saucenbasis:","Kardamomkapseln und Zwiebeln im Öl anbraten, bis die Zwiebeln goldbraun sind und viele Röstaromen haben.","Mit Cashews, Mandeln und Kokosmilch im Mixer fein pürieren.","Sauce:","Lorbeer und die gemahlenen Gewürze kurz im Öl anbraten. Kichererbsen oder Fleisch mit der Marinade dazugeben und mitbraten.","Saucenbasis und Wasser dazugeben und köcheln lassen, bis das Fleisch gar ist bzw. die Sauce die gewünschte Konsistenz hat. Mit Salz abschmecken und mit frischem Koriander servieren."],"hb":["Kühlschrank: 3 Tage","Tiefkühler: bis 3 Monate; schmeckt aufgewärmt oft noch besser"]},"en":{"t":"Indian Korma","time":"1 h + marinating","per":"per serving","i":[{"h":"Marinade"},{"a":"2 cans (400 g each) chickpeas or 500 g","u":"2 cans (15 oz each) chickpeas or 1 lb","n":"meat (e.g. chicken)"},{"a":"3 tbsp (45 g)","u":"3 tbsp","n":"plain yogurt"},{"a":"¼ tsp (1 g)","u":"¼ tsp","n":"turmeric"},{"a":"1 tsp (2 g)","u":"1 tsp","n":"garam masala"},{"a":"1 tbsp (10 g)","u":"1 tbsp","n":"grated ginger and garlic"},{"a":"½ tsp (3 g)","u":"½ tsp","n":"salt"},{"a":"","u":"","n" opped"},{"a":"2 tbsp (25 g)","u":"2 tbsp","n":"sugar"},{"a":"2 tbsp (30 ml)","u":"2 tbsp","n":"soy sauce"},{"a":"1 tsp (5 g)","u":"1 tsp","n":"sambal oelek"},{"a":"2 tbsp (30 ml)","u":"2 tbsp","n":"white vinegar (5 %)"},{"a":"20 g","u":"2 tbsp","n":"red bell pepper, diced"},{"a":"1 piece","u":"1 piece","n":"leek, thinly sliced"},{"a":"100 g","u":"3½ oz","n":"bean sprouts"},{"a":"½ bunch","u":"½ bunch","n":"fresh cilantro"}],"st":["Beef:","Cut the beef into thin strips and mix with the egg, ginger, soy sauce, lemongrass and chili. Cover and leave to marinate briefly.","Quickly mix in the potato starch; the pieces should not stick together.","Immediately deep-fry the beef in hot oil until crisp and drain on paper towels.","Sauce:","Briefly fry the garlic in the oil without letting it brown. Add the sugar, soy sauce, sambal oelek and vinegar, bring to the boil and reduce briefly.","Add the fried beef, bell pepper, leek and bean sprouts, toss briefly and serve immediately with cilantro while the beef is still crisp."],"hb":["Fridge: 1–2 days; the coating goes soft","Best eaten fresh"]}},{"id":"gebratene-nudeln","s":"Hauptgerichte","c":"Asien","min":15,"wait":true,"vegan":false,"veg":true,"gf":false,"hp":false,"ges":false,"meal":["m","a"],"y":[4,"p"],"img":"gebratene-nudeln.jpg","nut":{"p":13,"kh":45,"z":6,"f":15,"kcal":370},"de":{"t":"Gebratene Nudeln","time":"15 Min + Nudeln vorkochen","per":"pro Person","i":[{"a":"500 g","n":"gekochte, gut abgetrocknete asiatische Nudeln"},{"a":"3 EL (45 ml)","n":"neutrales Öl"},{"a":"3","n":"Eier"},{"a":"2","n":"kleine Knoblauchzehen, fein gehackt"},{"a":"Optional 2","n":"Frühlingszwiebeln, in Ringen"},{"h":"Sauce"},{"a":"3 EL (45 ml)","n":"Sojasauce"},{"a":"1½ EL (22 ml)","n":"Wasser"},{"a":"1½ TL (6 g)","n":"Zucker"},{"a":"¾ TL (4 ml)","n":"Sesamöl"}],"st":["Die Nudeln vorher kochen, idealerweise am Vortag, sonst mindestens gut auskühlen lassen. Mindestens 1 Minute kürzer kochen als auf der Packung angegeben, damit sie nicht matschig werden.","Die Zutaten für die Sauce verrühren.","Das Öl in einer Pfanne auf mittlere bis mittelhohe Hitze bringen; es soll heiss sein, aber nicht rauchen.","Die Eier hineingeben, kurz verrühren und 10–15 Sekunden stocken lassen.","Die Nudeln dazugeben, verteilen und 30 Sekunden nicht rühren, damit sie anbraten. Dann wenden und lockern, Knoblauch und Frühlingszwiebeln kurz unterrühren.","Die Sauce am Pfannenrand eingiessen, kurz aufkochen lassen und alles durchschwenken, bis die Nudeln gleichmässig gefärbt sind. Nicht zu lange braten, sonst werden sie trocken. Sofort servieren."],"hb":["Kühlschrank: 2–3 Tage","In der heissen Pfanne kurz aufbraten"]},"en":{"t":"Fried Noodles","time":"15 min + pre-cooking noodles","per":"per serving","i":[{"a":"500 g","u":"1⅛ lb","n":"cooked, well-dried Asian noodles"},{"a":"3 tbsp (45 ml)","u":"3 tbsp","n":"neutral oil"},{"a":"3","u":"3","n":"eggs"},{"a":"2","u":"2","n":"small garlic cloves, finely chopped"},{"a":"optional 2","u":"optional 2","n":"scallions, sliced"},{"h":"Sauce"},{"a":"3 tbsp (45 ml)","u":"3 tbsp","n":"soy sauce"},{"a":"1½ tbsp (22 ml)","u":"1½ tbsp","n":"water"},{"a":"1½ tsp (6 g)","u":"1½ tsp","n":"sugar"},{"a":"¾ tsp (4 ml)","u":"¾ tsp","n":"sesame oil"}],"st":["Cook the noodles in advance, ideally the day before, or at least let them cool completely. Cook them at least 1 minute less than the packet says so they don't go mushy.","Stir together the sauce ingredients.","Heat the oil in a pan over medium to medium-high heat; it should be hot but not smoking.","Add the eggs, stir briefly and let them set for 10–15 seconds.","Add the noodles, spread them out and leave for 30 seconds without stirring so they brown. Then toss and loosen them, and briefly stir in the garlic and scallions.","Pour the sauce in around the edge of the pan, let it bubble briefly and toss until the noodles are evenly coated. Don't fry too long or they will dry out. Serve immediately."],"hb":["Fridge: 2–3 days","Reheat briefly in a hot pan"]}},{"id":"miso-ramen-mit-chicken-katsu","s":"Hauptgerichte","c":"Asien","min":50,"wait":false,"vegan":false,"veg":false,"gf":false,"hp":true,"ges":false,"meal":["a"],"y":[2,"p"],"img":"miso-ramen-mit-chicken-katsu.jpg","nut":{"p":63,"kh":82,"z":18,"f":35,"kcal":900},"de":{"t":"Miso Ramen mit Chicken Katsu","time":"50 Min","per":"pro Person","i":[{"h":"Brühe"},{"a":"1 EL (15 ml)","n":"Öl"},{"a":"1","n":"Schalotte, fein gehackt"},{"a":"2","n":"Knoblauchzehen, fein gehackt"},{"a":"1 EL (6 g)","n":"Ingwer, gerieben"},{"a":"2 EL (36 g)","n":"weisse Misopaste"},{"a":"1 EL (20 g)","n":"scharfe Chilipaste (Gochujang)"},{"a":"2 EL (18 g)","n":"geröstete Sesamsamen"},{"a":"900 ml","n":"Hühnerbrühe"},{"a":"160 ml","n":"Kokosmilch"},{"h":"Chicken Katsu"},{"a":"300 g","n":"Hähnchen- oder Putenbrust"},{"a":"1","n":"Ei, leicht verquirlt"},{"a":"50 g","n":"Panko"},{"a":"1 EL (9 g)","n":"geröstete Sesamsamen"},{"a":"etwas","n":"Salz, Pfeffer, Paprika-, Zwiebel- und Knoblauchpulver"},{"a":"","n":"Öl zum Braten"},{"h":"Nudeln und Toppings"},{"a":"90 g","n":"Ramen-Nudeln (2 Portionen)"},{"a":"2–3","n":"braune Champignons, in Scheiben"},{"a":"2","n":"Eier"},{"a":"1","n":"Pak Choi"},{"a":"1","n":"Frühlingszwiebel, in Ringen"},{"a":"Optional","n":"geröstetes Sesamöl, Sesamsamen, Crispy Chili Oil"}],"st":["Brühe:","Schalotte, Knoblauch und Ingwer im Öl andünsten. Miso, Chilipaste und Sesam dazugeben und kurz rösten.","Mit Brühe und Kokosmilch aufgiessen und 10–15 Minuten köcheln lassen.","Chicken Katsu:","Das Fleisch der Dicke nach halbieren. Panko, Sesam und Gewürze mischen.","Das Fleisch zuerst durch das Ei ziehen, dann in der Panko-Mischung wenden und im Öl goldbraun braten.","Die Pilze in derselben Pfanne braun anbraten.","Toppings und Anrichten:","Die Eier 6 Minuten weich kochen, abschrecken, schälen und halbieren.","Die Ramen-Nudeln garen und den Pak Choi kurz mitkochen.","Nudeln und Brühe in Schalen verteilen, das Katsu in Streifen darauflegen. Mit Pilzen, Pak Choi, Ei und Frühlingszwiebel belegen und nach Belieben mit Sesamöl, Sesam oder Chiliöl verfeinern."],"hb":["Brühe im Kühlschrank: 3 Tage, im Tiefkühler bis 3 Monate","Nudeln, Katsu und Toppings getrennt aufbewahren und frisch zubereiten","Katsu im Ofen bei 200 °C wieder knusprig machen"]},"en":{"t":"Miso Ramen with Chicken Katsu","time":"50 min","per":"per serving","i":[{"h":"Broth"},{"a":"1 tbsp (15 ml)","u":"1 tbsp","n":"oil"},{"a":"1","u":"1","n":"shallot, finely chopped"},{"a":"2","u":"2","n":"garlic cloves, finely chopped"},{"a":"1 tbsp (6 g)","u":"1 tbsp","n":"ginger, grated"},{"a":"2 tbsp (36 g)","u":"2 tbsp","n":"white miso paste"},{"a":"1 tbsp (20 g)","u":"1 tbsp","n":"hot chili paste (gochujang)"},{"a":"2 tbsp (18 g)","u":"2 tbsp","n":"toasted sesame seeds"},{"a":"900 ml","u":"3¾ cups + 1 tbsp","n":"chicken stock"},{"a":"160 ml","u":"⅔ cup","n":"coconut milk"},{"h":"Chicken katsu"},{"a":"300 g","u":"11 oz","n":"chicken or turkey breast"},{"a":"1","u":"1","n":"egg, lightly beaten"},{"a":"50 g","u":"¾ cup","n":"panko"},{"a":"1 tbsp (9 g)","u":"1 tbsp","n":"toasted sesame seeds"},{"a":"some","u":"some","n":"salt, pepper, paprika, onion and garlic powder"},{"a":"","u":"","n":"oil for frying"},{"h":"Noodles and toppings"},{"a":"90 g","u":"3¼ oz","n":"ramen noodles (2 portions)"},{"a":"2–3","u":"2–3","n":"cremini mushrooms, sliced"},{"a":"2","u":"2","n":"eggs"},{"a":"1","u":"1","n":"bok choy"},{"a":"1","u":"1","n":"scallion, sliced"},{"a":"optional","u":"optional","n":"toasted sesame oil, sesame seeds, crispy chili oil"}],"st":["Broth:","Sauté the shallot, garlic and ginger in the oil. Add the miso, chili paste and sesame and toast briefly.","Pour in the stock and coconut milk and simmer for 10–15 minutes.","Chicken katsu:","Halve the chicken horizontally. Mix the panko, sesame and seasonings.","Dip the chicken first in the egg, then coat it in the panko mixture and fry in the oil until golden brown.","Brown the mushrooms in the same pan.","Toppings and serving:","Boil the eggs for 6 ","Press through a potato ricer (ideal) or mash with a masher.","Work the butter into the hot potatoes until melted.","Gradually stir in the warm (not cold!) milk until creamy. Add 1–2 tbsp of the cooking water if needed.","Season well with salt, add nutmeg and white pepper to taste and whisk for 20–30 seconds to lighten it."],"hb":["Fridge: 2–3 days","Freezer: up to 2 months; stir in a little milk and butter when reheating"]}},{"id":"semmelknoedel","s":"Beilagen","c":"Schweiz & Deutschland","min":60,"wait":false,"vegan":false,"veg":true,"gf":false,"hp":false,"ges":false,"meal":[],"y":[8,"kn"],"img":"semmelknoedel.jpg","nut":{"p":6,"kh":21,"z":5,"f":6,"kcal":160},"de":{"t":"Semmelknödel","time":"1 h","per":"pro Knödel","i":[{"a":"250 g","n":"altbackene Brötchen, gewürfelt"},{"a":"250 ml","n":"Milch"},{"a":"2","n":"Eier"},{"a":"","n":"Salz, Pfeffer, Muskat"},{"a":"1","n":"Zwiebel, fein gehackt"},{"a":"1 EL (15 g)","n":"Butter"},{"a":"2 EL (6 g)","n":"Petersilie, gehackt"}],"st":["Milch, Eier und Gewürze gut verquirlen, über die Brotwürfel giessen, vermengen und ca. 20 Minuten ziehen lassen.","Inzwischen die Zwiebel in der Butter glasig dünsten, etwas abkühlen lassen und mit der Petersilie zur Brotmasse geben. Alles gut vermengen.","Mit feuchten Händen 8 Knödel formen, dabei gut festdrücken und aussen glätten, damit sie nicht zerfallen.","Wasser mit einem Dämpfeinsatz in einen gut schliessenden Topf geben, die Knödel daraufsetzen und ca. 30 Minuten im Dampf garen."],"hb":["Kühlschrank: 2–3 Tage","Tiefkühler: gekocht bis 3 Monate","Reste in Scheiben in Butter anbraten"]},"en":{"t":"Bread Dumplings (Semmelknödel)","time":"1 h","per":"per dumpling","i":[{"a":"250 g","u":"5 cups","n":"stale bread rolls, diced"},{"a":"250 ml","u":"1 cup + 1 tbsp","n":"milk"},{"a":"2","u":"2","n":"eggs"},{"a":"","u":"","n":"salt, pepper, nutmeg"},{"a":"1","u":"1","n":"onion, finely chopped"},{"a":"1 tbsp (15 g)","u":"1 tbsp","n":"butter"},{"a":"2 tbsp (6 g)","u":"2 tbsp","n":"parsley, chopped"}],"st":["Whisk the milk, eggs and seasonings well, pour over the bread cubes, mix and leave to soak for about 20 minutes.","Meanwhile sauté the onion in the butter until translucent, let it cool a little and add it to the bread mixture with the parsley. Mix well.","With wet hands, shape 8 dumplings, pressing firmly and smoothing the outside so they don't fall apart.","Put water and a steamer insert in a pot with a tight-fitting lid, place the dumplings on it and steam for about 30 minutes."],"hb":["Fridge: 2–3 days","Freezer: cooked, up to 3 months","Fry leftover slices in butter"]}},{"id":"spaetzli-knoepfli","s":"Beilagen","c":"Schweiz & Deutschland","min":45,"wait":false,"vegan":false,"veg":true,"gf":false,"hp":false,"ges":false,"meal":[],"y":[4,"p"],"img":"spaetzli-knoepfli.jpg","nut":{"p":24,"kh":90,"z":4,"f":10,"kcal":550},"de":{"t":"Spätzli / Knöpfli","time":"45 Min","per":"pro Person","i":[{"a":"500 g","n":"Hartweizen- oder Dinkelgriess"},{"a":"1 TL (6 g)","n":"Salz"},{"a":"5","n":"Eier"},{"a":"150 ml","n":"Wasser"},{"a":"150 ml","n":"Milch"}],"st":["Alle Zutaten mit der Küchenmaschine schlagen, bis der Teig Blasen wirft.","Den Teig 30 Minuten ruhen lassen.","Mit dem Spätzlischaber oder -hobel portionsweise ins kochende Salzwasser geben und kochen, bis die Spätzli oben schwimmen. Mit einer Schaumkelle herausheben."],"hb":["Gekocht im Kühlschrank: 2–3 Tage","Tiefkühler: gekocht bis 3 Monate, direkt gefroren in Butter anbraten"]},"en":{"t":"Spätzle (Swiss Knöpfli)","time":"45 min","per":"per serving","i":[{"a":"500 g","u":"2¾ cups","n":"durum or spelt semolina"},{"a":"1 tsp (6 g)","u":"1 tsp","n":"salt"},{"a":"5","u":"5","n":"eggs"},{"a":"150 ml","u":"½ cup + 2 tbsp","n":"water"},{"a":"150 ml","u":"½ cup + 2 tbsp","n":"milk"}],"st":["Beat all the ingredients in a stand mixer until the batter forms bubbles.","Let the batter rest for 30 minutes.","Scrape the batter in portions into boiling salted water using a spätzle maker and cook until the spätzle float. Lift out with a slotted spoon."],"hb":["Cooked, in the fridge: 2–3 days","Freezer: cooked, up to 3 months; fry in butter straight from frozen"]}},{"id":"nudelteig","s":"Beilagen","c":"Italien & Mittelmeer","min":90,"wait":false,"vegan":false,"veg":true,"gf":false,"hp":false,"ges":false,"meal":[],"y":[5,"p"],"img":"nudelteig.jpg","nut":{"p":15,"kh":70,"z":1,"f":5,"kcal":390},"de":{"t":"Nudelteig","time":"1 h 30 Min","per":"pro Person","i":[{"a":"300 g","n":"Hartweizengriess"},{"a":"200 g","n":"Mehl (Typ 550)"},{"a":"3","n":"Eier"},{"a":"etwas","n":"kaltes Wasser"}],"st":["Griess, Mehl und Eier mit den Knethaken des Handrührgeräts zu streuselartigen Krümeln verrühren.","Teelöffelweise kaltes Wasser dazugeben und weiterkneten, bis kein trockener Griess und kein trockenes Mehl mehr zu sehen ist.","Die Krümel von Hand zu einem festen Teig kneten, zur Kugel formen und in Folie mindestens 1 Stunde kühl stellen.","Den Teig in Portionen à 80–100 g durch die Nudelmaschine geben, einmal falten und wieder durchdrehen, insgesamt ca. 10–15-mal. Anfangs reisst der Teig noch; nach dem 4. oder 5. Durchgang wird er geschmeidig. Er soll nicht kleben, dann braucht es auch kein Mehl.","Erst jetzt den Walzenabstand bis zur gewünschten Dicke verringern (z. B. Stufe 5 bei KitchenAid) und die Pasta schneiden oder formen.","Die Pasta auf einem Ständer oder mit Mehl bestäubt locker auslegen und vor dem Kochen ca. 30 Minuten antrocknen lassen."],"hb":["Roher Teig im Kühlschrank: 1–2 Tage","Frische Nudeln getrocknet: 2–4 Wochen; im Tiefkühler bis 3 Monate"]},"en":{"t":"Fresh Pasta Dough","time":"1 h 30 min","per":"per serving","i":[{"a":"300 g","u":"1⅔ cups","n":"durum semolina"},{"a":"200 g","u":"1⅔ cups","n":"flour (bread flour)"},{"a":"3","u":"3","n":"eggs"},{"a":"some","u":"some","n":"cold water"}],"st":["Mix the semolina, flour and eggs with the dough hooks of a hand mixer into crumbly bits.","Add cold water a teaspoon at a time and keep kneading until there is no dry semolina or flour left.","Knead the crumbs by hand into a firm dough, shape into a ball, wrap and chill for at least 1 hour.","Pass the dough through the pasta machine in 80–100 g portions, fold once and roll again, about 10–15 times in total. At first it tears; after the 4th or 5th pass it becomes smooth. It shouldn't be sticky, then you won't need extra flour.","Only now reduce the roller gap to the thickness you want (e.g. setting 5 on a KitchenAid) and cut or shape the pasta.","Hang the pasta on a rack or lay it out loosely dusted with flour and let it dry for about 30 minutes before cooking."],"hb":["Raw dough in the fridge: 1–2 days","Fresh pasta, dried: 2–4 weeks; in the freezer up to 3 months"]}},{"id":"backofen-fenchel","s":"Beilagen","c":"Italien & Mittelmeer","min":25,"wait":false,"vegan":false,"veg":true,"gf":true,"hp":false,"ges":true,"meal":[],"y":[2,"p"],"img":"backofen-fenchel.jpg","nut":{"p":4,"kh":7,"z":4,"f":12,"kcal":150},"de":{"t":"Backofen-Fenchel","time":"25 Min","per":"pro Person","i":[{"a":"1","n":"Fenchelknolle"},{"a":"1","n":"Zwiebel"},{"a":"1 Handvoll (ca. 50 g)","n":"Feta, zerbröckelt"},{"a":"1–2 EL (15–30 ml)","n":"Olivenöl"},{"a":"","n":"Salz, Pfeffer"}],"st":["Den Backofen auf 220 °C Umluft vorheizen.","Fenchel und Zwiebel in ganz feine Scheiben hobeln.","Alle Zutaten vermengen und gleichmässig auf einem grossen Backblech verteilen.","15–20 Minuten goldbraun und knusprig backen."],"hb":["Kühlschrank: 2–3 Tage","Kurz im Ofen aufwärmen"]},"en":{"t":"Roasted Fennel with Feta","time":"25 min","per":"per serving","i":[{"a":"1","u":"1","n":"fennel bulb"},{"a":"1","u":"1","n":"onion"},{"a":"1 handful (approx. 50 g)","u":"1 handful (⅓ cup)","n":"feta, crumbled"},{"a":"1–2 tbsp (15–30 ml)","u":"1–2 tbsp","n":"olive oil"},{"a":"","u":"","n":"salt, pepper"}],"st":["Preheat the oven to 220 °C fan.","Slice the fennel and onion very thinly.","Mix all the ingredients and spread evenly on a large baking sheet.","Bake for 15–20 minutes until golden and crisp."],"hb":["Frid r"},{"a":"2","n":"Eier"},{"a":"2 Pkg (14 g)","n":"Trockenhefe"},{"a":"1 TL (6 g)","n":"Salz"},{"a":"800 g","n":"Mehl"},{"h":"Füllung"},{"a":"150 g","n":"Butter"},{"a":"250 g","n":"brauner Zucker"},{"a":"5 TL (13 g)","n":"Zimt"},{"h":"Frosting"},{"a":"200 g","n":"Frischkäse"},{"a":"100 g","n":"weiche Butter"},{"a":"100 g","n":"Puderzucker"},{"a":"½","n":"Zitrone (Saft)"}],"st":["Teig:","Die Milch aufkochen. Das Puddingpulver mit dem kalten Wasser glatt rühren, in die kochende Milch einrühren und unter ständigem Rühren kurz kochen, bis der Pudding eindickt.","Vom Herd nehmen und die Butter einrühren, bis sie geschmolzen ist. Zucker und Eier unterrühren.","Abkühlen lassen, bis die Masse nur noch handwarm ist, dann die Trockenhefe einrühren.","Salz und Mehl mischen, die Puddingmasse dazugeben und zu einem weichen, leicht klebrigen Teig kneten.","Zugedeckt 1–2 Stunden gehen lassen, bis sich der Teig verdoppelt hat.","Füllen und formen:","Die Butter für die Füllung schmelzen. Zimt und braunen Zucker mischen.","Den Teig halbieren. Eine Hälfte auf einer gut bemehlten Fläche auswallen, mit der Hälfte der Butter bestreichen und mit der Hälfte der Zimt-Zucker-Mischung bestreuen.","Eng aufrollen und in ca. 4 cm breite Stücke schneiden. Mit der zweiten Teighälfte gleich verfahren.","Die Schnecken versetzt auf ein mit Backpapier belegtes Blech setzen, so dass sie sich nach dem Gehen ganz leicht berühren. Nochmals 30 Minuten gehen lassen.","Backen:","In der Zwischenzeit den Backofen auf 200 °C Umluft vorheizen.","Ca. 20 Minuten backen, nicht zu dunkel werden lassen.","Frosting:","Frischkäse, Butter, Puderzucker und Zitronensaft cremig rühren und auf die noch warmen Zimtschnecken streichen."],"hb":["In der Dose: 1–2 Tage; kurz im Ofen aufwärmen","Mit Frischkäse-Frosting im Kühlschrank: 3–4 Tage","Tiefkühler: ohne Frosting bis 3 Monate"]},"en":{"t":"Cinnamon Rolls","time":"3 h","per":"per piece","i":[{"h":"Dough"},{"a":"500 ml","u":"2 cups + 2 tbsp","n":"milk"},{"a":"2 packets (37 g each)","u":"2 packets (1⅓ oz each; or 10 tbsp cornstarch + vanilla)","n":"vanilla pudding powder (cook type)"},{"a":"100 ml","u":"¼ cup + 3 tbsp","n":"cold water"},{"a":"120 g","u":"½ cup + 1 tbsp","n":"butter"},{"a":"5 tbsp (60 g)","u":"5 tbsp","n":"sugar"},{"a":"2","u":"2","n":"eggs"},{"a":"2 packets (14 g)","u":"2 packets (4½ tsp)","n":"dry yeast"},{"a":"1 tsp (6 g)","u":"1 tsp","n":"salt"},{"a":"800 g","u":"6½ cups","n":"flour"},{"h":"Filling"},{"a":"150 g","u":"⅔ cup","n":"butter"},{"a":"250 g","u":"1¼ cups (packed)","n":"brown sugar"},{"a":"5 tsp (13 g)","u":"5 tsp","n":"cinnamon"},{"h":"Frosting"},{"a":"200 g","u":"7 oz","n":"cream cheese"},{"a":"100 g","u":"7 tbsp","n":"soft butter"},{"a":"100 g","u":"¾ cup + 1 tbsp","n":"powdered sugar"},{"a":"½","u":"½","n":"lemon (juice)"}],"st":["Dough:","Bring the milk to the boil. Whisk the pudding powder into the cold water until smooth, stir it into the boiling milk and cook briefly, stirring constantly, until thickened.","Remove from the heat and stir in the butter until melted. Stir in the sugar and eggs.","Let cool until just lukewarm, then stir in the yeast.","Mix the salt and flour, add the pudding mixture and knead to a soft, slightly sticky dough.","Cover and let rise for 1–2 hours until doubled.","Filling and shaping:","Melt the butter for the filling. Mix the cinnamon and brown sugar.","Halve the dough. Roll out one half on a well-floured surface, brush with half of the butter and sprinkle with half of the cinnamon sugar.","Roll up tightly and cut into slices about 4 cm wide. Repeat with the second half of the dough.","Place the rolls, staggered, on a lined baking sheet so they just touch once risen. Let rise for another 30 minutes.","Baking:","Meanwhile preheat the oven to 200 °C fan.","Bake for about 20 minutes; don't let them get too dark.","Frosting:","Beat the cream cheese, butter, powdered sugar and lemon juice until creamy and spread over the still-warm rolls."],"hb":["In a tin: 1–2 days; warm briefly in the oven","With cream cheese frosting in the fridge: 3–4 days","Freezer: without frosting up to 3 months"]}},{"id":"zucchini-vollkorn-kuchen","s":"Kuchen","c":"","min":90,"wait":false,"vegan":false,"veg":true,"gf":false,"hp":false,"ges":true,"meal":[],"y":[1,"k"],"img":"zucchini-vollkorn-kuchen.jpg","nut":{"p":6,"kh":30,"z":14,"f":15,"kcal":280},"de":{"t":"Zucchini-Vollkornkuchen","time":"1 h 30 Min","per":"pro Stück (1/12 Kuchen)","i":[{"a":"3","n":"Eier, zimmerwarm"},{"a":"120 g","n":"Zucker"},{"a":"1 Pkg (8 g)","n":"Vanillezucker"},{"a":"1 Prise","n":"Salz"},{"a":"120 ml","n":"neutrales Öl"},{"a":"180 g","n":"Joghurt (3,5 %)"},{"a":"1–2 TL (1–2 g)","n":"Instant-Espressopulver"},{"a":"260 g","n":"Vollkornmehl (Dinkel oder Weizen)"},{"a":"40 g","n":"Backkakao, ungesüsst"},{"a":"1 Pkg (15 g)","n":"Backpulver"},{"a":"½ TL (2,5 g)","n":"Natron"},{"a":"2 TL (5 g)","n":"Zimt"},{"a":"350 g","n":"Zucchini, fein geraspelt (nicht ausdrücken)"},{"a":"50 g","n":"dunkle Schokotropfen oder -stückchen"},{"a":"1 EL (15 ml)","n":"Apfelessig oder Zitronensaft"}],"st":["Den Backofen auf 175 °C Ober-/Unterhitze vorheizen und die Form vorbereiten.","Eier, Zucker, Vanillezucker und Salz 3–4 Minuten hell und luftig aufschlagen.","Das Öl langsam einlaufen lassen. Joghurt mit Espressopulver mischen und unterrühren.","Mehl, Kakao, Backpulver, Natron und Zimt mischen und nur kurz unterheben, damit die Luft im Teig bleibt.","Die geraspelten Zucchini vorsichtig einarbeiten und die Schokotropfen unterheben.","Den Teig 5 Minuten ruhen lassen, damit das Mehl die Flüssigkeit aufnimmt. Dann den Apfelessig kurz unterrühren.","In die Form füllen und ca. 55–65 Minuten backen. Stäbchenprobe: Wenn kein Teig mehr kleben bleibt, ist der Kuchen fertig."],"hb":["Gut eingepackt bei Raumtemperatur: 2–3 Tage, danach im Kühlschrank noch 2–3 Tage","Tiefkühler: bis 3 Monate"]},"en":{"t":"Wholegrain Chocolate Zucchini Cake","time":"1 h 30 min","per":"per slice (1/12 cake)","i":[{"a":"3","u":"3","n":"eggs, at nd place a top on each."],"hb":["In a cookie tin, cool and dry: 3–4 weeks; they become nicely tender after a few days","Put baking paper between the layers so they don't stick together"]}},{"id":"kekse-zum-ausstechen","s":"Kekse & Süsses","c":"Schweiz & Deutschland","min":60,"wait":true,"vegan":false,"veg":true,"gf":false,"hp":false,"ges":false,"meal":["s"],"y":[1,"b"],"img":"kekse-zum-ausstechen.jpg","nut":{"p":1,"kh":8,"z":2,"f":3,"kcal":60},"de":{"t":"Kekse zum Ausstechen","time":"1 h + 1 h kühlen","per":"pro Keks (ca. 15 g)","i":[{"h":"Teig"},{"a":"100 g","n":"weiche Butter"},{"a":"60 g","n":"Zucker"},{"a":"1","n":"Ei"},{"a":"1 Prise","n":"Salz"},{"a":"Optional","n":"Vanille oder abgeriebene Zitronenschale"},{"a":"250 g","n":"Mehl"},{"h":"Zimt-Zuckerguss (optional)"},{"a":"120 g","n":"Puderzucker"},{"a":"1 TL (2,5 g)","n":"Zimt"},{"a":"2–3 EL (30–45 ml)","n":"Wasser oder Milch"},{"a":"Optional","n":"1 winzige Prise Vanille oder Salz (rundet den Geschmack ab)"}],"st":["Teig:","Butter und Zucker cremig rühren.","Ei, Salz und nach Belieben Vanille oder Zitronenschale dazugeben und schaumig rühren.","Das Mehl unterkneten. Den Teig in Folie wickeln und 1–2 Stunden kalt stellen.","Den Teig 6–8 mm dick auswallen, Formen ausstechen und auf ein mit Backpapier belegtes Blech legen.","Backen:","Den Backofen auf 180 °C Ober-/Unterhitze vorheizen.","Die Kekse 8–10 Minuten backen.","Auf einem Gitter vollständig auskühlen lassen.","Zimt-Zuckerguss (optional):","Den Puderzucker sieben (wichtig für einen glatten Guss) und Zimt sowie nach Belieben Vanille oder Salz untermischen.","Nach und nach Wasser oder Milch einrühren, bis ein dickflüssiger, streich- oder spritzbarer Guss entsteht. Für dickeren Guss mehr Puderzucker, für dünneren mehr Flüssigkeit nehmen.","Den Guss mit Löffel, Pinsel oder Spritztüte auf die ausgekühlten Kekse auftragen und trocknen lassen."],"hb":["In der Blechdose, kühl und trocken: 4–6 Wochen","Gut zum Verschenken"]},"en":{"t":"Cut-Out Butter Cookies","time e"},{"a":"1 TL (4 g)","n":"Zucker"},{"h":"Hauptteig"},{"a":"5 g (1 EL)","n":"Flohsamenschalen"},{"a":"30 ml","n":"Wasser (zum Quellen)"},{"a":"150 ml","n":"Pflanzenmilch"},{"a":"35–40 g","n":"Zucker"},{"a":"60 ml","n":"Rapsöl"},{"a":"370 g","n":"Weizenmehl (Typ 405)"},{"a":"30 g","n":"Hafermehl"},{"a":"10 g (1¾ TL)","n":"Salz"},{"a":"50 g","n":"Karotten, gehäckselt"},{"a":"100 g","n":"Rote Bete, gehäckselt"},{"a":"10 g (1 EL)","n":"Hanfsamen, geschält"},{"h":"Zum Bestreichen"},{"a":"","n":"Pflanzenmilch"},{"a":"","n":"Sesam"}],"st":["Vorteig:","Alle Zutaten für den Vorteig mischen und zugedeckt 30–60 Minuten bei Raumtemperatur stehen lassen.","Hauptteig:","Die Flohsamenschalen mit 30 ml Wasser 5–10 Minuten quellen lassen.","Pflanzenmilch, Zucker und Rapsöl zum Vorteig geben und kurz verrühren.","Die restlichen Zutaten und die gequollenen Flohsamen dazugeben und 10–12 Minuten kneten. Der Teig soll sehr weich und leicht klebrig sein; bei Bedarf 1–2 EL Wasser dazugeben.","Zugedeckt 4–4½ Stunden gehen lassen; nach Belieben nach 2 Stunden sanft dehnen und falten.","Formen und backen:","Den Teig in ca. 10 Buns à 100–110 g formen, flach gedrückt auf Backpapier legen, mit Pflanzenmilch bestreichen und mit Sesam bestreuen. Nochmals ca. 1½ Stunden gehen lassen.","Den Backofen auf 190 °C Ober-/Unterhitze vorheizen.","Ca. 15 Minuten backen, dann bei 160 °C weitere 5 Minuten backen.","Direkt nach dem Backen leicht mit Pflanzenmilch bestreichen und abdecken, damit sie weich bleiben."],"hb":["In der Dose: 2–3 Tage","Tiefkühler: bis 3 Monate"]},"en":{"t":"Vegan Burger Buns","time":"7 h 30 min","per":"per piece","i":[{"h":"Starter"},{"a":"100 ml","u":"¼ cup + 3 tbsp","n":"plant milk (soy or oat)"},{"a":"100 g","u":"¾ cup + 1 tbsp","n":"flour"},{"a":"½ packet (3.5 g)","u":"1 tsp","n":"dry yeast"},{"a":"1 tsp (4 g)","u":"1 tsp","n":"sugar"},{"h":"Main dough"},{"a":"5 g (1 tbsp)","u":"1 tbsp","n":"psyllium husk"},{"a":"30 ml","u":"2 tbsp","n":"water (for soaking)"},{"a":"150 ml","u":"½ cup + 2 tbsp","n":"plant milk"},{"a":"35–40 g","u":"3 tbsp","n":"sugar"},{"a":"60 ml","u":"¼ cup","n":"canola oil"},{"a":"370 g","u":"3 cups","n":"flour"},{"a":"30 g","u":"⅓ cup","n":"oat flour"},{"a":"10 g (1¾ tsp)","u":"1¾ tsp","n":"salt"},{"a":"50 g","u":"⅓ cup","n":"carrots, finely chopped"},{"a":"100 g","u":"⅔ cup","n":"beet, finely chopped"},{"a":"10 g (1 tbsp)","u":"1 tbsp","n":"hulled hemp seeds"},{"h":"Topping"},{"a":"","u":"","n":"plant milk"},{"a":"","u":"","n":"sesame seeds"}],"st":["Starter:","Mix all the starter ingredients, cover and leave at room temperature for 30–60 minutes.","Main dough:","Soak the psyllium husk in 30 ml water for 5–10 minutes.","Add the plant milk, sugar and oil to the starter and stir briefly.","Add the remaining ingredients and the soaked psyllium and knead for 10–12 minutes. The dough should be very soft and slightly sticky; add 1–2 tbsp water if needed.","Cover and let rise for 4–4½ hours; if you like, gently stretch and fold after 2 hours.","Shaping and baking:","Shape the dough into about 10 buns of 100–110 g, flatten them slightly on baking paper, brush with plant milk and sprinkle with sesame. Let rise again for about 1½ hours.","Preheat the oven to 190 °C conventional.","Bake for about 15 minutes, then another 5 minutes at 160 °C.","Right after baking, brush lightly with plant milk and cover so they stay soft."],"hb":["In a container: 2–3 days","Freezer: up to 3 months"]}},{"id":"pao-de-queijo","s":"Brot","c":"Amerika","min":45,"wait":false,"vegan":false,"veg":true,"gf":true,"hp":false,"ges":false,"meal":["s"],"y":[30,"s"],"img":"pao-de-queijo.jpg","nut":{"p":4,"kh":10,"z":0,"f":4,"kcal":90},"de":{"t":"Pão de Queijo","time":"45 Min","per":"pro Stück","i":[{"a":"125 ml","n":"Wasser"},{"a":"125 ml","n":"Milch"},{"a":"65 g","n":"Butter"},{"a":"1 TL (6 g)","n":"Salz"},{"a":"200 g","n":"Polvilho doce (süsses Tapiokamehl)"},{"a":"200 g","n":"Polvilho azedo (saures Tapiokamehl)"},{"a":"2","n":"Eier"},{"a":"200 g","n":"geriebener Käse (Parmesan und Gouda)"},{"a":"1 TL (4 g)","n":"Backpulver"}],"st":["Den Backofen auf 180 °C Umluft vorheizen und ein Blech mit Backpapier belegen.","Wasser, die Hälfte der Milch, Butter und Salz aufkochen und vom Herd nehmen.","Das Tapiokamehl dazugeben und mit einem Holzlöffel kurz unterrühren.","Eier, restliche Milch und Backpulver dazugeben und gut verkneten.","Zum Schluss den Käse am besten mit den Händen einarbeiten. Der Teig soll noch leicht klebrig sein.","Mit einem Esslöffel oder Eisportionierer Kugeln formen und mit etwas Abstand aufs Blech setzen.","20–25 Minuten backen, bis sie aussen knusprig und innen ganz weich sind.","Tipp:","Das Verhältnis von Polvilho doce und azedo kann beliebig verändert werden (z. B. auch nur doce)."],"hb":["Am besten frisch und warm","Tiefkühler: roh geformt bis 3 Monate; gefroren direkt backen, 3–5 Min länger"]},"en":{"t":"Pão de Queijo (Brazilian Cheese Bread)","time":"45 min","per":"per piece","i":[{"a":"125 ml","u":"½ cup","n":"water"},{"a":"125 ml","u":"½ cup","n":"milk"},{"a":"65 g","u":"4½ tbsp","n":"butter"},{"a":"1 tsp (6 g)","u":"1 tsp","n":"salt"},{"a":"200 g","u":"1⅔ cups","n":"polvilho doce (sweet tapioca starch)"},{"a":"200 g","u":"1⅔ cups","n":"polvilho azedo (sour tapioca starch)"},{"a":"2","u":"2","n":"eggs"},{"a":"200 g","u":"2 cups","n":"grated cheese (Parmesan and Gouda)"},{"a":"1 tsp (4 g)","u":"1 tsp","n":"baking powder"}],"st":["Preheat the oven to 180 °C fan and line a baking sheet.","Bring the water, half of the milk, the butter and salt to the boil and remove from the heat.","Add the tapioca starch and stir briefly with a wooden spoon.","Add the eggs, the rest of the milk and the baking powder and knead well.","Finally work in the cheese, ideally with your hands. The dough should still be slightly sticky.","Shape balls with a tablespoon or ice-cream scoop and place them on the sheet with some space between them.","Bake for 20–25 minutes until crisp outside and very soft inside.","Tip:","You can c
