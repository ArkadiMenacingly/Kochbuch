<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1b201d"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Kochbuch"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Kochbuch Micky &amp; Nils</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: deliberately dark single theme. Home = chapter tiles in book colours; chapter view = filter rail + pastel recipe cards; recipe = paper sheet with coloured head */
:root{
  --bg:#1b201d; --bg2:#232a26; --line:#333b36; --ink:#eef1ec; --muted:#a3ada6;
  --paper:#fbfbf8; --paper-ink:#1f2421; --paper-muted:#6b736d; --paper-line:#e4e7e1;
  --card-ink:#1f2421; --card-muted:#4a524c;
  --accent:#9fd8b8; --hl:#ffe680;
  --vegan:#2f6b1f; --veg:#55701c; --gf:#8a5a10;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.search{flex:1 1 320px;position:relative;min-width:0}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);padding:0 44px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line);width:30px;height:30px;border-radius:50%;cursor:pointer}
.filterbtn{display:none;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);padding:0 18px;cursor:pointer;font-weight:600}
.filterbtn .n{background:var(--accent);color:var(--bg);border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px}

/* home */
.home{padding-block:28px 64px}
.home h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);margin:0 0 4px;letter-spacing:-.01em}
.home p.lead{color:var(--muted);margin:0 0 22px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.chap{position:relative;border:0;border-radius:18px;padding:18px 18px 16px;min-height:128px;cursor:pointer;text-align:left;color:var(--card-ink);display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:transform .12s, box-shadow .12s;overflow:hidden}
.chap:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.chap .nm{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;text-wrap:balance;position:relative}
.chap .sub{font-size:13px;color:var(--card-muted);position:relative;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}
.chap .cnt{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--card-ink);opacity:.85;font-variant-numeric:tabular-nums}
.chap .ex{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chap.dark{color:#fff}.chap.dark .sub,.chap.dark .cnt{color:rgba(255,255,255,.85)}
.chap.all{background:var(--bg2);color:var(--ink);border:1px dashed var(--line)}
.chap.all .sub,.chap.all .cnt{color:var(--muted)}

/* list view */
.list .wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-block:20px 64px}
aside.filters{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:22px;max-height:calc(100vh - 120px);overflow:auto;padding-right:4px}
.fgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;cursor:pointer;font-size:14px}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px);background:var(--bg)}
.textin{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);padding:0 12px}
.textin::placeholder{color:var(--muted)}
.reset{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-align:left}
.lhead{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.back{align-self:flex-start;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.ltitle{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ltitle .sw{width:16px;height:16px;border-radius:5px;flex:none}
.ltitle h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,32px);margin:0;line-height:1.1}
.ltitle .count{color:var(--muted);font-size:14px}
.chapnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chapnav button{flex:none;border:0;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--card-ink);opacity:.55;font-weight:600}
.chapnav button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.chapnav button.dark{color:#fff}
.active{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:0;border-radius:16px;padding:16px 16px 14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .12s, box-shadow .12s;min-width:0;color:var(--card-ink)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card.hasimg{padding-top:0;overflow:hidden}
.card .ph{margin:0 -16px 2px;aspect-ratio:4/3;background:rgba(0,0,0,.08);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .ph img{transform:scale(1.04)}
.sheet .hero:not([hidden])+.head{padding-top:18px}
.sheet .hero{aspect-ratio:16/10;max-height:34vh;width:100%;object-fit:cover;display:block;flex:none}
.card .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--card-muted);font-weight:600}
.card h2{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;margin:0;text-wrap:balance}
.card .match{font-size:12.5px;color:var(--card-muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card mark{background:var(--hl);color:#1f2421;border-radius:3px;padding:0 2px}
.card.dark{color:#fff}.card.dark .sec,.card.dark .match{color:rgba(255,255,255,.82)}
.card.dark .time svg{color:rgba(255,255,255,.8)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.time{font-size:13px;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.time svg{width:14px;height:14px;opacity:.7}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;line-height:1.1;background:rgba(255,255,255,.65)}
.tag.hp{color:#2d5a8a} .tag.ges{color:#1f7a6a}
.tag.vegan{color:var(--vegan)} .tag.veg{color:var(--veg)} .tag.gf{color:var(--gf)}
.card.dark .tag{background:rgba(255,255,255,.9)}
.empty{padding:48px 0;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,6,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--paper);color:var(--paper-ink);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.4)}
.sheet.on{transform:none}
.sheet .head{padding:calc(22px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 20px 24px;position:relative;color:var(--card-ink)}
.sheet .head.dark{color:#fff}
.sheet .close{z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.2);position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.6);cursor:pointer;font-size:18px;color:#1f2421}
.sheet .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75;display:flex;gap:8px}
.sheet h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;margin:6px 48px 12px 0;text-wrap:balance}
.sheet .body{overflow:auto;padding:22px max(24px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 24px;display:grid;gap:28px}
.sheet h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.sheet h4::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sc)}
.ing{display:grid;grid-template-columns:24px auto minmax(0,1fr);column-gap:12px;row-gap:2px}
.it{display:contents;cursor:pointer}
.it>span{padding:5px 0;cursor:pointer;transition:color .15s,opacity .15s}
.it .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--paper-line);align-self:center;padding:0;display:grid;place-items:center;transition:background .15s,border-color .15s}
.it .ck svg{width:13px;height:13px;opacity:0;color:#fff}
.it[aria-checked="true"] .ck{background:var(--paper-ink);border-color:var(--paper-ink)}
.it[aria-checked="true"] .ck svg{opacity:1}
.it[aria-checked="true"] .a,.it[aria-checked="true"] .n{opacity:.4;text-decoration:line-through}
.it:focus-visible .ck{outline:2px solid var(--paper-ink);outline-offset:2px}
.ing .a{font-variant-numeric:tabular-nums;color:var(--paper-muted);white-space:nowrap;text-align:right;min-width:4.5em}
.ingbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.ingbar h4{margin:0!important}
.ingbar .prog{font-size:12.5px;color:var(--paper-muted);font-variant-numeric:tabular-nums}
.ingbar button{border:0;background:none;color:var(--paper-muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.ing .sub{grid-column:1/-1;font-family:var(--display);font-weight:700;margin-top:10px;font-size:14px;padding:3px 10px;border-radius:7px;background:var(--sl);justify-self:start}
.ing .sub:first-child{margin-top:0}
.ing mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;max-width:62ch}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--sl);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px;font-variant-numeric:tabular-nums}
.steps li.subh{grid-template-columns:1fr;font-family:var(--display);font-weight:700;margin-top:6px}
.steps li.subh::before{content:none;counter-increment:none}
.note{font-size:12.5px;color:var(--paper-muted);margin:0}
.done{display:none;height:44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.yield{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.7);border-radius:999px;padding:3px;color:#1f2421}
.yield button{width:32px;height:32px;border-radius:50%;border:0;background:#fff;cursor:pointer;font-size:18px;line-height:1;color:#1f2421;display:grid;place-items:center}
.yield input{width:54px;height:32px;border:0;background:transparent;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:#1f2421}
.yield .u{padding:0 10px 0 2px;font-size:14px;font-weight:600}
.yreset{border:0;background:none;cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0;color:inherit;opacity:.8}
.seg{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.7);border-radius:999px;padding:3px;color:#1f2421}
.seg .vl{font-size:13px;font-weight:600;padding:0 8px 0 10px}
.seg button{height:32px;border:0;border-radius:999px;background:transparent;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;color:#1f2421}
.seg button[aria-pressed="true"]{background:#1f2421;color:#fff}
.share{position:relative}
.sharebtn{height:38px;border-radius:999px;border:0;background:#1f2421;color:#fff;padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.sharebtn svg{width:16px;height:16px}
.menu{position:absolute;top:44px;left:0;background:#fff;color:#1f2421;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;min-width:230px;z-index:5;display:grid}
.menu button,.menu a{border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:inherit;text-decoration:none;display:block}
.menu button:hover,.menu a:hover{background:#f0f2ee}
.menu small{display:block;color:#6b736d;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1f2421;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.copyfallback{width:100%;min-height:120px;font-size:13px;border:1px solid var(--paper-line);border-radius:10px;padding:10px;background:#fff;color:#1f2421}
@media (max-width:860px){
  .list .wrap{grid-template-columns:minmax(0,1fr)}
  body.inlist .filterbtn{display:inline-flex;align-items:center}
  aside.filters{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;background:var(--bg2);z-index:45;border-radius:18px 18px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
  aside.filters.on{transform:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .chapters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chap{min-height:112px;padding:14px}
  .chap .nm{font-size:17px}
  .chap .cnt{font-size:24px}
  .chap .ex{display:none}
  .sheet h1{font-size:24px}
  .done{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<header class="top"><div class="wrap">
  <button class="brand" id="home" type="button">Kochbuch<small>Micky &amp; Nils · Version 5.1</small></button>
  <label class="search" for="q">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Rezept oder Zutaten, z.B. kichererbsen, kokosmilch" autocomplete="off">
    <button class="clear" id="qclear" type="button" aria-label="Suche leeren" hidden>×</button>
  </label>
  <button class="filterbtn" id="fbtn" type="button">Filter<span class="n" id="fn" hidden>0</span></button>
</div></header>

<section class="home" id="vhome"><div class="wrap">
  <h1>Kapitel</h1>
  <p class="lead">115 Rezepte in 13 Kapiteln. Wähle ein Kapitel oder suche direkt nach einer Zutat.</p>
  <div class="quick">
    <button class="chip" type="button" data-q="veg">Vegetarisch</button>
    <button class="chip" type="button" data-q="vegan">Vegan</button>
    <button class="chip" type="button" data-q="gf">Glutenfrei</button>
    <button class="chip" type="button" data-q="hp">High Protein</button>
    <button class="chip" type="button" data-q="ges">Gesund</button>
    <button class="chip" type="button" data-q="30">Bis 30 Minuten</button>
    <button class="chip" type="button" data-q="nowait">Ohne Wartezeit</button>
  </div>
  <div class="chapters" id="chapters"></div>
</div></section>

<section class="list" id="vlist" hidden><div class="wrap">
  <aside class="filters" id="filters" aria-label="Filter">
    <div class="fgroup"><h3>Ernährung</h3>
      <label class="toggle" for="f-veg">Vegetarisch<input type="checkbox" id="f-veg"></label>
      <label class="toggle" for="f-vegan">Vegan<input type="checkbox" id="f-vegan"></label>
      <label class="toggle" for="f-gf">Glutenfrei<input type="checkbox" id="f-gf"></label>
      <label class="toggle" for="f-hp">High Protein<input type="checkbox" id="f-hp"></label>
      <label class="toggle" for="f-ges">Gesund<input type="checkbox" id="f-ges"></label>
    </div>
    <div class="fgroup"><h3>Dauer</h3><div class="chips" id="times"></div>
      <label class="toggle" for="f-nowait" style="margin-top:8px">Ohne Warte- oder Kühlzeit<input type="checkbox" id="f-nowait"></label>
    </div>
    <div class="fgroup"><h3>Ohne Zutat</h3><input class="textin" id="f-excl" type="text" placeholder="z.B. ei, nüsse" autocomplete="off"></div>
    <div class="fgroup"><h3>Küche</h3><div class="chips" id="cuis"></div></div>
    <button class="reset" id="reset" type="button">Alle Filter zurücksetzen</button>
    <button class="done" id="done" type="button">Ergebnisse anzeigen</button>
  </aside>
  <div aria-live="polite" style="min-width:0">
    <div class="lhead">
      <button class="back" id="back" type="button">← Alle Kapitel</button>
      <div class="ltitle"><span class="sw" id="lsw"></span><h1 id="ltitle"></h1><span class="count" id="count"></span></div>
      <div class="chapnav" id="chapnav"></div>
      <div class="active" id="active"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><b>Kein Rezept passt</b>Lockere einen Filter oder suche nach einer anderen Zutat.</div>
  </div>
</div></section>

<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"></div>
<article class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="st">
  <button class="close" id="sclose" type="button" aria-label="Schliessen">×</button>
  <img class="hero" id="shero" alt="" hidden>
  <div class="head" id="shead">
    <div class="sec" id="ssec"></div><h1 id="st"></h1><div class="meta" id="smeta"></div>
    <div class="tools">

<script>
const DATA = {"secs":[{"n":"Vorspeisen & Apéro","c":"D9D9D9","d":"A9ADA8"},{"n":"Suppen","c":"F1E4D3","d":"C9A27A"},{"n":"Hauptgerichte","c":"E5DFEC","d":"A996C4"},{"n":"Beilagen","c":"DCEEE8","d":"6FB09B"},{"n":"Saucen, Pesto & Pasten","c":"C6D9F1","d":"7FA6D9"},{"n":"Dips & Aufstriche","c":"DAEEF3","d":"7CC3D6"},{"n":"Nachspeisen","c":"EAF1DD","d":"9DBB6E"},{"n":"Kuchen","c":"FBFFC7","d":"D9C64A"},{"n":"Kekse & Süsses","c":"FDE9D9","d":"EDA77C"},{"n":"Gesunde Snacks","c":"F2DBDB","d":"D98E8D"},{"n":"Brot","c":"D99594","d":"943634"},{"n":"Pizza, Focaccia & Flammkuchen","c":"D98A62","d":"C8693F"},{"n":"Vegane Basics & Gewürze","c":"D9D9D9","d":"7E8C7A"}],"recipes":[{"t":"Farce","s":"Vorspeisen & Apéro","c":"Frankreich","time":"3 h + 1 Nacht kühlen","min":180,"wait":true,"vegan":false,"veg":false,"gf":true,"i":[{"a":"100 g","n":"Schweinegulasch"},{"a":"300 g","n":"Kalbsgulasch"},{"a":"100-200 g","n":"Hühnerleber"},{"a":"2","n":"ganze Zwiebeln"},{"a":"100-200 g","n":"cremige Champignons"},{"a":"1","n":"Flasche Rotwein (Bordeaux)"},{"a":"100-200 ml","n":"Cognac"},{"a":"2","n":"Eier"},{"a":"300 g","n":"Schweinehals (zum Auslegen der Terrinenform; immer große Stücke nehmen)"},{"a":"1","n":"Schweinefilet"},{"a":"300 g","n":"Speckschwarte"}],"st":["Gewürze je nach Geschmack, auf jeden Fall: Salz+Pfeffer, Paprikapulver, Petersilie => später noch Lorbeer + Thymian!","Anbraten nach und nach: Portion Fleisch, mit Zwiebeln, Gewürzen, Champions anbraten, dann mit Wein und Cognac ablöschen.","Wenn alles angebraten ist durch den Fleischwolf drehen., halbfein.","Nochmals die Masse abschmecken; die Eier zur Masse geben und unterrühren.","Nun die Terrinenform mit Schweinehals auslegen; mit Teig bis zur Hälfte voll machen und das angebratene Schweinefilet in die Mitte legen. Mit dem Rest der Masse die Terrine abdecken und mit dem restlichen Schweinehals die Terrine ganz bedecken. Darauf Thymian und Lorbeer geben.","80 Minuten im Backofen garen bei 150 Grad im Wasserbad, mit Zeitung unterlegen.","Danach die Terrine mit einem Holzbrett belegen und 1 Nacht in den Kühlschrank, bei 1-2 Kg Gewicht auf der Terrine."],"id":"farce","y":[12,"p"],"hp":true,"ges":false,"img":"farce.jpg"},{"t":"Parmesan Mousse","s":"Vorspeisen & Apéro","c":"Italien & Mittelmeer","time":"20 Min + 5 h kühlen","min":20,"wait":true,"vegan":false,"veg":false,"gf":true,"i":[{"a":"150 gr.","n":"Parmesan gerieben"},{"a":"150 ml","n":"Milch"},{"a":"1 Stk.","n":"Knoblauchzehe"},{"a":"1 Zweig","n":"Thymian"},{"a":"3 Blatt","n":"Gelatine"},{"a":"150 ml","n":"Sahne"}],"st":["Für die Parmesan-Mousse den Parmesan und die Milch zusammen warm werden lassen und den Parmesan so auflösen. Dann die Knoblauchzehe mit dem Thymianzweig hinzugeben. Die Gelatine einweichen. Die Parmesanmasse durch ein Sieb geben und sofort die Gelatine unterrühren. Anschließend die Sahne schlagen und ebenfalls unterheben. Das Ganze in Förmchen geben und 4 bis 5 Stunden - am besten über Nacht - kühlen.","Tip.","Zusammen der Parmesan-Milch Masse, noch getrocknete Steinpilze geben."],"id":"parmesan-mousse","y":[6,"p"],"hp":false,"ges":false,"img":"parmesan-mousse.jpg"},{"t":"Crostini Verde","s":"Vorspeisen & Apéro","c":"Italien & Mittelmeer","time":"30 Min","min":30,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"1 EL","n":"Olivenöl"},{"a":"2","n":"Knoblauchzehen, gepresst"},{"a":"375 g","n":"Zucchini"},{"a":"1 Bund","n":"Basilikum"},{"a":"80 g","n":"Parmesan oder Grana Padano"},{"a":"","n":"Salz & Pfeffer"}],"st":["Öl warm werden lassen und Knoblauch andämpfen. Zuchini beigeben und ca. 15 Min. weichdämpfen bis die Flüssigkeite eingekocht ist. Etwas abkühlen lassen","Basilikum und Käse beigeben und pürieren und nach Belieben Salzen.","Ein Baguette in Scheiben schneiden und mit Olivenöl beträufeln und ca. 5 Min. bei 240°C rösten.","Die Crostini mit der Masse bestreichen."],"id":"crostini-verde","y":[6,"p"],"img":"crostini-verde.jpg","hp":false,"ges":false},{"t":"Weisse Tomatensuppe","s":"Suppen","c":"Schweiz & Deutschland","time":"50 Min","min":50,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"2 Stk.","n":"Zwiebeln"},{"a":"2 Stk.","n":"Knoblauchzehen"},{"a":"1 EL","n":"Öl"},{"a":"1 kg","n":"Tomaten"},{"a":"600 ml","n":"Gemüsefond"},{"a":"1 Prise","n":"Zucker"},{"a":"200 g","n":"Sahne"},{"a":"1 Prise","n":"Salz"},{"a":"1 Prise","n":"Pfeffer weiß"},{"a":"2 EL","n":"Butter"},{"a":"1 Schuss","n":"Gin"}],"st":["Die Zwiebeln und den Knoblauch abziehen, grob zerkleinern und in der Pfanne in etwas Öl dünsten. Tomaten in Würfel schneiden und dazugeben, den Gemüsefond angießen und Zucker zugeben und alles aufkochen lassen. Anschließend 15 bis 30 Minuten ziehen lassen.","Dann das Ganze durch ein Küchentuch abseihen und gut ausdrücken. Die klare Suppe noch mehrmals durchseihen, anschließend mit Sahne aufkochen lassen. Salz, Pfeffer, und Butter dazugeben und die Suppe sahnig schlagen, zum Schluss etwas Gin dazugeben.","Die Suppe auf Tellern anrichten, jeweils mit 2 bis 3 Tropfen Basilikumöl und einem Basilikumblatt servieren."],"id":"weisse-tomatensuppe","y":[4,"p"],"img":"weisse-tomatensuppe.jpg","hp":false,"ges":false},{"t":"Fischsuppe","s":"Suppen","c":"Frankreich","time":"1 h","min":60,"wait":false,"vegan":false,"veg":false,"gf":true,"i":[{"a":"2 Stk.","n":"Zwiebeln"},{"a":"2 Stk.","n":"Knoblauchzehen"},{"a":"150 g","n":"Tomatenmark"},{"a":"200 ml","n":"Weißwein"},{"a":"4-6 l","n":"Wasser (je nach Bedarf, Mengenwunsch insgesamt)"},{"a":"3-5","n":"Lorbeerblätter"},{"a":"2-4 EL","n":"Salz (in Abhängigkeit von Wassermenge)"},{"a":"1","n":"Lauchstange"},{"a":"1","n":"Karotte"},{"a":"1","n":"Fenchelknolle"},{"a":"1","n":"Sellerieknolle"},{"a":"1","n":"rote Beete"},{"a":"1","n":"Topinambur"},{"a":"1","n":"Paprika rot"},{"a":"1","n":"Paprika gelb"},{"a":"150 ml","n":"Sahne"},{"a":"400 g","n":"Lachs"},{"a":"300 g","n":"Fisch mit hellem Fleisch; der nicht schnell verfällt (z.B. Wolfsbarsch)"}],"st":["Gemüse in kleine Stücke schneiden, Zwiebeln & Knoblauch rösch anbraten, mit Tomatenmark kurz anbraten und mit Weißwein ablöschen. Wasser, Gewürze und das restliche Gemüse dazugeben. Je nach Grösse des Gemüses 30-50min köcheln lassen. Zum Schluss die Sahne dazu, abschmecken, nochmals kurz aufkochen lassen und den Fisch in Würfelgroßen Stücken dazugeben.","VARIATION: Die Suppe nicht mediterran, sondern asiatisch abschmecken ähnlich wie Tom Ka Gai; Kokosmilch, Galgant, Ingwer, Kurkuma, Zitronengrass und Kokosmilch anstelle der Sahne."],"id":"fischsuppe","y":[8,"p"],"img":"fischsuppe.jpg","hp":true,"ges":true},{"t":"Tom Kha Gai","s":"Suppen","c":"Asien","time":"35 Min","min":35,"wait":false,"vegan":false,"veg":false,"gf":true,"i":[{"a":"5 Stängel","n":"Zitronengras"},{"a":"250 ml","n":"Hühnerbrühe"},{"a":"2 Dosen","n":"Kokosmilch (a 400 ml)"},{"a":"7 cm","n":"Galgant oder Ingwer, geschält und in Scheiben"},{"a":"8","n":"Kaffirlimettenblätter"},{"a":"3","n":"Chilischoten ganz, rot"},{"a":"3 EL","n":"Fischsauce oder etwas Kelp Pulver"},{"a":"150 g","n":"Champignons (geviertelt)"},{"a":"400 g","n":"Hühnerbrüste, in kleine Würfel oder Streifen geschnitten"},{"a":"1-2","n":"Limtten (Saft)"},{"a":"1 TL","n":"Zucker oder Agavensirup (allenfalls mehr)"},{"a":"","n":"Frischer Koriander"}],"st":["Das Zitronengras in 4 cm lange Stücke schneiden und mit dem Messerrücken leicht klopfen. Die Brühe und die Hälfte der Kokosmilch zum Kochen bringen und das Zitronengras, Galagant, Kaffirlimettenblätter und die Chilis hineingeben. Mit der Fischsauce würzen und 10 Minuten köcheln.","Die Pilze hinzufügen und weitere 5 Minuten kochen, dann das Hühnerfleisch unterrühren und wenige Minuten auf kleiner Flamme garen. Es muss Zart bleiben. Die restliche Kokosmilch zufügen und mit Limettensaft, Zucker und Fischsauce abschmecken. Am Schluss mit frischem Koriander garnieren.","Varianten:","Hühnerfleisch durch 500g Fischfilet, Pilze oder Tofu ersetzen."],"id":"tom-kha-gai","y":[4,"p"],"img":"tom-kha-gai.jpg","hp":true,"ges":false},{"t":"Frikadellen","s":"Hauptgerichte","c":"Schweiz & Deutschland","time":"40 Min","min":40,"wait":false,"vegan":false,"veg":false,"gf":false,"i":[{"a":"250 g","n":"Kartoffeln"},{"a":"1x","n":"kleine Zwiebel"},{"a":"2x","n":"Knoblauchzehen"},{"a":"300g","n":"gemischtes Hackfleisch"},{"a":"2x","n":"Eier"},{"a":"1TL","n":"Salz"},{"a":"½TL","n":"Pfeffer"},{"a":"1EL","n":"Senf"},{"a":"1TL","n":"Paniermehl"},{"a":"1TL","n":"Paprikapulver Edelsüss"},{"a":"1Prise","n":"Muskatnuss"},{"a":"1TL","n":"Liebstöckel getrocknet"},{"a":"3-4TL","n":"frische, kleingehackte Petersilie"}],"st":["Kartoffeln auspressen (lauwarm), alles vermischen & Probe braten."],"id":"frikadellen","y":[4,"p"],"img":"frikadellen.jpg","hp":true,"ges":false},{"t":"Meatballs mit Tomatensauce","s":"Hauptgerichte","c":"Italien & Mittelmeer","time":"1 h 15 Min","min":75,"wait":false,"vegan":false,"veg":false,"gf":false,"i":[{"a":"500 g","n":"Hackfleisch (Rind oder Halb & Halb)"},{"a":"100 g","n":"Parmaschinken"},{"a":"50 g","n":"Parmesan gerieben"},{"a":"1","n":"kleines Brötchen in Würfeln (oder 1 Scheibe Brot)"},{"a":"0.5 Bund","n":"Petersilie"},{"a":"1 EL","n":"Sour Cream"},{"a":"","n":"Salz & Pfeffer"},{"a":"","n":"Muskat"},{"a":"1","n":"grosse Zwiebel"},{"a":"4 Zehen","n":"Knoblauch"},{"a":"1 Stange","n":"Staudensellerie"},{"a":"1","n":"Karotte"},{"a":"100 ml","n":"Rotwein"},{"a":"1 Dose","n":"Tomaten (grosse Dose)"},{"a":"1 TL","n":"Zucker"},{"a":"0.5 Bund","n":"Petersilie"}],"st":["Aus den Zutaten für die Bällchen Kugeln in der Größe eines Tischtennisballes formen.","Für die Sauce das Gemüse fein hacken und in etwas Fett anschwitzen. Mit Rotwein ablöschen und verdampfen lassen. Tomaten dazugeben und alles circa 40 - 50 Minuten leise köcheln lassen. Nun die Soße nach Wunsch abschmecken und evtl. nachwürzen, darauf die Fleischbällchen verteilen."],"id":"meatballs-mit-tomatensauce","y":[4,"p"],"img":"meatballs-mit-tomatensauce.jpg","hp":true,"ges":false},{"t":"Linsen Bolognese","s":"Hauptgerichte","c":"Italien & Mittelmeer","time":"1 h","min":60,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"3-5","n":"Knoblauchzehen"},{"a":"3-4","n":"getrocknete Tomaten (klein geschnitten)"},{"a":"1-2","n":"Stängel Staudensellerie"},{"a":"1-2","n":"Karotten (mittelgross)"},{"a":"2-3 EL","n":"Tomatenmark"},{"a":"100 ml","n":"Rotwein (oder Weisswein) zum Ablöschen"},{"a":"Handvoll","n":"Baumnüsse geröstet (eher stark geröstet)"},{"a":"Handvoll","n":"Linsen (grün oder braun)"},{"a":"1-2 Dosen","n":"Sugo"},{"a":"1-2","n":"Parmesanrinden"},{"a":"2-3","n":"Lorbeerblätter"},{"a":"1 TL","n":"geräucherte Paprika"},{"a":"","n":"Salz"},{"a":"50-100 ml","n":"Milch"}],"st":["Gemüse sehr klein schneiden und in Olivenöl andünsten; Tomatenmark mit anbraten, anschließend mit Wein ablöschen. Walnüsse & Linsen klein schreddern und zugeben. Sugo, Parmesan, Gewürze dazu geben.","Milch nach und nach hinzugeben."],"id":"linsen-bolognese","y":[4,"p"],"img":"linsen-bolognese.jpg","hp":true,"ges":true},{"t":"Vegane Carbonara","s":"Hauptgerichte","c":"Italien & Mittelmeer","time":"30 Min + Einweichen","min":30,"wait":true,"vegan":true,"veg":true,"gf":true,"i":[{"a":"150 g","n":"Cashews"},{"a":"1","n":"grosse Zwiebel gewürfelt"},{"a":"2","n":"Knochblauchzehen, gewürfelt"},{"a":"1-2 EL","n":"Olivenöl"},{"a":"200 g","n":"Butternuss Kürbis"},{"a":"200 ml","n":"Wasser"},{"a":"2 TL","n":"Nährhefe"}],"st":["Cashews über Nacht einweichen oder ca. 10 Minuten kochen (mit einem Hochleistungsmixer, kann dieser Schritt auch weggelassen werden).","Zwiebeln und Knoblauch in Olivenöl anbraten, bis diese Röstaromen enthalten.","Cashews, Kürbis, Wasser und Nährhefe in einen Mixer geben und auf höchster Stufe mixen, bis alles ganz fein ist.","Zu den angebratenen Zwiebeln geben, kurz aufkochen und abschmecken."],"id":"vegane-carbonara","y":[4,"p"],"img":"vegane-carbonara.jpg","hp":false,"ges":true},{"t":"Grüne Healthy-Pesto Sosse","s":"Hauptgerichte","c":"Italien & Mittelmeer","time":"25 Min","min":25,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"30 g","n":"Cashews"},{"a":"500 ml","n":"Wasser"},{"a":"1","n":"Zwiebel, fein geschnitten"},{"a":"Etwas","n":"Lauch, fein geschnitten"},{"a":"2","n":"Knoblauchzehen, fein geschnitten"},{"a":"150 g","n":"Spinat, gehackt"},{"a":"","n":"Weitere Kräuter Optional (Petersilie, Schnittlauch, Bärlauch...)"},{"a":"1 Bund","n":"Basilikum"},{"a":"2 EL","n":"Pinienkerne, geröstet"},{"a":"2 EL","n":"Parmesan, fein gerieben"}],"st":["Cashews ca 10 Minuten in 250 ml heissem Wasser einweichen.","Zwiebeln, Lauch und Knoblauch in Olivenöl anbraten, bis diese leichte Röstaromen enthalten.","Cashews und Wasser in einen Mixer geben und auf höchster Stufe mixen, bis alles ganz fein ist. In die Pfanne geben und aufkochen.","Tiefkühl-Blattspinat und Kräuter mit dem Rest des Wassers mixen und zerkleinern (Kräuter allenfalls etwas vorschneiden). Hackspinat kann auch mal direkt in die Sosse gegeben werden.","Kurz aufkochen und mit Salz abschmecken. Kann auch noch mit Sahne verfeinert werden.","Am Schluss fein gehackten Basilikum, Pinienkerne und Parmesan unterheben."],"id":"gruene-healthy-pesto-sosse","y":[4,"p"],"img":"gruene-healthy-pesto-sosse.jpg","hp":false,"ges":true},{"t":"Adana Kebap","s":"Hauptgerichte","c":"Orient","time":"30 Min","min":30,"wait":false,"vegan":false,"veg":false,"gf":true,"i":[{"a":"1","n":"Zwiebel"},{"a":"2","n":"Zehen Knoblauch"},{"a":"0.5 Bund","n":"Petersilie glatt frisch"},{"a":"1","n":"Chilischote (oder etwas Cayenpfeffer)"},{"a":"500 g","n":"Lammhackfleisch"},{"a":"1 TL","n":"Salz"},{"a":"1 TL","n":"Kreuzkümmelpulver"},{"a":"0.5 TL","n":"Paprikapulver (oder 0.5 EL Paprikamark)"},{"a":"1 EL","n":"Zitronensaft"},{"a":"etwas","n":"fein geriebene Zitronenschale"}],"st":["Zwiebeln, Knoblauch und Petersilie (und Chillischote) in einer Küchenmaschine kleinhacken oder fein reiben (wenn keine Küchenmaschine vorhanden)","Alle Zutaten ordentlich miteinander verkneten (mind. 5 Minuten, damit das Fleischfett sich gut mit den restlichen Zutaten vermischt und Bindung abgibt).","Jeweils rund 150 – 200 g Fleischteig auf Metallspieße streichen und gut andrücken. Die Spieße bei hoher Hitze grillen, je Seite etwa 2-3 Minuten, dabei sehr früh einmal wenden damit die Masse nicht abfällt.","Oder einfach mit etwas Öl in der Pfanne anbraten."],"id":"adana-kebap","y":[4,"p"],"img":"adana-kebap.jpg","hp":true,"ges":false},{"t":"Falafel","s":"Hauptgerichte","c":"Orient","time":"40 Min + 12 h Einweichen","min":40,"wait":true,"vegan":true,"veg":true,"gf":true,"i":[{"a":"200 g","n":"Kichererbsen getrocknet"},{"a":"1","n":"Zwiebel"},{"a":"4 Zehen","n":"Knoblauch"},{"a":"0.5 Bund","n":"Petersilie"},{"a":"0.5 Bund","n":"Korianderblätter"},{"a":"2-3 Zweige","n":"Dill"},{"a":"2 TL","n":"Korianderpulver"},{"a":"2 TL","n":"Kreuzkümmelpulver"},{"a":"1 TL","n":"Backpulver"},{"a":"","n":"Salz und Pfeffer"}],"st":["Kichererbsen mindestens 12 Stunden einweichen.","Zwiebeln und Knoblauch grob schneiden, sowie die Stängel der Petersilie & Koriander.","Abgetropfte Kichererbsen zusammen mit allen Zutaten in eine Küchenmaschine geben und gut verhäkseln bis eine relativ feine Masse entsteht.","Falafel formen und in einer Pfanne anbraten oder frittieren."],"id":"falafel","y":[4,"p"],"img":"falafel.jpg","hp":true,"ges":true},{"t":"Indisches Kartoffelcurry","s":"Hauptgerichte","c":"Indien","time":"40 Min","min":40,"wait":false,"vegan":true,"veg":true,"gf":true,"i":[{"a":"2","n":"kleine Zwiebeln, fein gehackt"},{"a":"3","n":"Knoblauchzehen, fein gehackt"},{"a":"3 EL","n":"geklärte Butter oder Kokosfett"},{"a":"1 TL","n":"Kreuzkümmelpulver"},{"a":"1 TL","n":"Currypulver"},{"a":"1 TL","n":"Paprikapulver"},{"a":"1 TL","n":"Piment, gemahlen"},{"a":"1 TL","n":"schwarzer Pfeffer"},{"a":"2 TL","n":"Senfkörner, ganz"},{"a":"1 Msp.","n":"Muskatnuss"},{"a":"500 g","n":"Kartoffel, gewürfelt"},{"a":"200 g","n":"rote Linsen"},{"a":"600 ml","n":"Gemüsefonds"},{"a":"400 ml","n":"Kokosmilch"},{"a":"400 g","n":"Cherrytomaten, halbiert"},{"a":"3 EL","n":"frischer Thymian fein geschnitten"}],"st":["Zwiebeln und Knoblauch in Butterschmalz oder Kokosfett anschwitzen. Die Gewürze dazu geben und weitere 5 Minuten braten","Die Kartoffeln und Linsen dazugeben und mit Gemüsefond und Kokosmilch ablöschen. 10-15 Minuten köcheln lassen.","Cherrytomaten und Thymian dazugeben und weitere 10 Minuten kochen, bis alles gar ist."],"id":"indisches-kartoffelcurry","y":[4,"p"],"img":"indisches-kartoffelcurry.jpg","hp":true,"ges":true},{"t":"Schnelles Kichererbsencurry","s":"Hauptgerichte","c":"Indien","time":"25 Min","min":25,"wait":false,"vegan":true,"veg":true,"gf":true,"i":[{"a":"2","n":"Zwiebeln, grob geschnitten"},{"a":"2","n":"Knoblauchzehen, fein gehackt"},{"a":"2","n":"Karotten, fein geschnitten"},{"a":"3 EL","n":"Öl"},{"a":"1 TL","n":"Kreuzkümmelpulver"},{"a":"1 TL","n":"Currypulver"},{"a":"1 TL","n":"Paprikapulver"},{"a":"1 TL","n":"Garam Masala"},{"a":"3-4 EL","n":"Tomatenmark"},{"a":"400 ml","n":"Kokosmilch"},{"a":"1 Dose","n":"Kichererbsen, abgetropft"},{"a":"","n":"Salz"},{"a":"","n":"Wasser"}],"st":["Zwiebeln, Knoblauch und Karotten in Öl anschwitzen. Die Gewürze dazu geben und weitere 5 Minuten braten","Tomatenmark kurz mit anbraten, dann restliche Zutaten dazu geben und mit Wasser aufgiessen, bis gewünschte Konsistenz erreicht ist.","Kann auch mit anderem Gemüse (Lauch, Pilze, Erbsen, etc.) ergänzt werden."],"id":"schnelles-kichererbsencurry","y":[3,"p"],"img":"schnelles-kichererbsencurry.jpg","hp":true,"ges":true},{"t":"Indisches Korma","s":"Hauptgerichte","c":"Indien","time":"1 h + Marinieren","min":60,"wait":true,"vegan":false,"veg":true,"gf":true,"i":[{"h":"Marinade"},{"a":"2 Dosen","n":"Kichererbsen oder 500 g Fleisch"},{"a":"3 EL","n":"Joghurt"},{"a":"¼ TL","n":"Kurkuma"},{"a":"1 TL","n":"Garam Masala"},{"a":"1 EL","n":"geriebener Ingwer und Knoblauch"},{"a":"½ TL","n":"Salz"},{"a":"","n":"Chili nach belieben"},{"h":"Sossenbasis"},{"a":"4","n":"ganze Kardomonkapseln"},{"a":"2","n":"grosse Zwiebeln grob gewürfelt"},{"a":"handvoll","n":"Cashewkerne"},{"a":"10","n":"Mandeln"},{"a":"1 Dose","n":"Kokosmilch"},{"h":"Sosse"},{"a":"1","n":"Lorbeerblätter"},{"a":"¼ TL","n":"Nelkenpulver"},{"a":"½ TL","n":"Kardomonpulver"},{"a":"½ TL","n":"Garam Masala"},{"a":"½ TL","n":"Zimt"},{"a":"¼ TL","n":"Chilipulver"},{"a":"1.5 TL","n":"Korianderpulver"},{"a":"3 EL","n":"frischer Koriander geschnitten"},{"a":"200 ml","n":"Wasser"},{"a":"","n":"Salz"}],"st":["Kichererbsen oder Fleisch marinieren. Idealerweise über Nacht durchziehen lassen (min. 1-2 Stunden).","Sossenbasis:","Kardomonkapseln und Zwiebeln in Öl anbraten bis die Zwiebeln goldbraun sind (mit vielen Röstaromen). Zusammen mit den restlichen Zutaten in einen Mixer geben und fein pürieren.","Sosse:","Gewürze in Öl anbraten. Fleisch oder Kichererbsen mit anbraten. Sossenbasis und Wasser beigeben. Solange kochen bis das Fleisch die gewünschte Konsistenz hat."],"id":"indisches-korma","y":[4,"p"],"img":"indisches-korma.jpg","hp":true,"ges":false},{"t":"Thailändische Rindstreifen","s":"Hauptgerichte","c":"Asien","time":"40 Min","min":40,"wait":false,"vegan":false,"veg":false,"gf":false,"i":[{"a":"300 g","n":"Rinderfiletspitzen"},{"a":"1","n":"Ei (verquirlt)"},{"a":"1 TL","n":"Ingwer (fein gerieben)"},{"a":"1 TL","n":"Sojasauce"},{"a":"1 Stange","n":"Zitronengras"},{"a":"½","n":"Chilischote (klein gehackt)"},{"a":"3 EL","n":"Kartoffelstärke"},{"a":"Öl","n":"zum Frittieren"},{"a":"1","n":"gehackte Knoblauchzehe"},{"a":"2 EL","n":"Zucker"},{"a":"2 EL","n":"Sojasauce"},{"a":"1 TL","n":"Sambal Oelek"},{"a":"2 EL","n":"Tafelessig (5 %)"},{"a":"20 g","n":"rote Paprikawürfel"},{"a":"100 g","n":"Sojasprossen"},{"a":"0.5 Bund","n":"Frische Korianderblätter"}],"st":["Rindslungenbraten in feine Streifen schneiden, in einer Schüssel mit Ei, Ingwer, Sojasauce, Zitronengrass und Chili vermengen, mit Klarsichtfolie bedecken und kurz durchziehen lassen.","Klarsichtfolie abnehmen, die Erdäpfelstärke zügig unter das Fleisch mengen. Wichtig dabei: die Stücke sollten nicht zusammenkleben. Fleisch sofort im heißen Fett rasch knusprig backen, danach auf einem Küchenpapier abtropfen lassen.","Öl in einer Pfanne erhitzen, Knoblauch darin, ohne Farbe nehmen zu lassen, kurz anrösten. Zucker, Sojasauce, Sambal Oelek und Essig zufügen, aufkochen lassen, kurz einreduzieren. Die frittierten Rindfleischstücke sowie Paprikawürfel, Lauch und Sojasprossen zufügen, kurz durchschwenken und sofort servieren. (Die Rindfleischstücke müssen knusprig sein).","Zum Schluss den Koriander dazu."],"id":"thailaendische-rindstreifen","y":[2,"p"],"img":"thailaendische-rindstreifen.jpg","hp":true,"ges":false},{"t":"Gebratene Nudeln","s":"Hauptgerichte","c":"Asien","time":"15 Min + Nudeln vorkochen","min":15,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"3 EL","n":"neutrales Öl"},{"a":"3","n":"Eier"},{"a":"500 g","n":"gekochte, gut abgetrocknete asiatische Nudeln"},{"a":"2 kleine","n":"Knoblauchzehen, fein gehackt"},{"a":"2","n":"Frühlingszwiebeln in Ringen (optional)"},{"h":"Sauce"},{"a":"3 EL","n":"Sojasauce"},{"a":"1½ EL","n":"Wasser"},{"a":"1½ TL","n":"Zucker"},{"a":"¾ TL","n":"Sesamöl"}],"st":["Nudeln vorher kochen, idealerweise am Vortag, sonst zumindest gut abkühlen lassen. Mindestens 1 Minute kürzer kochen als auf der Packung angegeben, damit sie nicht matschig werden.","Pfanne auf den Herd stellen, 3 EL Öl hineingeben und auf mittlere bis mittelhohe Hitze bringen. Öl soll heiß sein, aber nicht rauchen.","Eier in die Pfanne geben, kurz verrühren und 10–15 Sekunden stocken lassen.","Nudeln dazugeben, verteilen und 30 Sekunden nicht rühren, damit sie anbraten.","Dann alles wenden und lockern. Knoblauch und Frühlingszwiebeln kurz unterrühren.","Sauce am Pfannenrand eingießen, kurz aufkochen lassen, dann alles gut durchschwenken, bis die Nudeln gleichmäßig gefärbt sind.","Nicht zu lange braten, sonst werden sie trocken. Sofort servieren"],"id":"gebratene-nudeln","y":[4,"p"],"img":"gebratene-nudeln.jpg","hp":false,"ges":false},{"t":"Miso Ramen mit Chicken Katsu","s":"Hauptgerichte","c":"Asien","time":"50 Min","min":50,"wait":false,"vegan":false,"veg":false,"gf":false,"i":[{"a":"1","n":"Schalotte, fein gehackt"},{"a":"2","n":"Knoblauchzehen, fein gehackt"},{"a":"1 EL","n":"Ingwer, gerieben"},{"a":"2 EL","n":"geröstete Sesamsamen"},{"a":"2 EL","n":"weiße Miso Paste"},{"a":"1 EL","n":"scharfe Chilipaste (Gochujang)"},{"a":"900ml","n":"Hühnerbrühe"},{"a":"160ml","n":"Kokosnussmilch"},{"a":"90g","n":"Ramen Nudeln (2 Portionen)"},{"a":"300 g","n":"Putensteak"},{"a":"1 Ei","n":"leicht verquirlt"},{"a":"50g","n":"Panko"},{"a":"1 EL","n":"geröstete Sesamsamen"},{"a":"Etwas","n":"Salz, Pfeffer, Paprika-, Zwiebel- & Knoblauchpulver"},{"h":"Toppings"},{"a":"2-3","n":"braune Champignons, gebraten"},{"a":"2","n":"Eier weichgekocht"},{"a":"1","n":"Pak Choi (blanchiert)"},{"a":"1","n":"Frühlingszwiebel, in Ringen"},{"a":"etwas","n":"geröstetes Sesamöl (optional)"},{"a":"einige","n":"geröstete Sesamsamen (optional)"},{"a":"etwas","n":"Crispy Chili Oil o.ä. (optional)"}],"st":["Schalotte, Knoblauch und Ingwer in Öl andünsten, Miso, Chili und Sesam zugeben, kurz rösten. Mit Brühe und Kokosmilch aufgiessen, 10–15 Min. köcheln.","Hähnchen halbieren, in Ei und dann Panko-Sesam-Gewürz-Mischung panieren, goldbraun braten.","Pilze in derselben Pfanne braun anbraten.","Eier 6 Min. weich kochen, abschrecken, halbieren.","Ramen garen, Pak Choi kurz mitkochen.","Nudeln und Suppe in Schalen geben, Hähnchen in Streifen darauflegen. Mit Pilzen, Pak Choi, Ei und Frühlingszwiebeln toppen. Optional Sesamöl und/oder Chiliöl."],"id":"miso-ramen-mit-chicken-katsu","y":[2,"p"],"img":"miso-ramen-mit-chicken-katsu.jpg","hp":true,"ges":false},{"t":"Hawaiianischer Fisch","s":"Hauptgerichte","c":"Asien","time":"40 Min","min":40,"wait":false,"vegan":false,"veg":false,"gf":false,"i":[{"a":"200 g","n":"Sushi Reis (nach Anleitung)"},{"a":"500 g","n":"Lachs oder Thunfisch"},{"a":"","n":"Salz"},{"a":"","n":"Pfeffer"},{"a":"3-4 EL","n":"Chilimayo"},{"a":"1-2","n":"Knoblauchzehen"},{"a":"3-4 EL","n":"Sojasauce"},{"a":"1","n":"Zitronengrass"},{"a":"1 TL","n":"Ingwer"},{"a":"½","n":"Saft einer halben Limette"},{"a":"1","n":"Kafirlimettenblatt"},{"a":"200 g","n":"Shiitake"},{"a":"4 EL","n":"Algensesam-mix (schwarz, weisser Sesam)"}],"st":["Sushi Reis nach Anleitung machen. Fisch auf einer Seite langsam anbraten, niedergarend zu Ende braten und mit Salz und Pfeffer abschmecken. Mayo mit scharfer roter Chilipaste mischen. Knoblauch kurz anbraten, Sojasauce mit Zitronengras, Ingwer (fein geraspelt), Saft von halber Limette und Kafirlimettenblatt einkochen und zum Schluss die Shiitake dazugeben für etwa 3-5min."],"id":"hawaiianischer-fisch","y":[3,"p"],"img":"hawaiianischer-fisch.jpg","hp":true,"ges":true},{"t":"Chilli con Carne","s":"Hauptgerichte","c":"Amerika","time":"1 h","min":60,"wait":false,"vegan":false,"veg":false,"gf":true,"i":[{"a":"500 g","n":"Rindshack"},{"a":"50 g","n":"Speck"},{"a":"1","n":"Zwiebel (rot)"},{"a":"1","n":"Zwiebel (weiss)"},{"a":"3","n":"Knoblauchzehen"},{"a":"2-3TL","n":"Tomatenmark"},{"a":"1 TL","n":"Salz"},{"a":"1 TL","n":"Gemüsebrühe"},{"a":"1 Prise","n":"Pfeffer"},{"a":"0.5 TL","n":"Kreuzkümmel"},{"a":"1 Prise","n":"Zimt"},{"a":"0.5TL","n":"geräucherte Paprika"},{"a":"1TL","n":"Paprika Edelsüss"},{"a":"0.5TL","n":"getrockneter Majoran"},{"a":"1TL","n":"Agavensirup oder Zucker"},{"a":"300 ml","n":"Rindsboullion"},{"a":"1 Dose","n":"Tomatensugo"},{"a":"1-2 Stück","n":"rote Paprika"},{"a":"2 Dosen","n":"rote Kidneybohnen"},{"a":"10 g","n":"Dunkle Schokolade (min. 80%)"},{"h":"Optional zum Anrichten"},{"a":"","n":"Creme Fraiche"},{"a":"","n":"Mais"},{"a":"","n":"Geraspelten mexikanischen Käse"}],"st":["Rindshack zusammen mit dem Speck rösch anbraten.","Zwiebeln, Knoblauch, Tomatenmark Gewürze und Zucker dazugeben und gut mit anbraten","Mit Flüssigkeit (Wasser oder direkt die Boullion) & Tomatensugo ablöschen und Gewürze dazu geben.","2/3 der Paprika dazugeben in kleinen Stücken. 30min Köcheln lassen.","Die Bohnen dazu geben und weitere 10min ziehen lassen.","Abschmecken und mit Schokolade finishen sowie den Rest der Paprika in kleinen Stücken frisch dazu."],"id":"chilli-con-carne","y":[4,"p"],"img":"chilli-con-carne.jpg","hp":true,"ges":false},{"t":"Pilz-Burger","s":"Hauptgerichte","c":"Amerika","time":"30 Min","min":30,"wait":false,"vegan":false,"veg":false,"gf":true,"i":[{"a":"5 Stk","n":"braune, cremige Champignon"},{"a":"500 g","n":"Rindshackfleisch (hoher Fettanteil, oder Speck zusetzen)"},{"a":"1 EL","n":"Salz"},{"a":"1 TL","n":"Pfeffer"},{"a":"1 TL","n":"Knoblauchpulver"},{"a":"1 TL","n":"Zwiebelpulver"},{"a":"1 TL","n":"Paprikapulver"}],"st":["Champignons in ganz feine Stückchen schneiden. Alle Zutaten zu einem Teig vermengen. Probebratling anbraten und nach Belieben abschmecken."],"id":"pilz-burger","y":[4,"p"],"img":"pilz-burger.jpg","hp":true,"ges":false},{"t":"Chicken Wings","s":"Hauptgerichte","c":"Amerika","time":"40 Min + 1 Tag marinieren","min":40,"wait":true,"vegan":false,"veg":false,"gf":false,"i":[{"a":"2 EL","n":"Salz"},{"a":"1 EL","n":"Paprikapulver (süss)"},{"a":"1 Prise","n":"geräucherte Paprika"},{"a":"3-5 Tropfen","n":"Räucherextrakt"},{"a":"1 TL","n":"Pfeffer"},{"a":"1 Prise","n":"Cayennepfeffer"},{"a":"1 TL","n":"Worcestersauße"},{"a":"1 TL","n":"Senf"},{"a":"1 TL","n":"Tomatenmark"},{"a":"1 TL","n":"Knoblauchpulver (oder 2 frische Knoblauchzehen)"},{"a":"1 TL","n":"Zwiebelpulver (oder eine halbe Zwiebel)"},{"a":"1 TL","n":"Kreuzkümmel"},{"a":"2-3 EL","n":"Zucker"},{"a":"3-4 EL","n":"Öl"},{"a":"500-600 g","n":"Chicken Wings"}],"st":["Zutaten alle vermengen (gegebenenfalls im Mixer) und die Chicken Wings mit der Masse/Sauce einreiben und in eine Tüte geben und einen Tag im Kühlschrank ziehen lassen."],"id":"chicken-wings","y":[2,"p"],"img":"chicken-wings.jpg","hp":true,"ges":false},{"t":"Backofen Rösti","s":"Beilagen","c":"Schweiz & Deutschland","time":"50 Min","min":50,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"500-600 g","n":"Kartoffeln"},{"a":"1","n":"Karotte"},{"a":"1","n":"Zwiebel (klein)"},{"a":"2","n":"Knoblauchzehen"},{"a":"1","n":"Staudensellerie (Stange)"},{"a":"1","n":"Ei"},{"a":"1","n":"Käse (handvoll)"},{"a":"1","n":"Prise Muskatnuss"},{"a":"1-2 EL","n":"Salz"},{"a":"1 TL","n":"Pfeffer"},{"a":"2 EL","n":"Vegi Bacon – wenn vorhanden"},{"a":"2 EL","n":"Frischkäse (Philadelphia)"},{"a":"¼ Bund","n":"Petersilie (klein gehackt)"}],"st":["Gemüse mit der Küchenmaschine kleinraspeln, mit Ei, Käse und Gewürze und allen anderen Zutaten vermischen. In eine Form geben und im heissen Backofen 35min bei 220 Grad Celsius goldbraun erhitzen. Am Ende des Backvorgangs Käse nach Belieben auf den Rösti verteilen und überbacken."],"id":"backofen-roesti","y":[4,"p"],"img":"backofen-roesti.jpg","hp":false,"ges":true},{"t":"Kartoffelpüree","s":"Beilagen","c":"Schweiz & Deutschland","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"1 kg","n":"Kartoffeln"},{"a":"80-100 g","n":"Butter"},{"a":"120 ml","n":"Milch (warm)"},{"a":"","n":"Salz"},{"a":"Optional:","n":"Muskatnuss, weißer Pfeffer"}],"st":["Kartoffeln schälen, in gleich große Stücke schneiden.","30-40 Minuten dämpfen bis sie richtig weich sind (lieber zu lange, als zu kurz)","Ausdampfen lassen (wichtig!): 1–2 Minuten im heissen Topf ausdampfen lassen (ohne Wasser vom Dämpfen). Das entfernt überschüssige Feuchtigkeit – so wird das Püree fluffig statt klebrig.","Kartoffeln durch eine Kartoffelpresse drücken (ideal) oder mit einem Stampfer zerdrücken.","Butter in die heißen Kartoffeln einarbeiten, bis sie geschmolzen ist. Das gibt Geschmack und Bindung.","Warme (nicht kalte!) Milch nach und nach unterrühren, bis die gewünschte Cremigkeit erreicht ist, es können auch noch 1-2 EL vom Kartoffelkochwasser dazu gegeben werden.","Kräftig salzen und optional mit frisch geriebener Muskatnuss und etwas weißem Pfeffer abrunden.","Optional noch 20-30 Sekunden mit dem Schneebesen auflockern."],"id":"kartoffelpueree","y":[4,"p"],"img":"kartoffelpueree.jpg","hp":false,"ges":false},{"t":"Semmelknödel","s":"Beilagen","c":"Schweiz & Deutschland","time":"1 h","min":60,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"250 ml","n":"Milch"},{"a":"2","n":"Eier"},{"a":"","n":"Salz & Pfeffer"},{"a":"","n":"Muskat"},{"a":"250 g","n":"alte Semmeln gewürfelt"},{"a":"1","n":"Zwiebel gehackt"},{"a":"2 EL","n":"Petersilie"}],"st":["Milch, Ei und Gewürze gut versprudeln, über die Semmelwürfel gießen, vermengen, ca. 20 min ziehen lassen.","Inzwischen Zwiebel fein hacken und in Butter glasig dünsten. Etwas abkühlen lassen und über die Semmelmasse geben. Petersilie untermischen. Alles gut vermengen.","Mit feuchten Händen 8 Knödel formen, dabei gut festdrücken und außen glätten, damit sie später nicht zerfallen.","Dämpfeinsatz und Wasser in einen gut schließenden Topf geben, Knödel daraufsetzen. Ca. 30 min im heißen Dampf garen."],"id":"semmelknoedel","y":[8,"kn"],"img":"semmelknoedel.jpg","hp":false,"ges":false},{"t":"Spaetzli / Knoepfli","s":"Beilagen","c":"Schweiz & Deutschland","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"500 g","n":"Hartweizen- oder Dinkelgriess"},{"a":"1 TL","n":"Salz"},{"a":"5","n":"Eier"},{"a":"150 ml","n":"Wasser"},{"a":"150 ml","n":"Milch"}],"st":["Schlagen bis der Teig blasen wirft (mit Küchenmaschine)","30 Minuten ruhen lassen.","Mit Spätzle Schaber in kochendes Wasser geben und Kochen lassen bis die Spätzle oben Schwimmen. Mit einer Schaumkelle rausheben."],"id":"spaetzli-knoepfli","y":[4,"p"],"img":"spaetzli-knoepfli.jpg","hp":false,"ges":false},{"t":"Nudelteig","s":"Beilagen","c":"Italien & Mittelmeer","time":"1 h 30 Min","min":90,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"300 g","n":"Hartweizengriess"},{"a":"200 g","n":"Mehl (Typ 550)"},{"a":"3","n":"Eier"},{"a":"etwas","n":"kaltes Wasser"}],"st":["Griess, Mehl und Ei mit den Knethaken des Handrührgerätes zu streuselartigen Krümeln verrühren. Nun nach und nach in kleinsten Mengen (teelöffelweise) kaltes Wasser hinzugeben und weiter kneten, bis kein trockener Grieß oder trockenes Mehl mehr zwischen den \"Streuseln\" zu sehen ist. Zum Schluss die Streusel mit der Hand zu einem festen Teig zusammenkneten. Eine Kugel formen und in Folie mindestens eine Stunde kaltstellen.","Nach der Ruhezeit den Teig in kleinen Portionen (ca. 80 - 100 g) durch die Nudelmaschine geben. Einmal falten und wieder durchgeben, insgesamt ca. 10–15-mal! Der Teig hat die richtige Konsistenz, wenn er in den ersten Durchgängen noch reißt, und erst so nach dem 4. oder 5. Durchlauf geschmeidig wird. Der Teig darf sich nicht klebrig anfühlen. Dann braucht es auch kein Mehl, um den Teig sauber durch die Maschine zu bekommen.","Jetzt erst den Abstand der Walzen bis zur gewünschten Dicke verringern (bis Stufe 5 Kitchenaid) und nach Belieben schneiden oder formen. Die Pasta auf einem Ständer oder mit Mehl bestäubt locker auslegen, bis sie verwendet wird. Ca 30 Minuten antrocknen lassen vor dem Kochen."],"id":"nudelteig","y":[5,"p"],"img":"nudelteig.jpg","hp":false,"ges":false},{"t":"Dreierlei Karottencreme","s":"Beilagen","c":"","time":"40 Min","min":40,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"1","n":"Karotte orange"},{"a":"1","n":"Karotte gelb"},{"a":"1","n":"Karotte lila"},{"a":"1","n":"Zwiebel"},{"a":"1-2","n":"Knoblauchzehen"},{"a":"","n":"Salz"},{"a":"","n":"Pfeffer"},{"a":"2-3 EL","n":"Weisswein"},{"a":"5-6 Stk","n":"Cashewnüsse"},{"a":"3-5 EL","n":"Sahne oder Milch"},{"a":"1 TL","n":"Currypulver"},{"a":"1 TL","n":"rote Beetepulver"}],"st":["Karotten im Wasserdampf garen; parallel Zwiebeln und Knoblauch in Öl goldbraun anbraten mit Salz und Pfeffer abwürzen und mit Weisswein ablöschen. Die Karotten nach Farbe trennen und je eine Farbe im Mixer (oder mit dem Handmixer) zu einer eigenständigen Creme verarbeiten.","Orangene Karottencreme = Zwiebeln, Knoblauch; 1-2 Stk Cashew, 1-2 EL Sahne/Milch","Gelbe Karottencreme = Zwiebeln, Knoblauch; 1-2 Stk Cashew, 1-2 EL Sahne/Milch; Currypulver","Lila Karottencreme = Zwiebeln, Knoblauch; 1-2 Stk Cashew, 1-2 EL Sahne/Milch; rote Beetepulver"],"id":"dreierlei-karottencreme","y":[4,"p"],"img":"dreierlei-karottencreme.jpg","hp":false,"ges":true},{"t":"Meerrettich-Beetecreme","s":"Beilagen","c":"","time":"40 Min","min":40,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"3-5","n":"Beete gelb (klein)"},{"a":"1","n":"Zwiebel klein"},{"a":"2","n":"Knoblauchzehen"},{"a":"1 TL","n":"Currypulver"},{"a":"","n":"Salz"},{"a":"","n":"Pfeffer"},{"a":"2-3 EL","n":"Weisswein"},{"a":"1 Stk","n":"frischer Meerrettich (2cm od. daumengross)"},{"a":"5-6 Stk","n":"Cashewnüsse"},{"a":"3-5 EL","n":"Sahne oder Milch"}],"st":["Beete im Wasserdampf garen; parallel Zwiebeln, Knoblauch und Curry in Öl goldbraun anbraten mit Salz und Pfeffer abwürzen und mit Weisswein ablöschen. Die Beete im Mixer (oder mit dem Handmixer) zu einer eigenständigen Creme verarbeiten."],"id":"meerrettich-beetecreme","y":[4,"p"],"img":"meerrettich-beetecreme.jpg","hp":false,"ges":true},{"t":"Knuspriger Backofen Blumenkohl","s":"Beilagen","c":"","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"1","n":"Mittelgrosser Blumenkohl, vorgekocht (noch bissfest, nicht matschig)"},{"a":"4 EL","n":"Öl (Olivenöl oder Rapsöl)"},{"a":"80 g","n":"Semmelbrösel / Paniermehl"},{"a":"2 EL","n":"Mehl"},{"a":"40 g","n":"geriebener Parmesan (optional, aber sehr gut für Knusper & Geschmack)"},{"a":"1 TL","n":"Paprikapulver (edelsüß oder geräuchert)"},{"a":"½ TL","n":"Knoblauchpulver oder 1 kleine gepresste Knoblauchzehe"},{"a":"1 TL","n":"Salz"},{"a":"½ TL","n":"Pfeffer"}],"st":["Auf 200 °C Ober-/Unterhitze (oder 190 °C Umluft).","Vorgekochten Blumenkohl gut abtropfen lassen. Er sollte möglichst trocken sein, sonst wird die Panade weich.","Alles in eine große Schüssel geben. Gut Durchmischen oder Durchschüteln (wenn Deckel vorhanden) bis die Röschen rundum mit der Bröselmischung überzogen sind.","Auf ein mit Backpapier belegtes Blech verteilen. Nicht stapeln, sonst wird es weich statt knusprig.","Backen","200 °C Ober-/Unterhitze (oder 190 °C Umluft).","25–30 Minuten, bis alles goldbraun und knusprig ist.","Nach der Hälfte der Zeit einmal wenden oder das Blech kräftig durchschütteln."],"id":"knuspriger-backofen-blumenkohl","y":[4,"p"],"img":"knuspriger-backofen-blumenkohl.jpg","hp":false,"ges":true},{"t":"Backofen Fenchel","s":"Beilagen","c":"Italien & Mittelmeer","time":"25 Min","min":25,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"1","n":"Fenchelknolle"},{"a":"1","n":"Zwiebel"},{"a":"1 handvoll","n":"Fetakäse (Krümel)"},{"a":"","n":"Salz"},{"a":"","n":"Pfeffer"},{"a":"1-2 EL","n":"Olivenöl"}],"st":["Fenchel und Zwiebel in ganz feine Scheiben/Streifen raspeln. Alle Zutaten vermengen und gleichmässig auf einem grossen Backblech verteilen. Im Backofen bei 220 Grad Celsius 15-20min goldbraun, knusprig backen."],"id":"backofen-fenchel","y":[2,"p"],"img":"backofen-fenchel.jpg","hp":false,"ges":true},{"t":"Hollandaise (Gestreckt)","s":"Saucen, Pesto & Pasten","c":"Frankreich","time":"20 Min","min":20,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"20 g","n":"Speisestärke"},{"a":"250 ml","n":"Gemüsebrühe"},{"a":"2","n":"Eigelb"},{"a":"50 g","n":"kalte Butter"},{"a":"1 EL","n":"Zitronensaft"},{"a":"1 Prise","n":"Zucker"},{"a":"","n":"Salz & Pfeffer"}],"st":["Speisestärke mit kalter Gemüsebrühe glattrühren und bei schwacher Hitze unter ständigem Rühren dick kochen lassen.","Anschliessend auf dem heissen, aber nicht kochenden Wasserbad abwechselnd Eigelb und Butterflöckchen unterschlagen. Das geht am besten mit der Schlagscheibe des Pürierstabes. Zum Schluss Zitronensaft und Geschmackszutaten unterrühren. Die Sauce muss dicklich sein und darf nicht gerinnen. Die fertige Sauce sofort zu Tisch geben und allenfalls kurzfristig im Wasserbad warmhalten.","Die Eigelb- und Buttermenge kann je nach Geschmack erhöht oder verringert werden."],"id":"hollandaise-gest ce","s":"Dips & Aufstriche","c":"Amerika","time":"15 Min","min":15,"wait":false,"vegan":true,"veg":true,"gf":true,"i":[{"a":"1","n":"Zwiebel (klein) oder Frühlingszwiebel"},{"a":"1 Zehe","n":"Knoblauch"},{"a":"4-5","n":"reife Tomatillos"},{"a":"0.5 Bund","n":"frische Korianderblätter"},{"a":"0.5","n":"Limettensaft"},{"a":"","n":"Jalapenos (nach Belieben)"},{"a":"","n":"Salz"}],"st":["Zwiebeln und Knoblauch glasig anbraten (wer mag, kann diese auch roh verwenden).","Alle Zutaten in eine Küchenmaschine geben und häxeln (kleine Stücke dürfen übrigbleiben).","Passt zu allem mexikanischen."],"id":"tomatillo-sauce","y":[4,"p"],"hp":false,"ges":true,"img":"tomatillo-sauce.jpg"},{"t":"Gebrannte Creme","s":"Nachspeisen","c":"Schweiz & Deutschland","time":"30 Min + kühlen","min":30,"wait":true,"vegan":false,"veg":true,"gf":true,"i":[{"a":"90 g","n":"Zucker"},{"a":"10 g","n":"dunkler Zucker"},{"a":"50 ml","n":"Wasser kalt"},{"a":"50 ml","n":"Wasser heiß"},{"a":"500 ml","n":"Milch"},{"a":"1 EL","n":"Maisstärke (gehäuft)"},{"a":"2","n":"Eier"}],"st":["Zucker mit kaltem Wasser karamellisieren lassen; von der heißen Pfanne ziehen (muss dunkel, klebrig und - fast verbrannt - sein); mit heißem Wasser ablöschen, ACHTUNG: Spritzgefahr! Wieder aufkochen und wenn der Karamell wieder aufgelöst ist mit der Ei, Stärke & Milch-Flüssigkeit vermischen. Langsam unter ständigem Ruhren zur Rose abziehen (65°). Abgießen, Folie drüber und fertig."],"id":"gebrannte-creme","y":[4,"p"],"hp":false,"ges":false},{"t":"Moelleux au Chocolat","s":"Nachspeisen","c":"Frankreich","time":"30 Min + Gefrieren","min":30,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"100 g","n":"Butter"},{"a":"140 g","n":"Zucker (40g bei weisser Schokolade)"},{"a":"2","n":"Eier"},{"a":"2","n":"Eigelb"},{"a":"80 g","n":"Mehl"},{"a":"150 g","n":"Schokolade 90% Kakaoanteil (oder 100g 90% und 50g 99%)"}],"st":["Die weiche Butter mit dem Zucker schaumig schlagen.  Eier und Eigelb nach und nach unterziehen, Mehl und geschmolzene Schokolade zugeben und in gebutterte Auflauf Förmchen füllen. Förmchen komplett durchfrieren lassen und im gefrorenen Zustand im Ofen bei 180 Grad 15-16 min. backen.","Sofort warm servieren. Der Clou dabei ist, dass der Schokokern flüssig bleibt und beim","anschneiden auslauft (deshalb medium) Dazu passen Zimteisnocken, eingelegte Feigen oder andere Winterfrüchte. Ein einfaches aber trotzdem raffiniertes Dessert.","Lässt sich wunderbar vorbereiten und bevorraten","Ergibt ca. 6 Muffin Formen."],"id":"moelleux-au-chocolat","y":[6,"s"],"hp":false,"ges":false,"img":"moelleux-au-chocolat.jpg"},{"t":"Mousse au Chocolat","s":"Nachspeisen","c":"Frankreich","time":"30 Min + kühlen","min":30,"wait":true,"vegan":false,"veg":true,"gf":true,"i":[{"a":"5","n":"Eier"},{"a":"250 g","n":"Schokolade (Zartbitter, oder Blockschokolade)"},{"a":"50 g","n":"Butter"},{"a":"1","n":"Espresso"},{"a":"3-4 EL","n":"Cognac"},{"a":"½","n":"Zitrone (Saft)"},{"a":"50g","n":"Zucker"}],"st":["Eier teilen (Eiweiss/Eigelb).","Schokolade im Wasserbad schmelzen; vom Herd nehmen, mit Eigelb kaltrühren.","Butter flüssig machen und zu Masse dazugeben. Espresso und Cognac dazu.","Während dessen immer rühren -","Derweil das Eiweiß von den 5 Eiern mit Saft von einer ½ Zitrone (max.) steifschlagen.","Zucker zugeben und langsam die steife Masse zur Schoggimasse geben."],"id":"mousse-au-chocolat","y":[6,"p"],"hp":false,"ges":false,"img":"mousse-au-chocolat.jpg"},{"t":"Mousse Au Chocolat (Vegan)","s":"Nachspeisen","c":"Frankreich","time":"30 Min + 2 h kühlen","min":30,"wait":true,"vegan":true,"veg":true,"gf":true,"i":[{"a":"175 g","n":"Aquafaba (Kichererbsen-Kochflüssigkeit)"},{"a":"1TL","n":"Sahnesteif (Maisstärke/Traubenzucker)"},{"a":"100 g","n":"Puderzucker"},{"a":"200 g","n":"Zartbitterschokolade 70% zerhackt"},{"a":"100 g","n":"Cashewbruch (über Nacht einweichen oder in kochendes Wasser)"},{"a":"200 ml","n":"warme Pflanzenmilch"},{"a":"1/2TL","n":"gemahlene Vanille"},{"a":"30 g","n":"neutrales Öl (nach Belieben)"}],"st":["Für den Kicherschnee das Kichererbsenwasser 5 Minuten mit Sahnesteif in der Küchenmaschine oder mit dem Handquirl aufschlagen. Dann Puderzucker dazugeben und weitere 5 Minuten aufschlagen.","Die Zutaten der Schokomasse zusammen im Hochleistungsmixer glattpürieren. Alternativ die Schokolade im Wasserbad schmelzen und zusammen mit den restlichen Zutaten und dem eingeweichten Cashewbruch mit dem „normalen“ Mixer / Stabmixer glatt pürieren. Dann die leicht warme Schokomasse mit dem Schneebesen sanft unter den Kicherschnee heben. Die Masse in die finalen Gläser oder Schalen abfüllen und kalt stellen für mind. 2 Stunden.","Nach Belieben noch fein geraspelte Schokoladen-Stückchen vor dem Abfüllen unter die Masse ziehen.","Du kannst auch eine weiße Mousse machen. Dann musst du allerdings doppelt so viel an Schokolade (weiß) verwenden.","Anstatt Cashewbruch kannst du auch weißes Mandelmus (beste Qualität) verwenden"],"id":"mousse-au-chocolat-vegan","y":[6,"p"],"hp":false,"ges":false,"img":"mousse-au-chocolat-vegan.jpg"},{"t":"Crepes D’Alsace","s":"Nachspeisen","c":"Frankreich","time":"1 h","min":60,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"275 g","n":"Mehl"},{"a":"7 g","n":"Salz"},{"a":"62 g","n":"Zucker"},{"a":"5-6","n":"Eier"},{"a":"50 g","n":"Öl"},{"a":"125 g","n":"Butter"},{"a":"100 ml","n":"Grand Marnier"},{"a":"1","n":"Orange (nur Zesten)"},{"a":"500 ml","n":"Milch"}],"st":["Mehl, Salz und Zucker mit Schneebesen verrühren. DannvEier, Öl und Butter (wärmen bei 50 Grad) Grand Marnier und Orangenhaut zugeben; zum Schluss die Milch.","30 Minuten ruhen lassen; dann die Crepes mit wenig Fett in kleiner Pfanne anbraten."],"id":"crepes-dalsace","y":[20,"s"],"hp":false,"ges":false,"img":"crepes-dalsace.jpg"},{"t":"Pfannkuchen/Crepes","s":"Nachspeisen","c":"Frankreich","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"75 g","n":"Dinkelvollkornmehl"},{"a":"75 g","n":"Hafermehl"},{"a":"3","n":"Eier" f":false,"i":[{"a":"900g","n":"Äpfel, geraffelt (800g geraffelt)"},{"a":"350 g","n":"Nüsse, ganz oder grob gehackt (z.B. Walnüsse, Mandeln, Haselnüsse)"},{"a":"700 g","n":"Dörrobst geschnitten (z.B. Pflaumen, Aprikosen, Rosinen, Cranberries...)"},{"a":"100 ml","n":"Rum oder Obstler"},{"a":"100 ml","n":"Apfelsaft"},{"a":"4 TL","n":"Zimt"},{"a":"0.5 TL","n":"Kardomon"},{"a":"2 MSp.","n":"Nelke"},{"a":"400 g","n":"Vollkornmehl"},{"a":"2 pkg","n":"Backpulver"},{"a":"1TL","n":"Salz"}],"st":["Nüsse, Obst, Gewürze & Rum zusammenmischen und über Nacht stehen lassen.","Mehl, Backpulver, Salz zusammenmischen und am nächsten Tag zusammenkneten.","4 Brote formen.","Bei ca. 170°C 75 min backen."],"id":"fruechtebrot","y":[4,"br"],"hp":false,"ges":true,"img":"fruechtebrot.jpg"},{"t":"Käsekuchen","s":"Kuchen","c":"Schweiz & Deutschland","time":"1 h 45 Min + auskühlen","min":105,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"h":"Boden"},{"a":"125 g","n":"Butter"},{"a":"30 g","n":"Zucker"},{"a":"1","n":"Eigelb"},{"a":"150 g","n":"Mehl (halb Vollkorn, halb weiss)"},{"a":"3-4 g","n":"Salz (1 Espresso Löffel)"},{"a":"","n":"Schale von einer Zitrone"},{"h":"Kuchenmasse"},{"a":"120 g","n":"Butter"},{"a":"170 g","n":"Zucker"},{"a":"1 Pkg","n":"Vanillezucker"},{"a":"1 Pkg","n":"Vanillepudding (zum Kochen, ohne Zucker)"},{"a":"3","n":"Eier"},{"a":"250 g","n":"Magerquark"},{"a":"250 g","n":"Sahnequark"},{"a":"","n":"(oder 500g Halbfettquark)"},{"a":"200 g","n":"Saure Sahne (Creme Fraiche)"},{"a":"25 ml","n":"Zitronensaft"},{"a":"200 g","n":"Sahne"}],"st":["Boden","Butter, Zucker, Eigelb schaumig rühren. Mehl und Zitronenschale daruntermischen und in eine Springform drücken und Kaltstellen.","Kuchemasse","Butter, Zucker, Pudding und Eier schaumig schlagen (nicht zu sehr, sonst geht der Kuchen zu stark auf). Quark, Saure Sahne und Zitronensaft unterrühren, Sahne steif schlagen und unterheben.","Bei 180°C Ober- Unterhitze für 60 min. backen. Kuchen im Ofen auskühlen lassen (Ofentür nicht
