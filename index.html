a":"200g","n":"Zucker"},{"a":"150g","n":"Mehl"},{"a":"Obst","n":"saure Beeren oder Rhabarber zum bestreuen"},{"a":"50 g","n":"Butter"},{"a":"80g","n":"Hagelzucker"}],"st":["Eier und Zucker schaumig rühren. Mehl beimischen.","Teig in ausgebutterte Gratinform geben. Früchte darauf verteilen.","Butter in dünne Scheiben schneiden und auf die Früchte geben. Hagelzucker darauf verteilen","Bei 180°C ca. 35 Min backen."],"id":"schwedischer-obstkuchen","y":[1,"k"],"hp":false,"ges":false,"img":"schwedischer-obstkuchen.jpg"},{"t":"Zimtschnecken","s":"Kuchen","c":"Skandinavien","time":"3 h","min":180,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"500 ml","n":"Milch"},{"a":"2 Pkg","n":"Vanille-Puddingpulver zum Kochen"},{"a":"100 ml","n":"Wasser"},{"a":"120 g","n":"Butter"},{"a":"5 EL","n":"Zucker"},{"a":"2","n":"Eier"},{"a":"2 Pkg.","n":"Trockenhefe"},{"a":"1 TL","n":"Salz"},{"a":"800 g","n":"Mehl"},{"a":"150 g","n":"Butter"},{"a":"250 g","n":"brauner Zucker"},{"a":"5 TL","n":"Zimt"},{"a":"100 g","n":"Puderzucker"},{"a":"200 g","n":"Frischkäse"},{"a":"100 g","n":"Butter"},{"a":"0.5","n":"Zitronensaft"}],"st":["Milch aufkochen, Puddingpulver mit kaltem Wasser verrühren und in die kochende Milch einrühren, kurz kochen lassen bis der Pudding eingedickt ist, dabei ständig rühren. Vom Herd nehmen, Butter einrühren bis sie geschmolzen ist, Zucker und Eier einrühren. Wenn die Masse noch handwarm ist, die Trockenhefe unterrühren. Salz und Mehl vermischen, Puddingmasse hinzugeben und zu einem weichen, leicht klebrigen Teig verarbeiten Gehen lassen bis der Teig sich verdoppelt hat (1-2 Stunden).","Den Teig halbieren und auf einer gut bemehlten Fläche auswalken, mit der Hälfte der flüssigen Butter bestreichen, und jeweils der Hälfte von Zimt und braunem Zucker bestreuen. Eng aufwickeln und in ca. 4cm breite Stücke schneiden. Mit dem restlichen Teig gleich verfahren. Die Zimtschnecken mit Abstand zueinander (am besten seitlich versetzt) auf ein mit Backpapier ausgelegtes Blech geben und nochmals 30 Min. gehen lassen. Es ist wichtig, dass sie nicht zu dicht aneinander stehen, sich aber dennoch nach dem letzten Gehen ganz leicht berühren. Bei 200° ca. 20 Min. backen, nicht zu dunkel werden lassen.","Für das Frosting alle Zutaten zu einer cremigen Masse rühren und über die noch warmen Zimtschnecken streichen."],"id":"zimtschnecken","y":[24,"s"],"hp":false,"ges":false,"img":"zimtschnecken.jpg"},{"t":"Schoko Kuchen mit Cream Cheese Frosting","s":"Kuchen","c":"Amerika","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"100g","n":"Butter"},{"a":"100g","n":"dunkle Schokolade (85%)"},{"a":"2","n":"Eier"},{"a":"40g","n":"Zucker"},{"a":"½ Pkg","n":"Vanillezucker"},{"a":"1 EL","n":"Mehl"},{"a":"½ Pkg","n":"Puddingpulver (Schoko zum Kochen mit Zucker)"},{"a":"1/2 TL","n":"Backpulver"},{"a":"100g","n":"Butter, weiche"},{"a":"100g","n":"Puderzucker"},{"a":"200g","n":"Frischkäse (Philadelphia)"},{"a":"1 TL","n":"Vanille - Paste"},{"a":"","n":"(alternativ 1 Vanilleschote)"},{"a":"½","n":"Zitrone, Schale und Saft (je nach Zitronengrösse nur ein Teil des Saftes)"}],"st":["Für den Teig die Butter und Schokolade in einem Topf bei geringer Hitze schmelzen lassen. Die Eier mit dem Zucker aufschlagen und die restlichen Zutaten beigeben und verrühren.","Den Teig in eine runde Springform geben und bei 140°C (Ober-/Unterhitze) etwa 15 - 20 Minuten backen. Der Teig darf ruhig noch ein bisschen \"matschig\" sein, durch das Puddingpulver wird er dann beim Erkalten fest und besonders saftig. Das Blech herausnehmen und abkühlen lassen.","Weiche Butter mit Handrührer kurz cremig schlagen, Puderzucker unterrühren; dann Frischkäse und Vanillepaste mit Schneebesen zu einer homogenen Masse verrühren.","Die Vanillepaste verleiht dem Frosting einen intensiven Vanillegeschmack, mehr noch als Vanilleextrakt oder -zucker. Evtl. alternativ auf eine Vanilleschote zurückgreifen"],"id":"schoko-kuchen-mit-cream-cheese-frosting","y":[1,"k"],"hp":false,"ges":false,"img":"schoko-kuchen-mit-cream-cheese-frosting.jpg"},{"t":"Fudge Brownies","s":"Kuchen","c":"Amerika","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"200 g","n":"Mehl (oder gemahlene Haferflocken/Hafermehl für glutenfrei)"},{"a":"½ TL","n":"Salz"},{"a":"220 g","n":"Butter, in Stücken"},{"a":"270 g","n":"Zucker"},{"a":"1 Pkt.","n":"Vanillinzucker"},{"a":"60 ml","n":"Kaffee, gekochter"},{"a":"350 g","n":"Schokolade, ca. 80% Kakaoanteil"},{"a":"4 große","n":"Eier"},{"a":"100 g","n":"Walnüsse oder Pekannüsse, grob gehackte"}],"st":["Ofen vorheizen auf 180° C. Rechteckige Form fetten (22x33cm).","In einer Schüssel Mehl und Salz vermischen.","In einem Topf Butter, Zucker, Vanillinzucker und Kaffee bei mittlerer Hitze und ständigem Rühren aufkochen lassen. Vom Herd nehmen. Schokolade hinzufügen und so lange rühren, bis alle Schokolade geschmolzen ist. Diese Schoko-Mischung ein wenig abkühlen lassen. Ab und zu umrühren.","Eier mit einem Löffel unter die Mischung ziehen und gut verrühren.","Mehl und Salz unterziehen, bis alles gerade gut genug verrührt ist. Walnüsse unterziehen.","Teig in die vorbereitete Form füllen und glattstreichen. 20-25 min backen. Bei Glasformen eher länger (+ ca. 7 min). Stäbchen darf bei Stäbchenprobe ruhig im unteren Drittel noch ein wenig Teig oder Teigkrume kleben haben."],"id":"fudge-brownies","y":[1,"b"],"gfn":"Mit Hafermehl statt Mehl.","hp":false,"ges":false,"img":"fudge-brownies.jpg"},{"t":"Bananen Brot","s":"Kuchen","c":"Amerika","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"2","n":"Überreife Bananen (gross)"},{"a":"2","n":"Eier"},{"a":"100g","n":"Haferflocken"},{"a":"70 g","n":"Kokosöl oder Kakaobutter geschmolzen"},{"a":"100 g","n":"Datteln oder Rosinen"},{"a":"15 g","n":"Kakaopulver"},{"a":"1 TL","n":"Backpulver"},{"a":"1 TL","n":"Zimt"}],"st":["Alles in einen Mixer (Blender) geben und mixen. Bei 200°C 35 Minuten Backen"],"id":"bananen-brot","y":[1,"br"],"hp":false,"ges":true,"img":"bananen-brot.jpg"},{"t":"Bananen Brot ohne Fett","s":"Kuchen","c":"Amerika","time":"55 Min","min":55,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"3","n":"Überreife Bananen (300 g)"},{"a":"2","n":"Eier"},{"a":"100g","n":"Äpfel oder Apfelmus"},{"a":"200 g","n":"Vollkornmehl"},{"a":"50 g","n":"Nüsse grob gehackt (Walnüsse)"},{"a":"1 TL","n":"Backpulver"},{"a":"1 TL","n":"Zimt"}],"st":["Bananen, Eier und Äpfel in einem Mixer schaumig schlagen und mit restlichen Zutaten vermengen.","Bei 180°C 45 min. backen."],"id":"bananen-brot-ohne-fett","y":[1,"br"],"hp":false,"ges":true,"img":"bananen-brot-ohne-fett.jpg"},{"t":"Vanillekipferl","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"1 h + 2 h kühlen","min":60,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"50 g","n":"gemahlene Mandeln ohne Schale"},{"a":"50 g","n":"gemahlene Haselnüsse"},{"a":"300 g","n":"Mehl"},{"a":"100 g","n":"Zucker (allenfalls einen Teil mit Vanillezucker ersetzen)"},{"a":"1 Prise","n":"Salz"},{"a":"200 g","n":"Butter"},{"a":"2","n":"Eigelbe"}],"st":["Alles zu einem Teig zusammenkneten. Den Teig in Folie gewickelt 2 Stunden im Kühlschrank ruhen lassen.","Teig portionsweise in bleistiftdicke Röllchen formen und aus jeweils 4-5 cm die Kipferl formen.","Bei 190°C 10-12 Minuten backen.","Noch warm in einem Vanillezucker & Puderzuckergemisch vorsichtig wenden.","Ergibt 2 Blech voll"],"id":"vanillekipferl","y":[2,"b"],"hp":false,"ges":false,"img":"vanillekipferl.jpg"},{"t":"Spitzbuben","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"1 h + 2 h kühlen","min":60,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"100 g","n":"gemahlene Mandeln"},{"a":"300 g","n":"Mehl"},{"a":"150 g","n":"Puderzucker"},{"a":"1 Prise","n":"Salz"},{"a":"200 g","n":"Butter"},{"a":"1 Pkg","n":"Vanillezucker"},{"a":"1 TL","n":"Zitronenschale abgerieben"},{"a":"1","n":"Ei"},{"a":"200 g","n":"Himbeergelée"}],"st":["Alles zu einem Teig zusammenkneten. Den Teig in Folie gewickelt 2 Stunden im Kühlschrank ruhen lassen.","Teig ca. 3 mm dünn ausrollen und Formen ausstechen.","Bei 160°C 10-12 Minuten backen.","Johannisbeergelée auf die noch heissen Plätzen streichen und mit einem anderen „zusammenkleben“.","Ca. 50 Stück"],"id":"spitzbuben","y":[50,"s"],"hp":false,"ges":false,"img":"spitzbuben.jpg"},{"t":"Kekse zum Ausstechen","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"1 h + 1 h kühlen","min":60,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"100 g","n":"Butter"},{"a":"60 g","n":"Zucker"},{"a":"1","n":"Ei"},{"a":"1 Prise","n":"Salze"},{"a":"Optional","n":"Vanille oder Zitronenabrieb"},{"a":"250 g","n":"Mehl"}],"st":["Butter und Zucker cremig rühren, Ei und Salz dazu und schaumig rühren. Mehl dazu und 1-2 h kalt stellen. Teig 6-8 mm dick ausrollen unf Formen ausstechen.","Bei 180°C  (Ober-/Unterhitze)für 8-10 min. backen","Zimt Zuckerguss","120 g \tPuderzucker","2–3 EL \tWasser)","1 TL \t\tZimt","Optional: eine winzige Prise Vanille oder Salz (macht den","Puderzucker sieben (wichtig für einen glatten Guss). Zimt untermischen.","Nach und nach 2–3 EL Wasser oder Milch einrühren, bis ein dickflüssiger, streich- oder spritzbarer Guss entsteht.","Für dickeren Guss → mehr Puderzuclkker","Für dünneren Guss → mehr Wasser/Milch","Guetzli nach dem Backen vollständig auskühlen lassen.","Guss mit Löffel, Pinsel oder Spritztüte auftragen."],"id":"kekse-zum-ausstechen","y":[1,"b"],"hp":false,"ges":false,"img":"kekse-zum-ausstechen.jpg"},{"t":"Zitronenkekse","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"45 Min + kühlen","min":45,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"125 g","n":"Butter"},{"a":"40 g","n":"Zucker"},{"a":"1","n":"Eigelb"},{"a":"150 g","n":"Mehl (halb Vollkorn, halb weiss)"},{"a":"","n":"Schale von einer Zitrone"}],"st":["Butter, Zucker, Eigelb schaumig rühren,","Mehl daruntermischen und kaltstellen und ausstechen oder eine Rolle formen, in den Tiefkühler legen und Scheiben abschneiden.","Bei 160°C für 10-12 min. backen"],"id":"zitronenkekse","y":[1,"b"],"hp":false,"ges":false,"img":"zitronenkekse.jpg"},{"t":"Rum Kugeln","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"30 Min + kühlen","min":30,"wait":true,"vegan":false,"veg":true,"gf":true,"i":[{"a":"150-175 g","n":"Zartbitterschokolade"},{"a":"2-3 EL","n":"Rum"},{"a":"3","n":"Eigelbe"},{"a":"125 g","n":"Butter"},{"a":"60 g","n":"Puderzucker"}],"st":["Schokolade im Wasserbad schmelzen und Rum dazugeben.","Eigelbe einrühren, dann Butter und Puderzucker dazugeben.","Kühl stellen, Kugeln formen und nach Belieben in Schokostreuseln wälzen."],"id":"rum-kugeln","y":[20,"s"],"hp":false,"ges":false,"img":"rum-kugeln.jpg"},{"t":"Mandolinchen","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"100 g","n":"Butter"},{"a":"125 g","n":"Zucker"},{"a":"125 g","n":"ungeschälte Walnüsse, Mandeln oder Haselnüsse"},{"a":"1TL","n":"mässig gehäufter Zimt"},{"a":"1-2","n":"steifgeschlagene Eiweisse"},{"a":"200 g","n":"Mehl"},{"a":"2x","n":"breite Messerspitzen Backpulver"},{"a":"","n":"Puderzucker"},{"a":"","n":"Zitrone"}],"st":["Butter schaumig schlagen, Zucker, Nüsse, Zimt, Eiweiss, Mehl und Backpulver mischen. Teig 6-9 mm auswellen und zu kleinen Halbmonden ausstechen. Rasch bei mittlerer Hitze backen, Oberfläche exakt mit Guss aus gesiebtem Puderzucker und Zitrone bestreichen.","Bei 170°C ca. 10 min backen.","Ergibt ungefähr 50 Stück."],"id":"mandolinchen","y":[50,"s"],"hp":false,"ges":false,"img":"mandolinchen.jpg"},{"t":"Nussstangen","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"1 h + kühlen","min":60,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"330 g","n":"Zucker"},{"a":"100 g","n":"Butter"},{"a":"1x","n":"Zitrone, nur Zesten"},{"a":"2 g","n":"Zimt"},{"a":"2 g","n":"Salz"},{"a":"1 g","n":"Nelkenpulver"},{"a":"2","n":"Eier"},{"a":"130 g","n":"gemahlene Haselnüsse (Variation mit Mandeln oder anderen Nüssen mischen)"},{"a":"330 g","n":"Mehl"},{"a":"200 g","n":"ganze Haselnüsse mit Schale"},{"a":"","n":"Eigelb"},{"a":"","n":"Sahne"}],"st":["Zucker, Butter, Zitronenzesten, Zimt, Salz und Nelkenpulver in einer Rührmaschine schaumig schlagen.","Eigelb und Eiweiss in die Buttermasse einrühren.","Die gemahlenen Haselnüsse und das Mehl dazugeben und gut vermengen.","Die ganzen Haselnüsse dazu geben und vorsichtig in den Teig einarbeiten so dass sie ganz bleiben.","Den fertigen Teig nochmal vorsichtig von Hand kneten. Den Teig kühl stellen.","Den Teig ca. 1,5-2cm dick ausrollen. Den ganzen Teig mit einer Sahne- & Eigelbmischung bestreichen.","Den kühlen Teig in 12cm lange und 1,5-2cm breite Riegel schneiden.","Die Riegel für 18 Min. bei 180°C Umluft backen.","Ergibt ca. 2 Blech voll."],"id":"nussstangen","y":[2,"b"],"hp":false,"ges":false,"img":"nussstangen.jpg"},{"t":"Kakaokugel Kekse","s":"Kekse & Süsses","c":"Schweiz & Deutschland","time":"1 h + 2 h kühlen","min":60,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"250 g","n":"Mehl"},{"a":"100 g","n":"Puderzucker"},{"a":"200 g","n":"Butter"},{"a":"1 Pkg","n":"Vanillezucker"},{"a":"75 g","n":"Kakaopulver"},{"a":"150 g","n":"dunkle Schokolade (70%)"}],"st":["Alles zu einem Teig zusammenkneten. Den Teig in Folie gewickelt 2 Stunden im Kühlschrank ruhen lassen.","Kleine Kugeln formen und in der Mitte mit dem Finger ein Loch reindrücken.","Bei 165°C 12-13 Minuten backen.","Schokolade schmelzen und in die Einsenkung der kalten Plätzchen füllen.","Gibt 1 Blech ä 45-50 Kekse."],"id":"kakaokugel-kekse","y":[45,"s"],"hp":false,"ges":false,"img":"kakaokugel-kekse.jpg"},{"t":"Haferkekse","s":"Kekse & Süsses","c":"","time":"35 Min","min":35,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"125 g","n":"Butter"},{"a":"250 g","n":"kernige Haferflocken - Großblatt"},{"a":"100 g","n":"brauner Zucker - alternativ weisser Haushaltszucker"},{"a":"1 Pck.","n":"Bourbon-Vanillezucker"},{"a":"1 Ei","n":"Größe M"},{"a":"1/2 TL","n":"Zimt, gemahlen"},{"a":"1 Prise","n":"Salz"},{"a":"1 EL","n":"Weizenmehl Typ 405 - alternativ Dinkelmehl Typ 630"},{"a":"1 TL","n":"Backpulver"}],"st":["Butter bei mittlerer Hitze im Topf schmelzen. Sobald sie kurz aufgekocht hat, Haferflocken zugeben und gut vermengen, sodass alle Flocken mit Fett überzogen sind. Vom Herd ziehen und auskühlen lassen.","Inzwischen braunen Zucker, Vanillezucker und Ei mit dem Handrührgerät schaumig rühren. Zimt, Salz, Mehl und Backpulver kurz unterrühren.","Die Eimasse mit den ausgekühlten Haferflocken vermengen.","Backblech mit Backpapier belegen. Pro Keks einen gut gehäuften Teelöffel Teig abnehmen, mit einem zweiten Teelöffel aufs Blech streifen und leicht zusammenschieben. 2–3 cm Abstand lassen, da die Kekse etwas auseinanderlaufen.","Auf mittlerer Schiene bei 180 °C Ober-/Unterhitze ca. 12 Minuten backen, bis die Ränder leicht bräunen. Auf dem Blech auskühlen lassen, damit sie durch die Restwärme fester werden, danach lösen."],"id":"haferkekse","y":[20,"s"],"hp":false,"ges":false,"img":"haferkekse.jpg"},{"t":"Rohe Dattel-Pralinen","s":"Gesunde Snacks","c":"","time":"15 Min + kühlen","min":15,"wait":true,"vegan":true,"veg":true,"gf":true,"i":[{"a":"200 g","n":"Datteln (Medjool)"},{"a":"100 g","n":"Walnüsse oder andere Nüsse nach Wahl"},{"a":"2 EL","n":"rohes Kakaopulver"},{"a":"1 EL","n":"Mandelbutter"},{"a":"1 EL","n":"Kokosfett (kaltgepresst)"},{"a":"1 Prise","n":"Salz"}],"st":["Alle Zutaten in einer Küchenmaschine pürieren bis eine relativ feine Masse entsteht. Bei härteren Nusssorten diese zuerst zerkleinern und dann die restlichen Zutaten dazugeben.","Teig in eine Form geben und kaltstellen.","In Kugeln rollen oder in Stücke schneiden und servieren. Nach Belieben noch mit Kakaopulver bestreuen."],"id":"rohe-dattel-pralinen","y":[15,"s"],"hp":false,"ges":true},{"t":"Müsli Riegel","s":"Gesunde Snacks","c":"","time":"1 h 15 Min","min":75,"wait":false,"vegan":true,"veg":true,"gf":false,"i":[{"a":"300 g","n n + 20 h gehen","min":90,"wait":true,"vegan":true,"veg":true,"gf":false,"i":[{"h":"Helles Brot"},{"a":"500 g","n":"Mehl"},{"a":"15 g","n":"Salz"},{"a":"2 g","n":"Trockenhefe"},{"a":"375 g","n":"Wasser"},{"h":"Ruchbrot mit Körnern"},{"a":"300 g","n":"Weissmehl"},{"a":"100 g","n":"Vollkornmehl"},{"a":"12 g","n":"Salz"},{"a":"2 g","n":"Trockenhefe"},{"a":"300 g","n":"Wasser"},{"a":"2 EL","n":"Leinsamen"},{"a":"3EL","n":"Sonnenblumenkerne"}],"st":["Zutaten in einer grossen Schüssel gut vermischen bis ein klebriger Teig entsteht. Falls sich der Teig nicht ganz klebrig anfühlt, noch 1-2 Löffel Wasser hinzugeben.","Ca. 18 Stunden bei Raumtemparatur gehen lassen. Es müssen sich kleine Bläschen auf der Teigoberfläche gebildet haben.","Teig auf eine gut bemehlte Arbeitsfläche geben, möglichst in einem Stück und ohne den Teig zu sehr zu strecken & zu ziehen.  Den Teig nun sorgfältig zu einer Kugel falten.","Grosses Stück Backpapier bemehlen und den Teig mit der gefalteten Seite nach unten sorgfältig darauf legen. Teig abdecken und nochmal 2-3 Stunden gehen lassen oder bis der Teig beim Eindrücken nicht mehr nachgibt.","Eisentopf min. 30 Minuten bei 250 Grad vorheizen.","Sorgfältig Backpapier in den Eisentopf heben und bei geschlossenem Deckel 30 min. Backen.","Deckel abnehmen und noch mal 15-30 min backen, bis das Brot eine dunkelbraune Farbe hat, aber noch nicht verbrannt ist."],"id":"brot-ohne-kneten","y":[1,"br"],"hp":false,"ges":false},{"t":"Vollkornbrot","s":"Brot","c":"Schweiz & Deutschland","time":"1 h 15 Min + 1 Nacht","min":75,"wait":true,"vegan":true,"veg":true,"gf":false,"i":[{"a":"450g","n":"Dinkelvollkornmehl"},{"a":"120 g","n":"Haferflocken"},{"a":"30 g","n":"Chiasamen oder Leinsamen geschrotet"},{"a":"500 ml","n":"Wasser"},{"a":"12 g","n":"Salz"},{"a":"0.5 Pkg","n":"Hefe"}],"st":["Zutaten gut vermischen (muss nicht geknetet werden). Über Nacht gehen lassen. In eine mit Butter bepinselte Kastenform geben.","Bei 180°C Ober-/Unterhitze ca. 60 Minuten backen","Schnelle Variante:","Ganze Packung Hefe nehmen und zusätzlich 2 EL dunklen Balsamico beigeben. Direkt ohne gehen lassen in den kalten Ofen geben."],"id":"vollkornbrot","y":[1,"br"],"hp":false,"ges":true},{"t":"High Protein Vollkornbrot","s":"Brot","c":"","time":"1 h 30 Min + 1 Nacht","min":90,"wait":true,"vegan":true,"veg":true,"gf":false,"i":[{"a":"260 g","n":"Vollkorn-Dinkelmehl"},{"a":"80 g","n":"Kichererbsenmehl"},{"a":"40 g","n":"gemahlene Sojaflocken"},{"a":"45 g","n":"Haferkleie"},{"a":"25 g","n":"Leinsamen sehr fein geschrotet"},{"a":"1 EL","n":"Flohsamenschalen"},{"a":"½  Pkg","n":"Trockenhefe"},{"a":"12 g","n":"Salz"},{"a":"1 TL","n":"Brotgewürz (optional)"},{"a":"390–420 ml","n":"Wasser"},{"a":"2 EL","n":"Olivenöl"},{"a":"1 TL","n":"Zucker oder Ahornsirup"},{"a":"1 TL","n":"Balsamico"}],"st":["Alle trockene Zutaten gründlich mischen. Flüssiges einarbeiten","Teig soll sehr weich, leicht zähflüssig sein (fast wie dicke Polenta).","8–10 Minuten Kneten","Abgedeckt Über Nacht gehen lassen","In die Form streichen 30 Minuten ruhen lassen.","Ofen auf 200 °C Ober-/Unterhitze vorheizen.","Backen:","10 Minuten bei 200 °C","dann 180 °C, 45–50 Minuten"],"id":"high-protein-vollkornbrot","y":[1,"br"],"hp":true,"ges":true},{"t":"Glutenfreies Brot","s":"Brot","c":"","time":"1 h 45 Min","min":105,"wait":false,"vegan":true,"veg":true,"gf":true,"i":[{"a":"100 g","n":"Kokosöl"},{"a":"1000 ml","n":"Wasser"},{"a":"30-35 g","n":"Meersalz (5 TL)"},{"a":"50 g","n":"Ahornsirup, Honig oder Agavensirup"},{"a":"500g","n":"Haferflocken (glutenfrei)"},{"a":"400 g","n":"Sonnenblumenkerne"},{"a":"250 g","n":"Leinsamen geschrotet"},{"a":"150 g","n":"Haselnüsse, Walnüsse oder Kürbiskerne (oder nochmal Sonnenblumenkerne)"},{"a":"60 g","n":"Flohsamenschalen"}],"st":["Kokosöl zusammen mit Wasser, Salz und Süssungsmittel erhitzen, bis das Kokosöl geschmolzen ist (heiss aber nicht kochend).","Sämtliche trockene Zutaten zusammen in eine grosse Schüssel geben und gut vermengen. Es können zusätzlich noch 3-4 EL Chia- oder Sesamsamen zugefügt werden, wenn gewünscht.","Flüssige Zutaten beigeben und gut vermischen.","Alles in 2-3 Brot-Backform geben, kurz quellen lassen.","Brot bei 175° 20 min Backen, aus der Form nehmen und noch mal 50-60 min fertigbacken.","Ergibt 2 grosse, bzw. 3 mittelgrosse Brote. Können sehr gut eingefroren werden."],"id":"glutenfreies-brot","y":[2,"br"],"hp":false,"ges":true},{"t":"Protein Knäckebrot","s":"Brot","c":"","time":"1 h 15 Min","min":75,"wait":false,"vegan":true,"veg":true,"gf":true,"i":[{"h":"Einfach"},{"a":"150 g","n":"Hafermehl"},{"a":"120 g","n":"Kichererbsenmehl"},{"a":"30 g","n":"Leinsamen (fein gemahlen)"},{"a":"9 g","n":"Salz"},{"a":"1 TL","n":"Paprikapulver"},{"a":"230 g","n":"Karotten, sehr fein gerieben"},{"a":"430 ml","n":"Wasser"},{"a":"45 ml","n":"Olivenöl oder Rapsöl"},{"h":"Komplex"},{"a":"120 g","n":"Kichererbsenmehl"},{"a":"60 g","n":"Dinkelvollkornmehl"},{"a":"60 g","n":"Emmervollkornmehl"},{"a":"60 g","n":"Hafermehl"},{"a":"20 g","n":"Leinsamen (fein gemahlen)"},{"a":"30 g","n":"Hanfsamen (fein gemahlen)"},{"a":"15 g","n":"Chiasamen (fein gemahlen)"},{"a":"9 g","n":"Salz"},{"a":"1 TL","n":"Paprikapulver"},{"a":"230 g","n":"Karotten, sehr fein gerieben"},{"a":"400 ml","n":"Wasser"},{"a":"45 ml","n":"Olivenöl oder Rapsöl"}],"st":["Alle trockenen Zutaten gut vermischen. Karotten, Wasser und Öl unterrühren. Teig 5–10 Minuten quellen lassen.","Konsistenz prüfen: Der Teig soll weich und streichfähig sein. Falls nötig, schluckweise etwas Wasser zugeben.","Teig sehr dünn auf zwei mit Backpapier belegte Bleche streichen.","Bei 170 °C Umluft 20 Minuten backen.","In Stücke schneiden.","Weitere 20–30 Minuten backen, bis alles trocken und knusprig ist, aber nicht zu dunkel (ansonsten wird es bitter)","Ofen ausschalten, Tür leicht öffnen, 10 Minuten nachtrocknen lassen."],"id":"protein-knaeckebrot","y":[2,"b"],"gfn":"In der Variante „Einfach“.","hp":true,"ges":true},{"t":"Laugenstangen","s":"Brot","c":"Schweiz & Deutschland","time":"1 h 30 Min + 1 Nacht","min":90,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"1000 g","n":"Mehl"},{"a":"1.5 TL","n":"Hefe"},{"a":"35 g","n":"Salz"},{"a":"3TL","n":"Kümmel, gehäuft"},{"a":"570 ml","n":"Wasser"},{"a":"50 g","n":"Butter"},{"a":"500ml","n":"kaltes Wasser"},{"a":"23g","n":"Natronlauge"}],"st":["Alle Zutaten vom Teig, ausser Butter, ca. 10 Minuten kneten. Butter unterheben und weitere 5 Minuten kneten.","Teig gehen lassen (ca. 2-3 Stunden).","80g grosse Stangen formen und abgedeckt über Nacht kalt stellen (Keller oder Kühlschrank). Am morgen min. 60 min. von beiden Seiten Anhäuten (trocknen) lassen. Wenn die Oberfläche der Brötchen zu feucht ist, entstehen Blasen beim Backen.","VORSICHT, nun sorgfältig mit Handschuhen arbeiten, da Lauge ätzend wirken kann.","Wasser für die Lauge in einen Glasbehälter giessen, langsam mit Schneebesen Natron einrühren (nie umgekehrt).","Brötchen langsam durch die Lauge ziehen und auf Silikonbackpapier legen.","Bei 220 °C ca. 20 min backen."],"id":"laugenstangen","y":[20,"s"],"hp":false,"ges":false},{"t":"Rüebli Buns","s":"Brot","c":"Schweiz & Deutschland","time":"1 h + 1 Nacht","min":60,"wait":true,"vegan":false,"veg":true,"gf":false,"i":[{"a":"100 ml","n":"Milch"},{"a":"100 ml","n":"Rüeblisaft (Karottensaft)"},{"a":"0.5 Pkg","n":"Hefe"},{"a":"20 g","n":"Honig"},{"a":"40 g","n":"Butter, weich"},{"a":"13 g","n":"Salz"},{"a":"0.5 TL","n":"Koriandersamen, gemahlen"},{"a":"0.25 TL","n":"Kardamom, gemahlen"},{"a":"0.25 TL","n":"Chiliflocken"},{"a":"250 g","n":"Rüebli (Karotten)"},{"a":"500 g","n":"Mehl"},{"a":"50 g","n":"gemischte Kerne und Samen (Leinsamen, Sonnenblumenkerne, Sesam)"}],"st":["Die Milch und den Rüeblisaft leicht erwärmen. Honig, Butter, Salz und die Gewürze dazugeben und verrühren.","Die Rüebli schälen und fein häckseln oder reiben. Beides in die Rührschüssel geben und untermischen. Das Mehl nach und nach einarbeiten, bis ein geschmeidiger Teig entsteht. Diesen über Nacht gehen lassen.","Den Teig zu aprikosengrossen Kugeln rollen und auf ein mit Backpapier belegtes Blech setzen. Die Kugeln sollten sich nur leicht berühren. Mit Wasser bestreichen und mit dem Kernen-Samen-Mix bestreuen.","Für Burger oder Hot Dogs 80-100g jeweils abstechen für 10-12 Buns.","Im auf 180 Grad vorgeheizten Ofen etwa 35 Minuten backen.","Schnelle Variante:","Ganze Packung Hefe verwenden und Teig abgedeckt 1 Stunde ruhen lassen.","Ergibt ca. ein halbes Blech."],"id":"rueebli-buns","y":[12,"s"],"hp":false,"ges":true},{"t":"Vegane Burger Buns","s":"Brot","c":"","time":"7 h 30 Min","min":450,"wait":false,"vegan":true,"veg":true,"gf":false,"i":[{"h":"Vorteig"},{"a":"100 ml","n":"Pflanzenmilch (Soja oder Hafer)"},{"a":"100 g","n":"Weizenmehl Type 405"},{"a":"½ Packung","n":"Trockenhefe (ca. 3–4 g)"},{"a":"1 TL","n":"Zucker"},{"h":"Hauptteig"},{"a":"150 ml","n":"Pflanzenmilch"},{"a":"35–40 g","n":"Zucker"},{"a":"60 ml","n":"Rapsöl"},{"a":"370 g","n":"Weizenmehl Type 405"},{"a":"30 g","n":"Hafermehl"},{"a":"10 g","n":"Salz"},{"a":"50 g","n":"Karotten, gehäckselt"},{"a":"100 g","n":"Rote Bete, gehäckselt"},{"a":"10 g","n":"Hanfsamen (geschält)"},{"a":"5 g","n":"Flohsamenschalen"},{"a":"30 ml","n":"Wasser (zum Quellen)"}],"st":["Alle Zutaten des Vorteiges zusammen mischen. Abdecken, 30-60 Minuten bei Raumtemperatur stehen lassen.","5 g Flohsamenschalen mit 30 ml Wasser 5-10 Minuten quellen lassen","Pflanzenmilch, Zucker und Rapsöl zum Vorteig geben und kurz verrühren.","Restliche Zutaten zugeben und 10-12 Minuten kneten. Teig sollte noch sehr weich und leicht klebrig sein. Bei Bedarf noch 1-2 EL Wasser beifügen.","4-4,5 h abgedeckt gehen lassen. Optional nach 2 Stunden sanft dehnen und falten.","Teig in ca. 10 Buns à 100-110g formen und flach gedrückt auf Backpapeir legen. Mit Milch bestreichen und Sesam aufstreuen. Dann nochmal ca. 1.5 h gehen lassen.","Bei 190 °C Ober-/Unterhitze ca. 15 Minuten backen und weitere 5 Minuten bei 16‘°.","Nach dem Backen sofort leicht mit Pflanzenmilch bestreichen und abdecken"],"id":"vegane-burger-buns","y":[10,"s"],"hp":false,"ges":false},{"t":"Knoblauch-Kräuter-Brot","s":"Brot","c":"","time":"4 h","min":240,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"300 g","n":"Mehl"},{"a":"180 ml","n":"Wasser"},{"a":"0.5 Pkg","n":"Trockenhefe"},{"a":"7 g","n":"Zucker"},{"a":"12 g","n":"Salz"},{"a":"15 ml","n":"Olivenöl"},{"a":"150 g","n":"Butter Zimmertemperatur"},{"a":"1 Bund","n":"frischer Basilikum (oder andere Kräuter der Wahl)"},{"a":"2-3 Zehen","n":"Knoblauch, fein gehackt oder gepresst"},{"a":"","n":"Salz"}],"st":["Zutaten für das Brot min. 10 Minuten in einer Küchenmaschine Kneten.","2-3 Stunden gehen lassen.","Basilikum und Knoblauch fein schneiden und mit Salz und Butter vermengen. Butter sollte so warm wie möglich sein, ohne dass sie jedoch schmilzt, damit sie sich nachher gut verteilen lässt.","Brotteig auswallen und mit Knoblauchbutter bestreichen. Einrollen und in einer Kastenform nochmal 30-60 Minuten gehen lassen.","Bei 200°C ca. 35-45 Minuten backen.","Lauwarm servieren – optimal als Grillbeilage.","Variationen","Anstelle der Kräuterbutter, kann auch rotes oder grünes Pesto verwendet werden und es kann zusätzlich noch Käse beigegeben werden."],"id":"knoblauch-kraeuter-brot","y":[1,"br"],"hp":false,"ges":false},{"t":"Pao de Queijo","s":"Brot","c":"Amerika","time":"45 Min","min":45,"wait":false,"vegan":false,"veg":true,"gf":true,"i":[{"a":"125 ml","n":"Wasser"},{"a":"125 ml","n":"Milch"},{"a":"65g","n":"Butter"},{"a":"1 TL","n":"Salz"},{"a":"200g","n":"Polvilho Doce (Tapioka Mehl)"},{"a":"200g","n":"Polvilho Açedo"},{"a":"2","n":"Eier"},{"a":"200g","n":"geriebener Käse (Parmesan und Gouda)"},{"a":"1 TL","n":"Backpulver"}],"st":["Backofen auf 180° vorheizen.","Das Wasser wird mit einem Teil der Milch, der Butter und dem Salz zum Kochen gebracht und dann vom Herd genommen. Dann wird das Tapiokamehl zu der Flüssigkeit gegeben und mit einem Holzlöffel kurz untergerührt. Dann kommen die Eier sowie der Rest der Milch hinzu und werden gut mit der Masse verknetet.","Zum Schluss kommt der Käse hinzu der am besten mit den Händen in den Teig eingearbeitet wird.","Der Teig sollte noch leicht klebrig sein.","Mit Hilfe eines Esslöffels oder einem Eisportionierer den Teig in Kugeln formen und mit etwas Abstand auf ein mit Backpapier ausgelegtes Backblech legen.","Nach 20-25 Minuten Backzeit sind sie von außen knusprig und von innen ganz weich.","Das Tapiokamhel (doce und açedo) kann beliebig im Verhältnis geändert werden (z.B. auch nur  doce)"],"id":"pao-de-queijo","y":[30,"s"],"hp":false,"ges":false},{"t":"Naan","s":"Brot","c":"Indien","time":"2 h","min":120,"wait":false,"vegan":false,"veg":true,"gf":false,"i":[{"a":"215 g","n":"Mehl"},{"a":"0.5 TL","n":"Flohsamenschalen"},{"a":"1 EL","n":"Chiasamen (am besten gemahlen)"},{"a":"1 TL","n":"Trockenhefe"},{"a":"1 TL","n":"Zucker"},{"a":"1 TL","n":"Salz"},{"a":"180 g","n":"Skyr oder Magerquark"},{"a":"20-25 ml","n":"Milch oder Wasser"},{"a":"1 EL","n":"Öl"},{"a":"1","n":"Ei"}],"st":["Alle Zutaten kurz zusammen Mischen. 10-15 Minuten ruhen lassen und dann nochmal 8–10 Minuten kneten.","Teig ist sehr weich, elastisch und leicht klebrig sein, aber nicht flüssig.","Abgedeckt 60–90 Minuten gehen lassen bis etwa verdoppelt.","Teig in 6 Stücke teilen, sanft entgasen, und mit eingeölten Händen sanft in Form ziehen.","Beschichtete Pfanne gut vorheizen (mittel-hoch). Fladen in die Pfanne geben und sofort auf der oberen Seite leicht mit Wasser bestreichen.","Pro Seite ca. 1 Minute backen bis Blasen entstehen und braune Stellen da sind.","Ergibt 6 Naan"],"id":"naan","y":[6,"s"],"img":"naan.jpg","hp":false,"ges":false},{"t":"Tortilla Wraps","s":"Brot","c":"Amerika","time":"45 Min","min":45,"wait":false,"vegan":true,"veg":true,"gf":true,"i":[{"h":"Variante 1"},{"a":"240 g","n":"weisse Bohnen (1 Dose abgetropft)"},{"a":"1 EL","n":"Olivenöl"},{"a":"2 EL","n":"Wasser"},{"a":"60 g","n":"Hafermehl"},{"a":"40 g","n":"Dinkelmehl"},{"a":"1 TL","n":"Flohsamenschalen"},{"a":"1 TL","n":"Salz"},{"h":"Variante 2"},{"a":"150 g","n":"Hafermehl"},{"a":"50 g","n":"Leinsamen, fein gemahlen"},{"a":"500 ml","n":"Wasser"},{"a":"1TL","n":"Salz"}],"st":["Variante 1 (kaum Unterschied zu echten Tortillas)","Weiße Bohnen zusammen mit Olivenöl und Wasser im Mixer sehr fein pürieren. Danach Hafermehl, Dinkelmehl, Flohsamenschalen und Salz hinzufügen und zu einem weichen, formbaren Teig vermischen. Falls nötig, esslöffelweise etwas Wasser ergänzen oder etwas Mehl zugeben.","Den Teig 20–30 Minuten ruhen lassen. Anschließend in 5 Portionen a 75 g teilen und dünn ausrollen.","In einer gut vorgeheizten Pfanne ohne zusätzliches Öl bei mittlerer bis mittelhoher Hitze backen: erste Seite ca. 2–3 Minuten, zweite Seite ca. 1–2 Minuten.","Variante 2 (eher weich wie Pfannkuchen)","Alle Zutaten mischen (allenfalls direkt mit den Leinsamen im Mixer).  Teig min. 15 Minuten Ruhen lassen","In einer Pfanne 4-5 Minuten auf der ersten Seite und 1-2 Minuten auf der zweiten Seite bei mittlerer Hitze anbraten. Wirklich erst wenden, wenn der Wrap schon relativ fest ist (dauert viel länger als z.B. bei Pfannkuchen). Falls die Masse zu sehr eindickt, nochmal Wasser dazu geben.","Varianten:","Anstelle von nur Wasser, kann man auch Spinat, Kräuter, Zwiebel/Knoblauchpulver oder ähnlichem noch mit mixen. Entsprechend muss die Wassermenge etwas reduziert werden. Ergibt 6 Wraps."],"id":"tortilla-wraps","y":[5,"s"],"gfn":"In Variante 2.","hp":false,"ges":true},{"t":"Pizzateig Einfach","s":"Pizza, Focaccia & Flammkuchen","c":"Italien & Mittelmeer","time":"30 Min + 1 Nacht","min":30,"wait":true,"vegan":true,"veg":true,"gf":false,"i":[{"a":"500 g","n":"Weissmehl"},{"a":"300g","n":"lauwarmes Wasser"},{"a":"1-2 g","n":"Trockenhefe"},{"a":"15 g","n":"Salz"},{"a":"etwas","n":"Olivenöl"}],"st":["Mehl, Wasser und Hefe kurz Vermischen und 15 Minuten ruhen lassen.","Salz zugeben und ca. 10 Minuten kneten (auf niedriger Stufe). Am Schluss etwas Olivenöl dazugeben.","Über Nacht gehen lassen.","Den Teig nicht auswallen, sondern durch Ziehen und Dehnen in Form bringen. (oder ein YouTube Video anschauen wie man professionell Pizza formt)","Im möglichst heissen Ofen mit Unterhitze backen."],"id":"pizzateig-einfach","y":[3,"pz"],"hp":false,"ges":false},{"t":"Pizzateig","s":"Pizza, Focaccia & Flammkuchen","c":"Italien & Mittelmeer","time":"2 h + 3 Tage gehen","min":120,"wait":true,"vegan":true,"veg":true,"gf":false,"i":[{"a":"400 g","n":"Weizenmehl hell (550)"},{"a":"130 g","n":"Hartweizengriess"},{"a":"100 g","n":"Urdinkelmehl hell"},{"a":"35 g","n":"Dinkelvollkornmehl"},{"a":"5 g","n":"Gerstenmalzmehl hell"},{"a":"500 ml","n":"Wasser"},{"a":"21 g","n":"Salz"},{"a":"1 g","n":"Trockenhefe"},{"a":"1 EL","n":"Olivenöl"}],"st":["Mehl + Wasser kurz zusammenmischen, ca. 1. Minute, bzw. bis alles gut vermengt ist, ohne Salz & Hefe","30-40 Minuten ruhen lassen","Salz & Trockenhefe in den Teig geben. Ca. 10 Minuten auf niedriger Stufe sanft kneten. Gegen Ende 1 EL Olivenöl hinzufügen (ca. 2-3 Minuten mitkneten)","1 Stunde ruhen lassen. Dabei alle 20 Minuten den Teig ca. 4-mal leicht dehnen und falten (strech & fold)","4 Portionen à 250–270 g abstechen und Kugeln formen. Leicht mit Olivenöl einreiben und in 4 kleinere Tupperboxen geben. Dabei beachten, dass der Teig mehr als das doppelte aufgeht. 20–30 Minuten bei Raumtemperatur ruhen lassen (bei kalter Raumtemperatur (20°C), darf es auch bis zu 1h sein","72 h (3 Tage) im Kühlschrank (3–6 °C) gehen lassen.","Teig 2 Stunden vor dem Backen aus dem Kühlschrank nehmen. Teig ohne Falten und Kneten aus der Dose stürzen oder mit Spachtel entnehmen. Arbeitsfläche und Teig mit Semola bestreuen und sanft dehnen bis zur gewünschten Form, nicht ausrollen. Manchmal hilft es, wenn man den Teig kurz ruhen lässt, bevor man weiterzieht, dann lässt er sich wieder einfacher Dehnen.","Backen: ca. 8 Minuten bei 270°C (Unterhitze mit Umluft) in der untersten Rille des Backofens,"],"id":"pizzateig","y":[4,"pz"],"var":{"lab const NUM = /(\d+(?:[.,]\d+)?)?\s?([½¼¾⅓⅔])|(\d+)\/(\d+)|(\d+(?:[.,]\d+)?)/g;
function scaleAmt(s, f){ if(f === 1) return s;
  return s.replace(NUM, (m, w, fr, a, b, n) => { let v;
    if(fr !== undefined) v = (w ? pnum(w) : 0) + FR[fr]; else if(a !== undefined) v = a / b; else v = pnum(n);
    return fmt(v * f); }); }
const NU = /(\d+(?:[.,]\d+)?)(?:\s?[–-]\s?(\d+(?:[.,]\d+)?))?(\s?)(kg|g|ml|dl|l)\b/g;
function scaleName(s, f){ if(f === 1) return s;
  return s.replace(NU, (m, a, b, sp, u) => fmt(pnum(a) * f) + (b !== undefined ? '–' + fmt(pnum(b) * f) : '') + sp + u); }
let cur = null, curN = 1, curV = 0;
function eff(){ const r = cur, o = r.var ? r.var.opts[curV] : null;
  if(!o) return r;
  return {...r, i: r.i.map((x,k) => o.i && o.i[k] ? {...x, ...o.i[k]} : x), st: r.st.map((t,k) => o.st && o.st[k] !== undefined ? o.st[k] : t),
    time: o.time || r.time, vl: r.var.label + ' ' + o.l}; }
const unitLabel = (r, n) => UNITS[r.y[1]][Math.abs(n - 1) < 1e-9 ? 0 : 1];
function factor(){ return cur ? curN / cur.y[0] : 1; }
function renderBody(){
  const r = eff(), f = factor(), qt = terms(st.q);
  $('#smeta').innerHTML = `<span class="time">${clock}ca. ${esc(r.time)}</span>${tags(r)}`;
  if(r.var) document.querySelectorAll('#vseg button').forEach((b,k) => b.setAttribute('aria-pressed', k === curV));
  const done = checked[r.id] || (checked[r.id] = new Set());
  const ing = r.i.map((x,k) => x.h ? `<div class="sub">${esc(x.h)}</div>` : `<div class="it" role="checkbox" tabindex="0" data-k="${k}" aria-checked="${done.has(k)}"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span><span class="a">${esc(scaleAmt(x.a, f))}</span><span class="n">${hl(scaleName(x.n, f), qt)}</span></div>`).join('');
  const steps = r.st.map(t => /:$/.test(t) && t.length < 40 ? `<li class="subh">${esc(t.replace(/:$/,''))}</li>` : `<li>${esc(t)}</li>`).join('');
  $('#sbody').innerHTML = `<section><div class="ingbar"><h4>Zutaten</h4><span class="prog" id="prog"></span></div><div class="ing" id="ing">${ing}</div></section>` + (steps ? `<section><h4>Zubereitung</h4><ol class="steps">${steps}</ol></section>` : '')
    + ((r.gf && (r.gfn || /hafer/i.test(r.ingText))) ? `<p class="note"><b>Glutenfrei:</b> ${r.gfn ? esc(r.gfn) + ' ' : ''}${/hafer/i.test(r.ingText) ? 'Hafer nur glutenfrei, wenn als glutenfrei gekennzeichnet.' : ''}</p>` : '')
    + `<p class="note">Grundmenge ${fmt(r.y[0])} ${unitLabel(r, r.y[0])} (geschätzt). Mengen in der Zubereitung werden nicht umgerechnet. Zeitangaben sind Schätzungen inklusive Back- und Kochzeit.</p>`;
  updateProg();
  $('#yu').textContent = unitLabel(r, curN);
  const changed = Math.abs(f - 1) > 1e-9;
  $('#yreset').hidden = !changed; $('#yreset').textContent = `Original: ${fmt(r.y[0])} ${unitLabel(r, r.y[0])}`;
  $('#wa').href = 'https://wa.me/?text=' + encodeURIComponent(shareText());
}
function setN(v, fromInput){ if(!cur || !(v > 0)) return; curN = Math.min(Math.round(v * 100) / 100, 999); if(!fromInput) $('#yn').value = fmt(curN); renderBody(); }
$('#yn').oninput = e => { const v = pnum(e.target.value); if(v > 0) setN(v, true); };
$('#yn').onblur = () => { $('#yn').value = fmt(curN); };
$('#yup').onclick = () => setN(curN < 1 ? Math.min(1, curN + .25) : Math.floor(curN) + 1);
$('#ydown').onclick = () => setN(curN <= 1 ? Math.max(.25, curN - .25) : Math.ceil(curN) - 1);
$('#yreset').onclick = () => setN(cur.y[0]);
$('#vseg').onclick = e => { const b = e.target.closest('[data-v]'); if(!b) return; curV = +b.dataset.v; renderBody(); };
// checklist
const checked = {};
function totalIng(){ return cur.i.filter(x => !x.h).length; }
function updateProg(){ const n = checked[cur.id].size, tot = totalIng();
  $('#prog').innerHTML = n ? `${n} von ${tot} bereit · <button type="button" id="uncheck">Zurücksetzen</button>` : 'Zum Abhaken antippen'; }
function toggleIng(el){ const k = +el.dataset.k, set = checked[cur.id];
  set.has(k) ? set.delete(k) : set.add(k); el.setAttribute('aria-checked', set.has(k)); updateProg();
  if(set.size === totalIng()){ toast('Alles bereit, die Liste ist wieder leer'); const id = cur.id;
    setTimeout(() => { checked[id] = new Set(); if(cur && cur.id === id) document.querySelectorAll('#ing .it').forEach(e => e.setAttribute('aria-checked','false')), updateProg(); }, 900); } }
$('#sbody').addEventListener('click', e => { const it = e.target.closest('.it'); if(it) return toggleIng(it);
  if(e.target.id === 'uncheck'){ checked[cur.id] = new Set(); document.querySelectorAll('#ing .it').forEach(x => x.setAttribute('aria-checked','false')); updateProg(); } });
$('#sbody').addEventListener('keydown', e => { const it = e.target.closest('.it'); if(it && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); toggleIng(it); } });
// sharing
function shareText(){ const r = eff(), f = factor();
  const tg = [r.vegan ? 'vegan' : r.veg ? 'vegetarisch' : '', r.gf ? 'glutenfrei' : '', r.hp ? 'high protein' : '', r.ges ? 'gesund' : ''].filter(Boolean).join(', ');
  let t = `${r.t}\nFür ${fmt(curN)} ${unitLabel(r, curN)}${r.vl ? ' · ' + r.vl : ''} · ca. ${r.time}${tg ? ' · ' + tg : ''}\n\nZutaten\n`;
  r.i.forEach(x => { t += x.h ? `\n${x.h}\n` : `- ${[scaleAmt(x.a, f), scaleName(x.n, f)].filter(Boolean).join(' ')}\n`; });
  if(r.st.length){ t += '\nZubereitung\n'; let k = 0; r.st.forEach(s => { t += (/:$/.test(s) && s.length < 40) ? `\n${s}\n` : `${++k}. ${s}\n`; }); }
  return t + `\nAus dem Kochbuch von Micky & Nils`; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }
async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ const ta = document.createElement('textarea'); ta.className = 'copyfallback'; ta.value = text; ta.readOnly = true;
    $('#sbody').prepend(ta); ta.focus(); ta.select(); toast('Text markiert, bitte mit Kopieren übernehmen'); }
}
function menu(open){ $('#menu').hidden = !open; $('#sharebtn').setAttribute('aria-expanded', open); }
$('#sharebtn').onclick = e => { e.stopPropagation(); menu($('#menu').hidden); };
$('#menu').onclick = e => { const b = e.target.closest('[data-share]'); if(b){ const k = b.dataset.share;
    if(k === 'text') copy(shareText(), 'Rezept kopiert'); else copy(`${cur.t}: ${APP_URL}#${cur.id}`, 'Link kopiert'); }
  menu(false); };
document.addEventListener('click', e => { if(!e.target.closest('.share')) menu(false); });
// keep the screen on while a recipe is open
let wakeLock = null;
async function keepAwake(on){
  try {
    if(on && 'wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && $('#sheet').classList.contains('on')) keepAwake(true); });
// recipe sheet
let lastHash = '';
function openRecipe(id){
  const r = R.find(x => x.id === id); if(!r) return false; const qt = terms(st.q);
  cur = r; curN = r.y[0]; curV = 0; $('#yn').value = fmt(curN); menu(false);
  const vs = $('#vseg'); vs.hidden = !r.var;
  vs.innerHTML = r.var ? `<span class="vl">${esc(r.var.label)}</span>` + r.var.opts.map((o,k) => `<button type="button" data-v="${k}">${esc(o.l)}</button>`).join('') : '';
  const head = $('#shead'); head.style.background = TILE[r.s]; head.className = 'head' + dk(r.s);
  const sheet = $('#sheet'); sheet.style.setProperty('--sc', TILE[r.s]); sheet.style.setProperty('--sl', LIGHT[r.s] || TILE[r.s]);
  $('#ssec').innerHTML = `<span>${esc(r.s)}</span>${r.c ? '<span>·</span><span>' + esc(r.c) + '</span>' : ''}`;
  $('#st').textContent = r.t;
  const hero = $('#shero'); hero.hidden = !r.img; if(r.img){ hero.src = imgSrc(r); hero.alt = r.t; }
  renderBody();
  $('#sbody').scrollTop = 0; sheet.classList.add('on'); $('#scrim').classList.add('on'); keepAwake(true); $('#sclose').focus();
  return true;
}
function closeSheet(){ keepAwake(false); $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); $('#filters').classList.remove('on'); }
function closeRecipe(){ const wasOpen = $('#sheet').classList.contains('on'); closeSheet();
  if(wasOpen){ if(lastHash) location.hash = lastHash; else history.replaceState(null,'',location.pathname+location.search); } }
$('#grid').onclick = e => { const c = e.target.closest('.card'); if(!c) return; lastHash = location.hash.slice(1); location.hash = c.dataset.id; };
$('#sclose').onclick = closeRecipe; $('#scrim').onclick = () => { if($('#sheet').classList.contains('on')) closeRecipe(); else closeSheet(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeRecipe(); });
function route(){ const h = location.hash.slice(1);
  if(!h){ closeSheet(); st.view='home'; st.chap=null; render(); return; }
  if(h === 'alle'){ closeSheet(); st.view='list'; st.chap=null; render(); return; }
  if(CSLUG[h]){ closeSheet(); st.view='list'; st.chap=CSLUG[h]; render(); return; }
  if(R.some(r => r.id === h)){ if(st.view==='home'){ const r = R.find(x=>x.id===h); st.view='list'; st.chap=r.s; lastHash='k-'+slugify(r.s); render(); } openRecipe(h); } }
window.addEventListener('hashchange', route);
route();
</script>
